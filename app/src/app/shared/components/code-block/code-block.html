
    <div
      class="relative rounded-lg overflow-hidden border border-neutral-200 dark:border-white/10"
    >
      @if (label()) {
        <div
          class="px-3 py-1.5 bg-neutral-100 dark:bg-[#191d1a] border-b border-neutral-200 dark:border-white/10
          text-xs font-medium text-neutral-500 dark:text-neutral-400"
        >
          {{ label() }}
        </div>
      }
      <pre
        class="overflow-x-auto p-4 bg-neutral-50 dark:bg-neutral-950 text-sm leading-relaxed
          text-neutral-800 dark:text-neutral-200 font-mono"
      ><code>{{ code() }}</code></pre>
    </div>
