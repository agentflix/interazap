
    <div [class]="containerClasses()">
      @if (label()) {
        <af-form-label [label]="label()" [for]="inputId" [required]="required()" />
      }

      <div class="relative">
        <input
          [id]="inputId"
          [type]="visible() ? 'text' : 'password'"
          [class]="inputClasses()"
          [formControl]="control()"
          [placeholder]="placeholder()"
          [attr.data-test]="dataTest()"
          [attr.aria-invalid]="showError()"
          [readOnly]="disableAutofill()"
          [attr.autocomplete]="autocomplete()"
          (focus)="focusEmitter.emit()"
          (blur)="blurEmitter.emit()"
        />

        <!-- Toggle visibility -->
        <button
          type="button"
          class="absolute inset-y-0 right-0 flex items-center pr-3 text-neutral-400 hover:text-neutral-600 dark:hover:text-neutral-300 cursor-pointer transition-colors"
          (click)="toggleVisibility()"
          [attr.aria-label]="visible() ? 'Ocultar senha' : 'Mostrar senha'"
          tabindex="-1"
        >
          <lucide-icon [name]="visible() ? 'eye-off' : 'eye'" [size]="18" />
        </button>
      </div>

      @if (helpText() && !showError()) {
        <p class="mt-1 text-xs text-neutral-500 dark:text-neutral-400">{{ helpText() }}</p>
      }

      <af-form-error [show]="showError()" [message]="errorMessage()" />
    </div>
