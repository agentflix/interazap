
    <div [class]="containerClasses()" #root>
      @if (label()) {
        <af-form-label [label]="label()" [required]="required()" />
      }
      <div class="relative">
        <lucide-icon
          name="search"
          [size]="15"
          class="absolute left-3 top-1/2 -translate-y-1/2 text-neutral-400"
        />
        <input
          type="text"
          [formControl]="control()"
          [placeholder]="placeholder()"
          class="w-full pl-9 pr-3 py-2 rounded-md border border-neutral-300 dark:border-neutral-600
            bg-white dark:bg-neutral-800 text-sm text-neutral-900 dark:text-neutral-50
            placeholder:text-neutral-400 focus:outline-none focus:ring-2
            focus:ring-accent-500/30 focus:border-accent-500"
          (input)="onInput()"
          (focus)="showDropdown.set(true)"
        />
      </div>
      @if (showDropdown() && filtered().length > 0) {
        <div
          class="absolute z-20 mt-1 w-full rounded-lg border border-neutral-200
          dark:border-neutral-700 bg-white dark:bg-neutral-900 shadow-md overflow-hidden"
        >
          <af-scroll-area maxHeight="12rem">
            <div class="p-1">
              @for (opt of filtered(); track opt.value) {
                <button
                  type="button"
                  class="w-full text-left px-3 py-2 rounded-md text-sm text-neutral-700
                    dark:text-neutral-200 hover:bg-neutral-100 dark:hover:bg-neutral-800"
                  (click)="selectOption(opt)"
                >
                  {{ opt.label }}
                </button>
              }
            </div>
          </af-scroll-area>
        </div>
      }
      @if (helpText()) {
        <p class="mt-2 text-xs text-neutral-500 dark:text-neutral-400">{{ helpText() }}</p>
      }
    </div>
