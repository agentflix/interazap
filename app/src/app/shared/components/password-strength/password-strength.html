
    <div [class]="classContainer()">
      @if (label()) {
        <af-form-label [label]="label()" [for]="inputId" [required]="required()" />
      }

      <!-- Input with toggle -->
      <div class="relative">
        <input
          [id]="inputId"
          [type]="visible() ? 'text' : 'password'"
          [class]="inputClasses()"
          [formControl]="control()"
          [placeholder]="placeholder()"
          [attr.data-test]="dataTest()"
          autocomplete="new-password"
        />

        <button
          type="button"
          class="absolute inset-y-0 right-0 flex items-center pr-3 text-neutral-400 hover:text-neutral-600 dark:hover:text-neutral-300 cursor-pointer transition-colors"
          (click)="toggleVisibility()"
          [attr.aria-label]="visible() ? 'Ocultar senha' : 'Mostrar senha'"
          tabindex="-1"
        >
          <lucide-icon [name]="visible() ? 'eye-off' : 'eye'" [size]="18" />
        </button>
      </div>

      <!-- Strength bar -->
      @if (strength().level !== 'empty') {
        <div class="mt-2 space-y-2">
          <!-- Bar segments -->
          <div class="flex gap-1">
            @for (i of segments; track i) {
              <div
                class="h-1.5 flex-1 rounded-full transition-colors duration-300"
                [class]="
                  i < strength().score ? strength().color : 'bg-neutral-200 dark:bg-[#232823]'
                "
              ></div>
            }
          </div>

          <!-- Label -->
          <p class="text-xs font-medium" [class]="strengthLabelColor()">
            {{ strength().label }}
          </p>

          <!-- Checklist -->
          @if (showChecklist()) {
            <ul class="space-y-1">
              @for (check of strength().checks; track check.label) {
                <li
                  class="flex items-center gap-1.5 text-xs"
                  [class]="
                    check.passed
                      ? 'text-green-600 dark:text-green-400'
                      : 'text-neutral-400 dark:text-neutral-500'
                  "
                >
                  <lucide-icon [name]="check.passed ? 'check' : 'x'" [size]="14" />
                  {{ check.label }}
                </li>
              }
            </ul>
          }
        </div>
      }

      <af-form-error [show]="showError()" [message]="errorMessage()" />
    </div>
