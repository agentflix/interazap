
    <div [class]="containerClasses()">
      @if (label()) {
        <af-form-label [label]="label()" [required]="required()" />
      }
      <div class="relative">
        <input
          type="date"
          [formControl]="control()"
          [min]="min()"
          [max]="max()"
          class="w-full rounded-md border border-neutral-300 dark:border-neutral-600
            bg-white dark:bg-neutral-800 text-sm text-neutral-900 dark:text-neutral-50
            px-3 py-2 transition-colors
            focus:outline-none focus:ring-2 focus:ring-accent-500/30 focus:border-accent-500
            disabled:opacity-50 disabled:cursor-not-allowed"
        />
      </div>
      @if (helpText() && !(control().invalid && control().touched)) {
        <p class="mt-2 text-xs text-neutral-500 dark:text-neutral-400">{{ helpText() }}</p>
      }
      <af-form-error
        [show]="control().invalid && control().touched"
        [message]="'Campo obrigatório.'"
      />
    </div>
