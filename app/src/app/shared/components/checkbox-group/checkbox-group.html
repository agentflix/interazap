<div class="mb-4">
  @if (label()) {
    <p class="text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-2">{{ label() }}</p>
  }
  @for (option of options(); track option.value) {
    <div class="flex items-start gap-2.5">
      <button
        type="button"
        role="checkbox"
        [attr.aria-checked]="isSelected(option.value)"
        [attr.aria-label]="option.label"
        [class]="boxClasses(option.value)"
        (click)="toggle(option.value, $event)"
      >
        @if (isSelected(option.value)) {
          <svg
            viewBox="0 0 12 12"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            class="size-3 stroke-white"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="1.5,6 4.5,9 10.5,3" />
          </svg>
        }
      </button>
      <label
        class="text-sm text-neutral-700 dark:text-neutral-300 cursor-pointer select-none leading-5"
        tabindex="0"
        (click)="toggle(option.value, $event)"
        (keydown.enter)="toggle(option.value, $event)"
        (keydown.space)="toggleSpace(option.value)"
      >
        {{ option.label }}
      </label>
    </div>
  }
</div>
