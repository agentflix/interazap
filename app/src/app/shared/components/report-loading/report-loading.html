<!-- KPI skeletons -->
@if (layout() === 'kpi+chart' || layout() === 'kpi+table') {
  <div class="grid gap-4" [class]="getKpiCols(kpiCount())">
    @for (i of kpiItems(); track $index) {
      <af-card>
        <af-skeleton variant="rectangular" width="100%" height="4rem" />
      </af-card>
    }
  </div>
}

<!-- Chart skeleton -->
@if (layout() === 'kpi+chart' || layout() === 'chart') {
  <af-card>
    <af-skeleton variant="rectangular" width="100%" height="16rem" />
  </af-card>
}

<!-- Table skeleton -->
@if (layout() === 'kpi+table' || layout() === 'table') {
  <af-card>
    @for (row of tableRowItems(); track $index) {
      <af-skeleton variant="text" width="100%" height="2.5rem" class="mb-2 block" />
    }
  </af-card>
}
