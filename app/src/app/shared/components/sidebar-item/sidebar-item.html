
    <a
      [routerLink]="href()"
      class="flex items-center gap-3 px-3 py-2 rounded-md text-sm font-medium transition-colors"
      [class.bg-primary-700]="active()"
      [class.text-white]="active()"
      [class.text-neutral-300]="!active()"
      [class.hover:bg-primary-700/50]="!active()"
      [class.hover:text-white]="!active()"
    >
      @if (icon()) {
        <lucide-icon [name]="icon()!" [size]="18" />
      }
      @if (!collapsed()) {
        <span>{{ label() }}</span>
      }
      @if (badge() && !collapsed()) {
        <span class="ml-auto bg-accent-500 text-white text-xs font-bold rounded-full px-1.5 py-0.5">
          {{ badge() }}
        </span>
      }
    </a>
