
    <div [class]="containerClasses()">
      @if (label()) {
        <af-form-label [label]="label()!" [for]="inputId" [required]="required()" />
      }

      <textarea
        #textarea
        [id]="inputId"
        [formControl]="control()"
        [placeholder]="placeholder()"
        [rows]="rows()"
        [class]="textareaClasses()"
        [attr.maxlength]="maxLength() ?? null"
        [attr.data-test]="dataTest()"
        [attr.aria-invalid]="showError()"
        (input)="onInput()"
      ></textarea>

      <div class="flex items-center justify-between mt-1">
        @if (helpText() && !showError()) {
          <p class="mt-3 text-xs text-neutral-500 dark:text-neutral-400">{{ helpText() }}</p>
        }
        <af-form-error [show]="showError()" [message]="errorMessage()" />
        @if (maxLength()) {
          <span class="text-xs text-neutral-400 dark:text-neutral-500 ml-auto tabular-nums">
            {{ charCount() }}/{{ maxLength() }}
          </span>
        }
      </div>
    </div>
