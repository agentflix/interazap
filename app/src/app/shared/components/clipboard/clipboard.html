
    <div
      class="inline-flex items-center gap-2 bg-neutral-100 dark:bg-[#191d1a]
      rounded-lg px-3 py-2 border border-neutral-200 dark:border-white/10"
    >
      <code class="text-sm text-neutral-800 dark:text-neutral-200 font-mono truncate">{{
        text()
      }}</code>
      <button
        type="button"
        class="shrink-0 p-1 rounded hover:bg-neutral-200 dark:hover:bg-[#232823] transition-colors cursor-pointer"
        (click)="copy()"
      >
        <lucide-icon
          [name]="copied() ? 'check' : 'copy'"
          [size]="14"
          [class.text-green-500]="copied()"
          [class.text-neutral-500]="!copied()"
        />
      </button>
    </div>
