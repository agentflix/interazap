<div class="space-y-3">
  <!-- Page header: title + filters + create button -->
  <af-page-title [title]="title()" [subtitle]="subtitle()">
    <ng-content select="[filters]" />
    @if (createLabel()) {
      <af-button variant="primary" size="sm" (click)="create.emit()">
        <lucide-icon name="plus" [size]="16" class="block" />
        {{ createLabel() }}
      </af-button>
    }
  </af-page-title>

  <!-- Content area -->
  <div
    class="bg-white dark:bg-[#191d1a]/50 rounded-xl border border-neutral-200 dark:border-white/[0.06] overflow-hidden"
  >
    <!-- Table header: search (left) + table-actions slot (right) -->
    <div
      class="flex items-center justify-between gap-3 px-4 py-3 border-b border-neutral-200 dark:border-white/[0.06]"
    >
      <div class="w-full max-w-[200px]">
        <af-search-input
          [control]="searchControl"
          [label]="searchLabel()"
          [placeholder]="searchPlaceholder()"
          [spacing]="false"
          size="sm"
        />
      </div>
      <div class="flex items-center gap-2">
        <ng-content select="[table-actions]" />
      </div>
    </div>

    @if (loading()) {
      <af-skeleton-table-row [columns]="skeletonColumns()" [rows]="skeletonRows()" />
    } @else if (empty()) {
      <af-empty-state [title]="emptyTitle()" [description]="emptyDescription()" />
    } @else {
      <ng-content />
    }
  </div>

  <!-- Pagination -->
  @if (!loading() && !empty() && lastPage() > 1) {
    <af-pagination
      [currentPage]="currentPage()"
      [lastPage]="lastPage()"
      [perPage]="perPage()"
      [total]="total()"
      (pageChange)="pageChange.emit($event)"
    />
  }
</div>
