<div class="space-y-3">
  <!-- Header: Title + Create button -->
  <af-page-title [title]="title()" [subtitle]="subtitle()">
    <!-- Search bar + optional filter slot -->
    <div class="flex flex-col sm:flex-row items-start sm:items-end gap-3">
      <div class="w-full sm:max-w-xs">
        <af-search-input
          [control]="searchControl"
          [label]="searchLabel()"
          [placeholder]="searchPlaceholder()"
          [spacing]="false"
          size="sm"
        />
      </div>
      <ng-content select="[filters]" />
    </div>

    @if (createLabel()) {
      <af-button variant="primary" size="sm" (click)="create.emit()">
        <lucide-icon name="plus" [size]="16" class="block" />
        {{ createLabel() }}
      </af-button>
    }
  </af-page-title>

  <!-- Content area -->
  <div
    class="bg-white dark:bg-neutral-800/50 rounded-xl border border-neutral-200 dark:border-neutral-700/50 overflow-hidden"
  >
    @if (loading()) {
      <af-skeleton-table-row [columns]="skeletonColumns()" [rows]="skeletonRows()" />
    } @else if (empty()) {
      <af-empty-state [title]="emptyTitle()" [description]="emptyDescription()" />
    } @else {
      <ng-content />
    }
  </div>

  <!-- Pagination -->
  @if (!loading() && !empty() && lastPage() > 1) {
    <af-pagination
      [currentPage]="currentPage()"
      [lastPage]="lastPage()"
      [perPage]="perPage()"
      [total]="total()"
      (pageChange)="pageChange.emit($event)"
    />
  }
</div>
