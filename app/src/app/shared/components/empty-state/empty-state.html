
    <div class="flex flex-col items-center justify-center py-16 px-6 text-center">
      <div
        class="size-16 mb-4 rounded-full bg-neutral-100 dark:bg-neutral-800 flex items-center justify-center"
      >
        @if (iconName()) {
          <ng-icon [name]="iconName()!" size="32" class="text-neutral-400 dark:text-neutral-500" />
        } @else if (icon()) {
          <ng-content select="[icon]" />
        } @else {
          <svg
            class="size-8 text-neutral-400 dark:text-neutral-500"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5m6 4.125l2.25 2.25m0 0l2.25 2.25M12 13.875l2.25-2.25M12 13.875l-2.25 2.25M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z"
            />
          </svg>
        }
      </div>

      <h3 class="text-base font-semibold text-neutral-900 dark:text-neutral-50 mb-1">
        {{ title() }}
      </h3>

      @if (description()) {
        <p class="text-sm text-neutral-500 dark:text-neutral-400 max-w-sm mb-5">
          {{ description() }}
        </p>
      }

      <div class="mt-2">
        <ng-content />
      </div>
    </div>
