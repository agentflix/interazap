
    <div class="border-b border-neutral-200 dark:border-neutral-700">
      <nav class="flex gap-0 -mb-px" [class.w-full]="fullWidth()" role="tablist">
        @for (tab of tabs(); track tab.id) {
          <button
            type="button"
            role="tab"
            [attr.aria-selected]="tab.id === activeTab()"
            [disabled]="tab.disabled ?? false"
            class="px-4 py-2.5 text-sm font-medium transition-colors whitespace-nowrap
              border-b-2 -mb-px cursor-pointer
              disabled:opacity-40 disabled:cursor-not-allowed"
            [class.flex-1]="fullWidth()"
            [class.border-accent-500]="tab.id === activeTab()"
            [class.text-accent-600]="tab.id === activeTab()"
            [class.dark:text-accent-400]="tab.id === activeTab()"
            [class.border-transparent]="tab.id !== activeTab()"
            [class.text-neutral-500]="tab.id !== activeTab()"
            [class.dark:text-neutral-400]="tab.id !== activeTab()"
            [class.hover:text-neutral-700]="tab.id !== activeTab()"
            [class.dark:hover:text-neutral-200]="tab.id !== activeTab()"
            [class.hover:border-neutral-300]="tab.id !== activeTab()"
            (click)="selectTab(tab)"
          >
            <div class="flex items-center gap-1.5" [class.justify-center]="fullWidth()">
              @if (!tab.icon) {
                <span>{{ tab.label }}</span>
              }
              @if (tab.icon) {
                <ng-icon [name]="tab.icon" size="14" [attr.aria-label]="tab.label"></ng-icon>
              }
              @if (tab.badge !== undefined && tab.badge !== null) {
                <span
                  class="rounded-full px-1.5 py-0.5 text-[10px] bg-neutral-100 dark:bg-neutral-800 text-neutral-600 dark:text-neutral-300"
                >
                  {{ tab.badge }}
                </span>
              }
            </div>
          </button>
        }
      </nav>
    </div>
