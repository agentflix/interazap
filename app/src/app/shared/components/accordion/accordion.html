
    <div class="border-b border-neutral-200 dark:border-neutral-700">
      <button
        type="button"
        class="flex items-center justify-between w-full px-4 py-3 text-left
          text-sm font-medium text-neutral-900 dark:text-neutral-50
          hover:bg-neutral-50 dark:hover:bg-neutral-800/50 transition-colors cursor-pointer"
        [attr.aria-expanded]="isOpen()"
        (click)="toggle()"
      >
        <span>{{ title() }}</span>
        <lucide-icon
          [name]="isOpen() ? 'chevron-up' : 'chevron-down'"
          [size]="16"
          class="text-neutral-400 transition-transform"
        />
      </button>
      @if (isOpen()) {
        <div class="px-4 pb-4 text-sm text-neutral-600 dark:text-neutral-400">
          <ng-content />
        </div>
      }
    </div>
