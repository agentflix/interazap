
    <div [class]="wrapperClasses()">
      <!-- Sender name (incoming only) -->
      @if (direction() === 'in' && senderName()) {
        <span class="text-xs font-semibold text-neutral-500 dark:text-neutral-400 mb-0.5">
          {{ senderName() }}
        </span>
      }

      <!-- Bubble -->
      <div [class]="bubbleClasses()">
        <p class="text-sm leading-relaxed whitespace-pre-wrap wrap-break-word">
          {{ message() }}
        </p>

        <!-- Footer: timestamp + status -->
        <div class="flex items-center justify-end gap-1 mt-1">
          <span class="text-[10px] opacity-60">{{ timestamp() }}</span>
          @if (direction() === 'out') {
            <lucide-icon
              [name]="status() === 'read' ? 'check-check' : 'check'"
              [size]="12"
              [class]="status() === 'read' ? 'text-white' : 'opacity-40'"
              class="block"
            />
          }
        </div>
      </div>
    </div>
