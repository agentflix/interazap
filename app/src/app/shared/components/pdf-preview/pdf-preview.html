
    <section
      class="rounded-lg border border-neutral-200 dark:border-neutral-700 bg-white dark:bg-neutral-900 p-4"
    >
      <div class="mb-3 flex items-center justify-between gap-3">
        <h3 class="text-sm font-semibold text-neutral-900 dark:text-neutral-50">{{ title() }}</h3>
        @if (src()) {
          <af-button variant="outline" size="sm" type="button" (click)="openExternal()">
            Abrir em nova aba
          </af-button>
        }
      </div>

      @if (src() && !loadError()) {
        <iframe
          class="h-105 w-full rounded-md border border-neutral-200 dark:border-neutral-700"
          [src]="safeSrc()"
          [title]="title()"
          (error)="onLoadError()"
        ></iframe>
      } @else {
        <div
          class="rounded-md border border-neutral-200 dark:border-neutral-700 bg-neutral-50 dark:bg-neutral-800 p-6 text-center"
        >
          <p class="mb-4 text-sm text-neutral-500 dark:text-neutral-400">
            Não foi possível renderizar a prévia do PDF neste navegador.
          </p>
          @if (src()) {
            <af-button variant="primary" size="sm" type="button" (click)="openExternal()">
              Abrir PDF
            </af-button>
          }
        </div>
      }
    </section>
