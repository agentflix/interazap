
    <div [class]="containerClasses()">
      @if (label()) {
        <af-form-label [label]="label()!" [required]="required()" />
      }

      <div [class]="groupClasses()">
        @for (option of options(); track option.value) {
          <label
            [class]="optionClasses(option)"
            [attr.data-test]="dataTest() ? dataTest() + '-' + option.value : null"
          >
            <div class="relative flex items-center">
              <input
                type="radio"
                [name]="name()"
                [value]="option.value"
                [formControl]="control()"
                [attr.disabled]="option.disabled ? '' : null"
                class="peer sr-only"
              />
              <!-- Custom radio circle -->
              <div
                class="size-4 rounded-full border-2 transition-colors
                border-neutral-300 dark:border-neutral-600
                peer-checked:border-accent-500 peer-checked:bg-accent-500
                peer-disabled:opacity-50 peer-disabled:cursor-not-allowed
                peer-focus-visible:ring-2 peer-focus-visible:ring-accent-500/30 peer-focus-visible:ring-offset-2
                relative
                after:content-[''] after:absolute after:inset-0 after:m-auto
                after:size-2 after:rounded-full after:bg-white
                after:opacity-0 peer-checked:after:opacity-100 after:transition-opacity
              "
              ></div>
            </div>
            <span
              class="text-sm text-neutral-700 dark:text-neutral-300"
              [class.opacity-50]="option.disabled"
              [class.cursor-not-allowed]="option.disabled"
            >
              {{ option.label }}
            </span>
          </label>
        }
      </div>

      @if (helpText() && !showError()) {
        <p class="mt-2 text-xs text-neutral-500 dark:text-neutral-400">{{ helpText() }}</p>
      }

      <af-form-error [show]="showError()" [message]="errorMessage()" />
    </div>
