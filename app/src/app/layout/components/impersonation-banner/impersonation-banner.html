@if (authStore.isImpersonating()) {
  <div
    class="bg-red-600 text-white px-4 py-2 flex items-center justify-between gap-3"
    role="alert"
    aria-live="polite"
  >
    <div class="flex items-center gap-2">
      <lucide-icon name="alert-triangle" [size]="16" />
      <span class="text-sm font-medium">
        Você está impersonando
        <strong>{{ authStore.impersonatedTenantName() }}</strong>
      </span>
    </div>

    <button
      (click)="stopImpersonating()"
      class="text-sm font-semibold bg-white text-red-700 px-3 py-1 rounded hover:bg-red-50 transition-colors"
      type="button"
    >
      Voltar para Super Admin
    </button>
  </div>
}
