
    <div class="flex h-screen overflow-hidden bg-surface-50 dark:bg-neutral-950">
      <!-- Sidebar -->
      <af-sidenav />

      <!-- Main Content Area -->
      <div
        class="flex-1 flex flex-col min-w-0"
        [style.overflow]="appShell.contentScrollable() ? 'auto' : 'hidden'"
      >
        <af-topbar />

        <main
          [class]="
            appShell.contentScrollable()
              ? 'flex-1 min-h-0 px-6 py-6'
              : 'flex-1 min-h-0 overflow-hidden p-0'
          "
        >
          <router-outlet />
        </main>

        @if (appShell.footerVisible()) {
          <af-footer />
        }
      </div>

      <af-search-spotlight />
    </div>
