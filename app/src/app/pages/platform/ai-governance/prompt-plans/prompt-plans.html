
    <af-crud-page
      title="Planos"
      subtitle="Governança IA"
      searchPlaceholder="Buscar planos..."
      [loading]="isLoading()"
      [empty]="isEmpty()"
      emptyTitle="Nenhum plano encontrado"
      emptyDescription="Os prompts de plano são gerenciados pelos seeders da plataforma."
      [skeletonColumns]="5"
      [skeletonRows]="5"
      [currentPage]="meta().current_page"
      [lastPage]="meta().last_page"
      [perPage]="meta().per_page"
      [total]="meta().total"
      (search)="onSearch($event)"
      (pageChange)="loadPage($event)"
    >
      @if (hasError()) {
        <div class="p-6 space-y-3">
          <af-alert
            variant="danger"
            title="Erro ao carregar planos"
            message="Não foi possível carregar os planos de prompt. Verifique sua conexão e tente novamente."
          />
          <af-button variant="outline" size="sm" (click)="retry()">
            <lucide-icon name="refresh-cw" [size]="14" class="block" />
            Tentar novamente
          </af-button>
        </div>
      } @else {
        <af-data-table [hoverable]="true">
          <thead>
            <tr>
              <th>Plano</th>
              <th>Limite de Tokens</th>
              <th>Excedente</th>
              <th class="text-right">Ações</th>
            </tr>
          </thead>
          <tbody>
            @for (plan of plans(); track plan.id) {
              <tr>
                <td>
                  <span class="font-medium">{{ plan.plan?.name || '—' }}</span>
                </td>
                <td class="text-sm text-neutral-600 dark:text-neutral-400">
                  {{ plan.token_limit_monthly ?? '—' }}
                </td>
                <td class="text-sm text-neutral-600 dark:text-neutral-400">
                  {{ plan.allow_overage ? 'Permitido' : 'Não permitido' }}
                </td>
                <td>
                  <div class="flex justify-end items-center gap-1">
                    <af-icon-button
                      label="Editar prompt do plano"
                      variant="ghost"
                      size="sm"
                      (click)="openEdit(plan)"
                    >
                      <lucide-icon name="pencil" [size]="14" />
                    </af-icon-button>
                  </div>
                </td>
              </tr>
            }
          </tbody>
        </af-data-table>
      }
    </af-crud-page>

    <!-- Edit Modal (inline form) -->
    <af-modal
      [open]="editModalOpen()"
      title="Editar prompt do plano"
      size="lg"
      (closed)="closeEdit()"
    >
      <div class="space-y-4">
        @if (errorMessage()) {
          <div class="mb-4">
            <af-alert variant="danger" [message]="errorMessage() ?? ''" />
          </div>
        }
        <af-textarea-input
          [label]="'Conteúdo do Prompt *'"
          [control]="form.controls.content"
          [rows]="10"
          [required]="true"
          errorMessage="Conteúdo é obrigatório"
        />

        <af-textarea-input
          label="Regras Obrigatórias (JSON)"
          [control]="form.controls.mandatory_rules"
          [rows]="8"
        />

        <af-number-input
          label="Limite de Tokens Mensal"
          [control]="form.controls.token_limit_monthly"
          [min]="0"
          [step]="1000"
        />

        <af-switch-input label="Permitir Excedente" [control]="form.controls.allow_overage" />
      </div>

      <div footer class="flex justify-end gap-2">
        <af-button variant="ghost" size="sm" (click)="closeEdit()">Cancelar</af-button>
        <af-loading-button variant="primary" size="sm" [loading]="isSaving()" (click)="saveEdit()">
          Salvar
        </af-loading-button>
      </div>
    </af-modal>
