
    <form class="space-y-4" (ngSubmit)="submit()">
      @if (errorMessage()) {
        <div class="mb-4">
          <af-alert variant="danger" [message]="errorMessage() ?? ''" />
        </div>
      }
      <af-text-input
        label="Nome"
        [control]="form.controls.name"
        [required]="true"
        [maxLength]="255"
        errorMessage="Nome é obrigatório (máx. 255)."
        dataTest="master-name"
      />

      <af-textarea-input
        label="Conteúdo"
        [control]="form.controls.content"
        [required]="true"
        [rows]="12"
        classTextarea="font-mono"
        errorMessage="Conteúdo é obrigatório (mín. 10)."
        dataTest="master-content"
      />
    </form>
