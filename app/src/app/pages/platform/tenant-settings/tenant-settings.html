<div class="flex flex-col gap-6">
  <af-page-title title="Configurações do Inquilino" subtitle="Localização e privacidade" />

  <!-- ── Loading state ─────────────────────────────────────────────── -->
  @if (isLoading()) {
    <section
      class="bg-white dark:bg-neutral-900 rounded-xl border border-neutral-200 dark:border-neutral-800 p-6"
    >
      <div class="space-y-4">
        <af-skeleton variant="text" width="30%" height="1rem" />
        <af-skeleton variant="rectangular" width="100%" height="8rem" />
        <af-skeleton variant="rectangular" width="100%" height="6rem" />
      </div>
    </section>
  }

  <!-- ── Error state ───────────────────────────────────────────────── -->
  @if (error() && !isLoading()) {
    <section
      class="bg-white dark:bg-neutral-900 rounded-xl border border-neutral-200 dark:border-neutral-800 p-6"
    >
      <af-alert variant="danger" title="Erro ao carregar configurações" [message]="error() ?? ''" />
      <af-button variant="outline" size="sm" (click)="loadSettings()" class="mt-3">
        Tentar novamente
      </af-button>
    </section>
  }

  <!-- ── Settings form ─────────────────────────────────────────────── -->
  @if (!isLoading()) {
    <!-- ── Localization ───────────────────────────────────────────── -->
    <section
      class="bg-white dark:bg-neutral-900 rounded-xl border border-neutral-200 dark:border-neutral-800 p-6"
    >
      <h2 class="text-base font-medium text-neutral-800 dark:text-neutral-200 mb-4">Localização</h2>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <af-select-input
          [control]="localizationForm.controls.timezone"
          [options]="timezoneOptions"
          label="Fuso horário"
          placeholder="Selecione..."
          dataTest="tenant-timezone"
        />

        <af-select-input
          [control]="localizationForm.controls.dateFormat"
          [options]="dateFormatOptions"
          label="Formato de data"
          placeholder="Selecione..."
          dataTest="tenant-dateformat"
        />

        <af-radio-input
          [control]="localizationForm.controls.timeFormat"
          [options]="timeFormatOptions"
          name="timeFormat"
          label="Formato de hora"
          orientation="horizontal"
          dataTest="tenant-timeformat"
        />

        <af-select-input
          [control]="localizationForm.controls.currencyFormat"
          [options]="currencyFormatOptions"
          label="Formato de moeda"
          placeholder="Selecione..."
          dataTest="tenant-currencyformat"
        />
      </div>
    </section>

    <!-- ── Privacy ────────────────────────────────────────────────── -->
    <section
      class="bg-white dark:bg-neutral-900 rounded-xl border border-neutral-200 dark:border-neutral-800 p-6"
    >
      <h2 class="text-base font-medium text-neutral-800 dark:text-neutral-200 mb-4">Privacidade</h2>

      <div class="flex flex-col gap-4 max-w-lg">
        <af-radio-input
          [control]="privacyForm.controls.presence"
          [options]="presenceOptions"
          name="presence"
          label="Status de presença"
          orientation="vertical"
          dataTest="tenant-presence"
        />

        <af-switch-input
          [control]="privacyForm.controls.readReceipt"
          label="Confirmação de leitura no chat"
          dataTest="tenant-readreceipt"
        />

        <af-switch-input
          [control]="privacyForm.controls.notificationPreview"
          label="Mostrar preview nas notificações"
          dataTest="tenant-notifpreview"
        />
      </div>
    </section>

    <!-- ── Save / Reset actions ────────────────────────────────────── -->
    <div class="flex justify-end gap-3">
      <af-button variant="outline" (click)="reset()" dataTest="tenant-reset-btn">
        Descartar alterações
      </af-button>
      <af-loading-button
        variant="primary"
        [loading]="isSaving()"
        (click)="save()"
        dataTest="tenant-save-btn"
      >
        Salvar configurações
      </af-loading-button>
    </div>
  }
</div>
