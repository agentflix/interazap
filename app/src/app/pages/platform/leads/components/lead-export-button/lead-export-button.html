<div class="relative">
  <af-button variant="outline" size="sm" (click)="toggleOpen()">
    <lucide-icon name="download" [size]="14" class="block" />
    Exportar CSV
  </af-button>

  @if (isOpen()) {
    <div
      class="absolute right-0 mt-2 w-80 rounded-lg border border-neutral-200 bg-white p-3 shadow-lg dark:border-neutral-700 dark:bg-neutral-900 z-20"
    >
      <div class="space-y-3">
        <div>
          <label class="mb-1 block text-xs font-medium text-neutral-700 dark:text-neutral-300"
            >Busca</label
          >
          <input
            type="text"
            [formControl]="exportSearchControl"
            placeholder="Nome, e-mail, telefone..."
            class="w-full rounded-md border border-neutral-300 bg-white px-3 py-2 text-sm text-neutral-900 focus:border-accent-500 focus:outline-none dark:border-neutral-600 dark:bg-neutral-950 dark:text-neutral-100"
          />
        </div>
      </div>

      <div class="mt-3 flex justify-end">
        <af-button variant="primary" size="sm" [disabled]="isExporting()" (click)="exportCsv()">
          @if (isExporting()) {
            <lucide-icon name="loader-circle" [size]="14" class="block animate-spin" />
          } @else {
            <lucide-icon name="file-spreadsheet" [size]="14" class="block" />
          }
          Exportar CSV
        </af-button>
      </div>
    </div>
  }
</div>
