<af-crud-page
  title="Leads da Plataforma"
  subtitle="Plataforma"
  searchPlaceholder="Buscar por nome, e-mail, telefone ou empresa"
  [loading]="isLoading()"
  [empty]="isEmpty()"
  emptyTitle="Nenhum lead encontrado"
  emptyDescription="Ajuste os filtros ou aguarde novas captações da landing page."
  [skeletonColumns]="6"
  [skeletonRows]="6"
  [currentPage]="meta().current_page"
  [lastPage]="meta().last_page"
  [perPage]="meta().per_page"
  [total]="meta().total"
  (search)="onSearch($event)"
  (pageChange)="loadPage($event)"
>
  <div filters class="flex items-center gap-2">
    <div class="ml-auto">
      <app-lead-export-button
        [searchTerm]="currentSearchTerm()"
        (exported)="handleExported()"
        (errorOccurred)="handleExportError($event)"
      />
    </div>
  </div>

  @if (hasError()) {
    <div class="p-6 space-y-3">
      <af-alert
        variant="danger"
        title="Erro ao carregar leads"
        message="Não foi possível carregar os leads da plataforma."
      />
      <af-button variant="outline" size="sm" (click)="retry()">
        <lucide-icon name="refresh-cw" [size]="14" class="block" />
        Tentar novamente
      </af-button>
    </div>
  } @else {
    <af-data-table [hoverable]="true">
      <thead>
        <tr>
          <th>Nome</th>
          <th>E-mail</th>
          <th>Empresa</th>
          <th class="text-right">Ações</th>
        </tr>
      </thead>
      <tbody>
        @for (lead of leads(); track lead.id) {
          <tr>
            <td>
              <div class="flex flex-col">
                <span class="font-medium">{{ lead.name }}</span>
                <span class="text-sm text-neutral-600 dark:text-neutral-400">
                  {{ formatPhone(lead.phone) }}
                </span>
              </div>
            </td>
            <td class="text-sm text-neutral-600 dark:text-neutral-400">{{ lead.email }}</td>
            <td>{{ lead.company || '—' }}</td>
            <td>
              <div class="flex justify-end items-center">
                <af-button variant="outline" size="sm" (click)="openConvertModal(lead)">
                  <lucide-icon name="building-2" [size]="14" class="block" />
                  Converter
                </af-button>
              </div>
            </td>
          </tr>
        }
      </tbody>
    </af-data-table>
  }
</af-crud-page>

<app-lead-convert-modal
  [open]="showConvertModal()"
  [lead]="selectedLead()"
  (converted)="onConvertedLead()"
  (cancelled)="closeConvertModal()"
/>
