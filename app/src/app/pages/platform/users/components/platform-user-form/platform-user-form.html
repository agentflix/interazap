<form class="space-y-4" (submit)="$event.preventDefault()">
  @if (!fixedTenantId()) {
    <af-select-input
      label="Empresa"
      [control]="form.controls.company_id"
      [options]="companyOptions()"
      [required]="true"
      placeholder="Selecione uma empresa"
      dataTest="platform-user-form-company"
    />
  }

  <af-text-input
    label="Nome"
    [control]="form.controls.name"
    placeholder="Ex: Maria Souza"
    [required]="true"
    dataTest="platform-user-form-name"
  />

  <af-text-input
    label="E-mail"
    type="email"
    [control]="form.controls.email"
    placeholder="Ex: maria@empresa.com"
    [required]="true"
    dataTest="platform-user-form-email"
  />

  <af-password-strength
    [label]="isEditing() ? 'Senha (opcional)' : 'Senha'"
    [control]="form.controls.password"
    placeholder="Mínimo 8 caracteres"
    [minLength]="8"
    [showChecklist]="true"
    [required]="!isEditing()"
    dataTest="platform-user-form-password"
  />

  <af-password-input
    label="Confirmar senha"
    [control]="form.controls.password_confirmation"
    placeholder="Repita a senha"
    [required]="isPasswordConfirmationRequired()"
    [errorMessage]="passwordConfirmationErrorMessage()"
    dataTest="platform-user-form-password-confirmation"
  />

  <af-checkbox-group
    label="Perfis"
    [control]="form.controls.roles"
    [options]="roleOptions()"
    dataTest="platform-user-form-roles"
  />

  <af-switch-input
    label="Ativo"
    [control]="form.controls.is_active"
    dataTest="platform-user-form-active"
  />

  <af-checkbox-input
    label="Obrigar redefinição de senha ao primeiro login"
    [control]="form.controls.force_password_change"
    dataTest="platform-user-form-force-password-change"
  />
</form>
