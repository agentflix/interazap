<!-- Loading state while validating tenant / restoring session -->
@if (isCarregando()) {
  <div class="flex items-center justify-center min-h-screen bg-surface-50 dark:bg-neutral-950">
    <div class="flex flex-col items-center gap-3">
      <af-spinner size="md" />
      <p class="text-sm text-neutral-500 dark:text-neutral-400">Carregando...</p>
    </div>
  </div>
}

<!-- Tenant Error -->
@if (tenantError()) {
  <div class="flex items-center justify-center min-h-screen bg-surface-50">
    <div class="flex flex-col items-center gap-3 text-center px-6">
      <p class="text-lg font-medium text-neutral-700">Empresa não encontrada</p>
      <p class="text-sm text-neutral-500">O link de atendimento que você acessou é inválido ou não está mais disponível.</p>
    </div>
  </div>
}

<!-- Pre-Chat Form -->
@if (showPreChat()) {
  <app-pre-chat [tenantId]="tenantId()" [tenantName]="tenantName()" (sessionReady)="onSessionReady($event)" />
}

<!-- Chat Window -->
@if (showChat()) {
  <app-chat-window #chatWindow (ticketClosed)="onTicketClosed()" />
}
