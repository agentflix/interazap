
    <af-card [padded]="false" [fullHeight]="true">
      <div header class="px-5 pt-4 pb-0">
        <h6 class="text-sm font-semibold text-neutral-700 dark:text-neutral-300">
          Funil de Vendas
        </h6>
      </div>
      <div class="px-5 py-4">
        @if (hasData()) {
          <af-apexchart
            type="bar"
            [series]="series()"
            [categories]="categories()"
            [colors]="colors()"
            [extraOptions]="chartOptions"
            height="300"
          />
        } @else {
          <af-empty-state
            title="Sem dados"
            description="Nenhum dado encontrado para o período selecionado"
          />
        }

        @if (steps().length > 0) {
          <div class="mt-4 space-y-2 tabular-nums">
            @for (step of steps(); track step.step_name) {
              <div class="flex items-center justify-between text-xs">
                <div class="flex items-center gap-2">
                  <span class="size-2 rounded-full" [style.background]="step.step_color"></span>
                  <span class="text-neutral-600 dark:text-neutral-400">{{ step.step_name }}</span>
                </div>
                <div class="flex items-center gap-3 text-neutral-900 dark:text-neutral-100">
                  <span>{{ step.count }}</span>
                  <span>{{
                    step.total_amount | currency: 'BRL' : 'symbol' : '1.2-2' : 'pt-BR'
                  }}</span>
                </div>
              </div>
            }
          </div>
        }
      </div>
    </af-card>
