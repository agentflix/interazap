
    <div
      class="rounded-xl border border-neutral-200 dark:border-neutral-700 bg-white dark:bg-neutral-900 p-4 h-full"
    >
      <div class="flex items-start justify-between gap-3 mb-3">
        <div>
          <p class="text-base font-semibold text-neutral-900 dark:text-neutral-50">
            {{ plan().name }}
          </p>
          <p class="text-sm text-neutral-500 dark:text-neutral-400">
            {{ formatCurrencyBRL(plan().price_monthly) }}/mês
          </p>
        </div>

        @if (plan().is_current) {
          <af-status-badge status="online">Plano Atual</af-status-badge>
        }
      </div>

      <ul class="space-y-1.5 text-sm text-neutral-700 dark:text-neutral-300 mb-4">
        @for (feature of plan().features ?? []; track feature.label) {
          <li class="flex items-center gap-2">
            <span class="text-neutral-500 dark:text-neutral-400">•</span>
            <span>{{ feature.label }}</span>
          </li>
        }
      </ul>

      @if (plan().is_current) {
        <af-button variant="outline" [disabled]="true" class="w-full">Plano atual</af-button>
      } @else {
        <af-button variant="primary" class="w-full" (click)="selected.emit(plan())">
          {{ actionLabel() }}
        </af-button>
      }
    </div>
