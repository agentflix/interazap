
    <div class="pt-2">
      <app-page-title title="Volume de Atendimento" subtitle="Relatórios">
        <af-button variant="secondary" size="sm" (clicked)="openFilters()">
          <lucide-icon name="sliders-horizontal" [size]="16" class="block" />
          Filtros
        </af-button>
      </app-page-title>

      <!-- Filter Drawer -->
      <af-drawer
        [open]="isFilterOpen()"
        title="Filtros do relatório"
        side="right"
        size="lg"
        (closed)="closeFilters()"
      >
        <af-search-input
          [control]="searchControl"
          placeholder="Buscar..."
          dataTest="chat-volume-search"
        />

        <div class="grid grid-cols-1">
          <af-text-input
            [control]="startDateControl"
            label="Data inicial"
            type="date"
            dataTest="chat-volume-start-date"
          />
          <af-text-input
            [control]="endDateControl"
            label="Data final"
            type="date"
            dataTest="chat-volume-end-date"
          />
          <af-select-input
            label="Granularidade"
            [control]="granularityControl"
            [options]="granularityOptions"
            dataTest="chat-volume-granularity"
          />
        </div>

        <div class="flex gap-2">
          <af-button variant="secondary" size="sm" (clicked)="onExport({ format: 'csv' })">
            <lucide-icon name="file-spreadsheet" [size]="16" class="block" />
            CSV
          </af-button>
          <af-button variant="secondary" size="sm" (clicked)="onExport({ format: 'xlsx' })">
            <lucide-icon name="file-spreadsheet" [size]="16" class="block" />
            XLSX
          </af-button>
        </div>

        <div footer>
          <div class="flex w-full items-center justify-between gap-2">
            <af-button variant="danger" size="sm" (clicked)="clearFilters()">
              Limpar filtros
            </af-button>
            <div class="flex gap-2">
              <af-button variant="ghost" size="sm" (clicked)="closeFilters()">Cancelar</af-button>
              <af-button variant="primary" size="sm" (clicked)="applyFilters()">Aplicar</af-button>
            </div>
          </div>
        </div>
      </af-drawer>

      @if (isLoading()) {
        <af-report-loading [kpiCount]="4" layout="kpi+chart" />
      } @else if (hasError()) {
        <af-report-error
          title="Erro ao carregar dados"
          message="Não foi possível carregar o relatório de volume de atendimento."
          (retry)="retry()"
        />
      } @else if (!data()) {
        <af-report-empty
          title="Sem dados disponíveis"
          description="Não há dados de atendimento no período selecionado"
        />
      } @else {
        <!-- KPIs -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          <af-kpi-card
            title="Total de Tickets"
            [value]="'' + (data()?.summary?.total_tickets ?? 0)"
            [loading]="false"
          />
          <af-kpi-card
            title="Média Diária"
            [value]="(data()?.summary?.avg_daily ?? 0 | number: '1.0-0') + ''"
            [loading]="false"
          />
          <af-kpi-card
            title="Resolução Automática"
            [value]="(data()?.summary?.auto_resolution_rate ?? 0 | number: '1.1-1') + '%'"
            [loading]="false"
          />
          <af-kpi-card
            title="Escalonados p/ Humano"
            [value]="'' + (data()?.summary?.human_takeover_count ?? 0)"
            [loading]="false"
          />
        </div>

        <!-- Heatmap -->
        <af-card>
          <div header class="px-5 py-3 border-b border-neutral-200 dark:border-neutral-700">
            <h6 class="text-sm font-semibold text-neutral-900 dark:text-neutral-50">
              Mapa de Calor (Dia x Hora)
            </h6>
          </div>
          <af-apexchart
            type="bar"
            [series]="$any(chartSeries())"
            height="320"
            [colors]="['#2b7fff']"
            [extraOptions]="chartExtra()"
          />
        </af-card>

        <!-- Channel Table -->
        <af-card [padded]="false">
          <div header class="px-5 py-3 border-b border-neutral-200 dark:border-neutral-700">
            <h6 class="text-sm font-semibold text-neutral-900 dark:text-neutral-50">Por Canal</h6>
          </div>
            <div class="overflow-x-auto">
              <table class="w-full text-sm tabular-nums">
              <thead>
                <tr class="border-b border-neutral-200 dark:border-neutral-700">
                  <th
                    class="text-left py-3 px-4 font-medium text-neutral-500 dark:text-neutral-400"
                  >
                    Canal
                  </th>
                  <th
                    class="text-right py-3 px-4 font-medium text-neutral-500 dark:text-neutral-400"
                  >
                    Tickets
                  </th>
                </tr>
              </thead>
              <tbody>
                @for (ch of data()?.by_channel ?? []; track ch.channel) {
                  <tr
                    class="border-b border-neutral-100 dark:border-neutral-800 hover:bg-neutral-50 dark:hover:bg-neutral-800/50"
                  >
                    <td class="py-3 px-4 capitalize">{{ ch.channel }}</td>
                    <td class="text-right py-3 px-4">{{ ch.count }}</td>
                  </tr>
                }
              </tbody>
            </table>
          </div>
        </af-card>
      }
    </div>
