<!-- Logo -->
<div class="text-center">
  <a routerLink="/" class="inline-flex self-start">
    <img
      src="/logo-interazap-dark.png"
      alt="InteraZap"
      class="h-25 object-contain hidden dark:block"
    />
    <img src="/logo-interazap-light.png" alt="InteraZap" class="h-25 object-contain" />
  </a>
</div>
<app-auth-page-wrapper
  title="Bem-vindo de volta"
  subtitle=""
  eyebrow="Entrar"
  highlight="Ambiente seguro e criptográfado."
>
  @if (message()) {
    <div class="mb-6">
      <af-alert variant="danger" [message]="message() ?? ''" />
    </div>
  }

  @if (hasTwoFactorChallenge()) {
    <div class="mb-6">
      <af-alert
        variant="warning"
        [message]="
          'Digite o código do autenticador para continuar com ' + (twoFactorPendingEmail() ?? '')
        "
      />
    </div>
  }

  <!-- Google OAuth Button -->
  <div class="mb-6">
    <app-google-login-button />
  </div>

  <div class="relative mb-6">
    <div class="absolute inset-0 flex items-center">
      <div class="w-full border-t border-gray-300 dark:border-gray-600"></div>
    </div>
    <div class="relative flex justify-center text-sm">
      <span class="bg-white dark:bg-gray-900 px-2 text-gray-500">ou entre com email</span>
    </div>
  </div>

  <form class="w-full" [formGroup]="form" (ngSubmit)="submit()">
    <!-- Honeypot fields — browsers autofill these hidden fields instead of the real ones -->
    <input
      type="email"
      name="email"
      tabindex="-1"
      autocomplete="off"
      class="absolute opacity-0 pointer-events-none"
      style="position: absolute; left: -9999px"
    />
    <input
      type="password"
      name="password"
      tabindex="-1"
      autocomplete="off"
      class="absolute opacity-0 pointer-events-none"
      style="position: absolute; left: -9999px"
    />

    @if (!hasTwoFactorChallenge()) {
      <af-text-input
        [control]="form.controls.email"
        label="E-mail"
        type="email"
        placeholder="seu@email.com"
        [required]="true"
        [errorMessage]="emailErrorMessage()"
        dataTest="login-email"
        autocomplete="off"
      />

      <af-password-input
        [control]="form.controls.password"
        label="Senha"
        placeholder="********"
        [required]="true"
        [errorMessage]="passwordErrorMessage()"
        dataTest="login-password"
        autocomplete="off"
      />

      <div class="mb-4 flex items-center justify-between">
        <af-checkbox-input [control]="form.controls.remember" label="Lembrar de mim" />
        <a routerLink="/auth/reset-password" class="text-primary-500 font-medium text-sm">
          Esqueceu a senha?
        </a>
      </div>
    } @else {
      <af-otp-input
        [length]="6"
        label="Código de verificação"
        [disabled]="isLoading()"
        (completed)="onTwoFactorCodeCompleted($event)"
      />
      <p class="mt-3 text-sm text-neutral-500 dark:text-neutral-300">
        Digite os 6 números do app autenticador.
      </p>
      <div class="mt-4">
        <af-button
          variant="outline"
          size="md"
          type="button"
          [disabled]="isLoading()"
          [block]="true"
          (clicked)="cancelTwoFactorChallenge()"
        >
          Voltar ao login
        </af-button>
      </div>
    }

    <div class="mt-9 text-center">
      <af-loading-button
        variant="primary"
        size="md"
        type="submit"
        [loading]="isLoading()"
        [disabled]="isSubmitDisabled()"
        [block]="true"
      >
        {{ hasTwoFactorChallenge() ? 'Validar código' : 'Entrar' }}
      </af-loading-button>
    </div>
  </form>
</app-auth-page-wrapper>
