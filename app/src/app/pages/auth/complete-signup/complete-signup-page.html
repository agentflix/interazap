<div class="text-center">
  <a routerLink="/" class="inline-flex self-start">
    <img
      src="/logo-interazap-dark.png"
      alt="InteraZap"
      class="h-25 object-contain hidden dark:block"
    />
    <img src="/logo-interazap-light.png" alt="InteraZap" class="h-25 object-contain dark:hidden" />
  </a>
</div>

<app-auth-page-wrapper
  title="Complete seu cadastro"
  subtitle="Informe os dados da sua empresa para continuar"
  eyebrow="Quase lá!"
>
  @if (errorMessage()) {
    <div class="mb-6">
      <af-alert variant="danger" [message]="errorMessage() ?? ''" />
    </div>
  }

  <form class="w-full" [formGroup]="form" (ngSubmit)="submit()">
    <div class="space-y-4">
      <af-text-input
        [control]="form.controls.company_name"
        label="Nome da empresa"
        placeholder="Ex: Minha Empresa Ltda"
        autocomplete="organization"
        [errorMessage]="fieldError('company_name')"
      />

      <af-text-input
        [control]="form.controls.phone"
        label="Telefone"
        placeholder="(11) 99999-9999"
        autocomplete="tel"
        [errorMessage]="fieldError('phone')"
      />

      @if (needsPassword()) {
        <af-password-input
          [control]="form.controls.password"
          label="Senha (mín. 8 caracteres)"
          placeholder="Crie uma senha segura"
          autocomplete="new-password"
          [errorMessage]="fieldError('password')"
        />
      }
    </div>

    <div class="mt-6">
      <af-loading-button
        variant="primary"
        size="md"
        type="submit"
        [loading]="isLoading()"
        [disabled]="form.invalid"
        [block]="true"
      >
        Concluir cadastro
      </af-loading-button>
    </div>
  </form>
</app-auth-page-wrapper>
