
    <app-auth-page-wrapper
      title="Crie sua nova senha"
      subtitle="Finalize a recuperação com uma senha forte e exclusiva para sua conta."
      eyebrow="Nova senha"
      highlight="Use no mínimo 6 caracteres com boa combinação"
    >
      <form [formGroup]="form" (ngSubmit)="submit()" class="w-full">
        <af-password-strength
          [control]="form.controls.password"
          label="Senha"
          placeholder="Senha"
          [required]="true"
          [minLength]="6"
          errorMessage="Senha obrigatória"
          dataTest="create-password"
        />

        <af-password-input
          [control]="form.controls.passwordConfirmation"
          label="Confirmar senha"
          placeholder="Confirmar senha"
          [required]="true"
          [errorMessage]="passwordConfirmationErrorMessage()"
          dataTest="create-password-confirmation"
        />

        <af-form-error [show]="passwordsMismatch()" message="As senhas precisam ser idênticas." />

        <div class="mt-4">
          <af-checkbox-input [control]="form.controls.remember" label="Lembrar de mim" />
        </div>

        <div class="mt-8">
          <af-button
            variant="primary"
            size="md"
            type="submit"
            [block]="true"
            [disabled]="form.invalid || passwordsMismatch()"
          >
            Redefinir senha
          </af-button>
        </div>
        <div class="mt-4 text-center">
          <p class="text-base text-neutral-800 dark:text-neutral-200">
            Opa, lembrei minha senha...
            <a routerLink="/auth/login" class="text-primary-500 underline">Clique aqui</a>
          </p>
        </div>
      </form>
    </app-auth-page-wrapper>
