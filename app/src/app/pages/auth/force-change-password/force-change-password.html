
    <app-auth-page-wrapper
      title="Redefina sua senha"
      subtitle="Por segurança, você precisa definir uma nova senha antes de continuar usando o sistema."
      eyebrow="Senha obrigatória"
      highlight="Use no mínimo 8 caracteres com boa combinação"
    >
      <form [formGroup]="form" (ngSubmit)="submit()" class="w-full">
        <af-password-strength
          [control]="form.controls.password"
          label="Nova senha"
          placeholder="Mínimo 8 caracteres"
          [required]="true"
          [minLength]="8"
          errorMessage="Senha obrigatória"
          dataTest="force-change-password"
        />

        <af-password-input
          [control]="form.controls.password_confirmation"
          label="Confirmar nova senha"
          placeholder="Repita a nova senha"
          [required]="true"
          [errorMessage]="passwordConfirmationErrorMessage()"
          dataTest="force-change-password-confirmation"
        />

        <af-form-error [show]="passwordsMismatch()" message="As senhas precisam ser idênticas." />

        <div class="mt-8">
          <af-loading-button
            variant="primary"
            size="md"
            type="submit"
            [block]="true"
            [loading]="isSaving()"
            [disabled]="form.invalid || passwordsMismatch()"
          >
            Salvar nova senha
          </af-loading-button>
        </div>
      </form>
    </app-auth-page-wrapper>
