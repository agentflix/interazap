<!-- Logo -->
<div class="text-center">
  <a routerLink="/" class="inline-flex self-start">
    <img
      src="/logo-interazap-dark.png"
      alt="InteraZap"
      class="h-25 object-contain hidden dark:block"
    />
    <img src="/logo-interazap-light.png" alt="InteraZap" class="h-25 object-contain" />
  </a>
</div>

<app-auth-page-wrapper
  title="Crie sua conta grátis"
  subtitle="7 dias e 100 mensagens IA sem custo"
  eyebrow="Começar agora"
>
  @if (errorMessage()) {
    <div class="mb-6">
      <af-alert variant="danger" [message]="errorMessage() ?? ''" />
    </div>
  }

  <!-- Google OAuth Button -->
  <div class="mb-6">
    <app-google-login-button intent="signup" />
  </div>

  <div class="relative mb-6">
    <div class="absolute inset-0 flex items-center">
      <div class="w-full border-t border-gray-300 dark:border-gray-600"></div>
    </div>
    <div class="relative flex justify-center text-sm">
      <span class="bg-white dark:bg-gray-900 px-2 text-gray-500">ou cadastre com email</span>
    </div>
  </div>

  <form class="w-full" [formGroup]="form" (ngSubmit)="submit()">
    <div class="space-y-4">
      <af-text-input
        [control]="form.controls.name"
        label="Nome completo"
        placeholder="Seu nome completo"
        autocomplete="name"
      />

      <af-text-input
        [control]="form.controls.email"
        label="Email"
        type="email"
        placeholder="seu@email.com"
        autocomplete="email"
      />

      <af-password-input
        [control]="form.controls.password"
        label="Senha (mín. 8 caracteres)"
        placeholder="Mínimo 8 caracteres"
        autocomplete="new-password"
      />

      <label class="flex items-start gap-2 cursor-pointer text-sm text-gray-700 dark:text-gray-300">
        <input
          type="checkbox"
          formControlName="accept_terms"
          class="mt-0.5 rounded border-gray-300"
        />
        <span>
          Aceito os
          <a href="/terms" target="_blank" class="text-primary-600 hover:underline">termos de uso</a>
          e a
          <a href="/privacy" target="_blank" class="text-primary-600 hover:underline">política de privacidade</a>
        </span>
      </label>
    </div>

    <div class="mt-6">
      <af-loading-button
        type="submit"
        [loading]="isLoading()"
        [disabled]="form.invalid"
        label="Criar conta grátis"
        class="w-full"
      />
    </div>
  </form>

  <p class="mt-6 text-center text-sm text-gray-600 dark:text-gray-400">
    Já tem conta?
    <a routerLink="/login" class="font-medium text-primary-600 hover:underline">Entrar</a>
  </p>
</app-auth-page-wrapper>
