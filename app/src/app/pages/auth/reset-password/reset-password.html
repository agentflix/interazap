
    <app-auth-page-wrapper
      title="Recupere seu acesso"
      subtitle="Enviamos um link seguro para redefinição e retomada imediata da sua conta."
      eyebrow="Redefinir senha"
      highlight="Tempo médio de recuperação: menos de 2 minutos"
    >
      <div class="mb-6">
        <af-alert
          variant="warning"
          message="Informe seu e-mail e enviaremos as instruções de redefinição"
        />
      </div>

      @if (successMessage()) {
        <div class="mb-6">
          <af-alert variant="success" [message]="successMessage() ?? ''" />
        </div>
      }

      @if (errorMessage()) {
        <div class="mb-6">
          <af-alert variant="danger" [message]="errorMessage() ?? ''" />
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" class="w-full">
        <af-text-input
          label="E-mail"
          type="email"
          [control]="form.controls.email"
          placeholder="seu@email.com"
          [required]="true"
          [errorMessage]="emailErrorMessage()"
          dataTest="reset-password-email"
        />

        <div class="mt-8">
          <af-loading-button
            variant="primary"
            size="md"
            type="submit"
            [block]="true"
            [loading]="isSubmitting()"
            [disabled]="form.invalid"
          >
            Enviar link de redefinição
          </af-loading-button>
        </div>

        <div class="mt-4 text-center">
          <p class="text-base text-neutral-800 dark:text-neutral-200">
            Opa, lembrei minha senha...
            <a routerLink="/auth/login" class="text-primary-500 underline">Clique aqui</a>
          </p>
        </div>
      </form>
    </app-auth-page-wrapper>
