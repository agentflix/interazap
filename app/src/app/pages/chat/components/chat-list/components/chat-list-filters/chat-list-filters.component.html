<div class="px-5 pt-0 pb-3 shrink-0">
  <div class="flex items-center gap-2">
    <div class="grow">
      <af-tabs
        [tabs]="state.tabsList()"
        [activeTab]="state.activeFilterLabel()"
        (tabChange)="state.setFilter($event)"
      ></af-tabs>
    </div>

    <div class="relative shrink-0">
      <button
        type="button"
        class="inline-flex items-center gap-1.5 rounded-md px-2.5 py-1.5 text-xs font-medium transition-colors"
        [class]="
          state.isFilterMenuOpen()
            ? 'bg-neutral-200 dark:bg-neutral-700 text-neutral-800 dark:text-neutral-100'
            : 'text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-800'
        "
        (click)="state.isFilterMenuOpen.set(!state.isFilterMenuOpen())"
      >
        <ng-icon name="lucideFilter" size="14"></ng-icon>
        Filtros
        @if (state.hasActiveAdvancedFilter()) {
          <span class="size-2 rounded-full bg-red-500 animate-pulse"></span>
        }
      </button>

      @if (state.isFilterMenuOpen()) {
        <button
          type="button"
          class="fixed inset-0 z-40"
          aria-label="Fechar menu de filtros"
          (click)="state.isFilterMenuOpen.set(false)"
        ></button>

        <div
          class="absolute top-full right-0 mt-1 w-56 z-50 rounded-lg bg-white dark:bg-neutral-900 shadow-xl border border-neutral-200 dark:border-neutral-700 overflow-hidden"
        >
          <div class="px-3 pt-3 pb-1">
            <div
              class="text-[10px] uppercase tracking-wider text-neutral-400 dark:text-neutral-500 font-semibold mb-2"
            >
              Sentimento
            </div>
            <div class="flex flex-col gap-0.5">
              <button
                type="button"
                class="flex items-center justify-between w-full px-2 py-1.5 text-xs rounded transition-colors"
                [class]="
                  state.sentimentFilter() === null
                    ? 'bg-neutral-100 dark:bg-neutral-800 text-neutral-800 dark:text-neutral-100 font-medium'
                    : 'text-neutral-600 dark:text-neutral-400 hover:bg-neutral-50 dark:hover:bg-neutral-800'
                "
                (click)="state.setSentimentFilter(null); state.isFilterMenuOpen.set(false)"
              >
                <span>Todos</span>
                @if (state.sentimentFilter() === null) {
                  <ng-icon name="lucideCheck" size="14" class="text-primary"></ng-icon>
                }
              </button>
              <button
                type="button"
                class="flex items-center justify-between w-full px-2 py-1.5 text-xs rounded transition-colors"
                [class]="
                  state.sentimentFilter() === 'critical'
                    ? 'bg-red-50 dark:bg-red-950/30 text-red-700 dark:text-red-400 font-medium'
                    : 'text-neutral-600 dark:text-neutral-400 hover:bg-neutral-50 dark:hover:bg-neutral-800'
                "
                (click)="state.setSentimentFilter('critical'); state.isFilterMenuOpen.set(false)"
              >
                <span class="flex items-center gap-1.5">
                  <span class="size-1.5 rounded-full bg-red-500"></span>
                  Crítico
                </span>
                @if (state.sentimentFilter() === 'critical') {
                  <ng-icon name="lucideCheck" size="14" class="text-red-500"></ng-icon>
                }
              </button>
              <button
                type="button"
                class="flex items-center justify-between w-full px-2 py-1.5 text-xs rounded transition-colors"
                [class]="
                  state.sentimentFilter() === 'negative'
                    ? 'bg-amber-50 dark:bg-amber-950/30 text-amber-700 dark:text-amber-400 font-medium'
                    : 'text-neutral-600 dark:text-neutral-400 hover:bg-neutral-50 dark:hover:bg-neutral-800'
                "
                (click)="state.setSentimentFilter('negative'); state.isFilterMenuOpen.set(false)"
              >
                <span class="flex items-center gap-1.5">
                  <span class="size-1.5 rounded-full bg-amber-500"></span>
                  Atenção
                </span>
                @if (state.sentimentFilter() === 'negative') {
                  <ng-icon name="lucideCheck" size="14" class="text-amber-500"></ng-icon>
                }
              </button>
            </div>
          </div>

          <div class="mx-3 my-1.5 border-t border-neutral-100 dark:border-neutral-800"></div>

          <div class="px-3 pt-1 pb-3">
            <div
              class="text-[10px] uppercase tracking-wider text-neutral-400 dark:text-neutral-500 font-semibold mb-2"
            >
              Ordenar por
            </div>
            <div class="flex flex-col gap-0.5">
              <button
                type="button"
                class="flex items-center justify-between w-full px-2 py-1.5 text-xs rounded transition-colors"
                [class]="
                  state.sortBy() === 'last_message_at'
                    ? 'bg-neutral-100 dark:bg-neutral-800 text-neutral-800 dark:text-neutral-100 font-medium'
                    : 'text-neutral-600 dark:text-neutral-400 hover:bg-neutral-50 dark:hover:bg-neutral-800'
                "
                (click)="
                  state.sortBy.set('last_message_at');
                  state.loadCalleds();
                  state.isFilterMenuOpen.set(false)
                "
              >
                <span>Recente</span>
                @if (state.sortBy() === 'last_message_at') {
                  <ng-icon name="lucideCheck" size="14" class="text-primary"></ng-icon>
                }
              </button>
              <button
                type="button"
                class="flex items-center justify-between w-full px-2 py-1.5 text-xs rounded transition-colors"
                [class]="
                  state.sortBy() === 'sentiment_score'
                    ? 'bg-neutral-100 dark:bg-neutral-800 text-neutral-800 dark:text-neutral-100 font-medium'
                    : 'text-neutral-600 dark:text-neutral-400 hover:bg-neutral-50 dark:hover:bg-neutral-800'
                "
                (click)="
                  state.sortBy.set('sentiment_score');
                  state.loadCalleds();
                  state.isFilterMenuOpen.set(false)
                "
              >
                <span>Risco</span>
                @if (state.sortBy() === 'sentiment_score') {
                  <ng-icon name="lucideCheck" size="14" class="text-primary"></ng-icon>
                }
              </button>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</div>
