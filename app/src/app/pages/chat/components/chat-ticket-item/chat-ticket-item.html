<button
  type="button"
  class="w-full text-left flex items-start gap-3 px-4 py-3 hover:bg-neutral-50 dark:hover:bg-neutral-800/60 transition-colors border-b border-hairline dark:border-neutral-700 cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-500 focus-visible:ring-inset"
  [class.bg-neutral-100]="active()"
  [class.dark:bg-neutral-800]="active()"
  (click)="onSelect()"
>
  <!-- Avatar -->
  <div
    class="relative shrink-0 flex items-center justify-center font-semibold rounded-full size-10 bg-neutral-100 dark:bg-neutral-800 text-neutral-600 dark:text-neutral-300 overflow-hidden"
  >
    <span class="text-xs">{{ getInitials(ticket()) }}</span>
    @if (getProfilePicture(ticket()); as src) {
      <img
        [src]="src"
        [alt]="'Foto de ' + (ticket().contact?.name ?? '')"
        class="absolute inset-0 size-full object-cover"
        (error)="handleImageError($event)"
      />
    }
  </div>

  <!-- Conteúdo central -->
  <div class="grow min-w-0">
    <div class="flex items-center justify-between gap-2">
      <h6 class="mb-1 text-neutral-900 dark:text-neutral-50 font-semibold text-sm truncate">
        {{ ticket().contact?.name || ticket().contact?.phone || 'Desconhecido' }}
      </h6>
      @if ((ticket().unread_count ?? 0) > 0) {
        <span
          class="rounded-full bg-primary-50 px-2 py-0.5 text-[10px] font-semibold text-primary-700 dark:bg-primary-900/30 dark:text-primary-400 shrink-0"
        >
          {{ ticket().unread_count }}
        </span>
      }
    </div>

    <p class="text-xs truncate text-neutral-500 dark:text-neutral-400 min-w-0 break-words">
      {{ ticket().last_message?.content || ticket().subject || 'Sem mensagens...' }}
    </p>

    <!-- Badges: IA + Usuário/Departamento (independentes) -->
    <div class="mt-1 flex items-center flex-wrap gap-1">
      @if (ticket().status === 'in_progress') {
        <div
          class="inline-flex items-center gap-1 bg-neutral-100 dark:bg-neutral-800 rounded-md px-1.5 py-0.5"
        >
          <ng-icon name="lucideUser" size="10" class="text-neutral-500 shrink-0"></ng-icon>
          <span class="text-[10px] text-neutral-600 dark:text-neutral-300 font-medium">Humano</span>
        </div>
      } @else if (ticket().is_bot_active && ticket().current_ai_agent_id) {
        <div
          class="inline-flex items-center gap-1 bg-neutral-100 dark:bg-neutral-800 rounded-md px-1.5 py-0.5"
        >
          <ng-icon name="lucideBot" size="10" class="text-neutral-500 shrink-0"></ng-icon>
          <span class="text-[10px] text-neutral-600 dark:text-neutral-300 font-medium">IA</span>
        </div>
      } @else if (ticket().is_bot_active) {
        <div
          class="inline-flex items-center gap-1 bg-neutral-100 dark:bg-neutral-800 rounded-md px-1.5 py-0.5"
        >
          <ng-icon name="lucideBot" size="10" class="text-neutral-500 shrink-0"></ng-icon>
          <span class="text-[10px] text-neutral-600 dark:text-neutral-300 font-medium">Chatbot</span>
        </div>
      }

      @if (ticket().assigned_user) {
        <div
          class="inline-flex items-center gap-1 bg-neutral-100 dark:bg-neutral-800 rounded-md px-1.5 py-0.5 max-w-full"
        >
          <ng-icon name="lucideUser" size="10" class="text-neutral-500 shrink-0"></ng-icon>
          <span class="text-[10px] text-neutral-600 dark:text-neutral-300 font-medium truncate">
            {{ ticket().assigned_user!.name }}
          </span>
        </div>
      } @else if (ticket().user?.department) {
        <div
          class="inline-flex items-center gap-1 bg-neutral-100 dark:bg-neutral-800 rounded-md px-1.5 py-0.5 max-w-full"
        >
          <ng-icon name="lucideUsers" size="10" class="text-neutral-500 shrink-0"></ng-icon>
          <span class="text-[10px] text-neutral-600 dark:text-neutral-300 font-medium truncate">
            {{ ticket().user!.department!.name }}
          </span>
        </div>
      }
    </div>
  </div>

  <!-- Coluna direita: status dot + hora -->
  <div class="flex flex-col items-end justify-between self-stretch py-1 pl-2 shrink-0">
    <span
      class="size-2 rounded-full"
      [class.bg-yellow-400]="ticket().status === 'pending'"
      [class.bg-green-500]="ticket().status === 'in_progress' || ticket().status === 'open'"
      [class.bg-neutral-300]="ticket().status === 'closed'"
    ></span>
    <small class="text-[10px] text-neutral-400 dark:text-neutral-500 font-medium whitespace-nowrap">
      {{ ticket().last_message?.created_at | date: 'shortTime' }}
    </small>
  </div>
</button>
