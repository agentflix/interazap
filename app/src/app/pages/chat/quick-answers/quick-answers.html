
    <af-crud-page
      title="Respostas Rápidas"
      subtitle="Chat"
      createLabel="Nova Resposta"
      searchPlaceholder="Buscar por..."
      [loading]="isLoading()"
      [empty]="isEmpty()"
      emptyTitle="Nenhuma resposta rápida encontrada"
      emptyDescription="Adicione modelos de mensagens para agilizar o atendimento."
      [skeletonColumns]="4"
      [skeletonRows]="5"
      [currentPage]="meta().current_page"
      [lastPage]="meta().last_page"
      [perPage]="meta().per_page"
      [total]="meta().total"
      (create)="openCreate()"
      (search)="onSearch($event)"
      (pageChange)="loadPage($event)"
    >
      <!-- Filtros -->
      <div filters class="flex items-center gap-2">
        <div class="min-w-40">
          <af-select-input
            [control]="filterStatusControl"
            [options]="filterStatusOptions"
            size="sm"
            classContainer=""
            dataTest="quick-answer-filter-status"
          />
        </div>
      </div>

      <!-- Error state -->
      @if (hasError()) {
        <div class="p-6 space-y-3">
          <af-alert
            variant="danger"
            title="Erro ao carregar respostas rápidas"
            message="Não foi possível carregar os dados. Verifique sua conexão e tente novamente."
          />
          <af-button variant="outline" size="sm" (click)="retry()">
            <lucide-icon name="refresh-cw" [size]="14" class="block" />
            Tentar novamente
          </af-button>
        </div>
      } @else {
        <!-- Tabela -->
        <af-data-table [hoverable]="true">
          <thead>
            <tr>
              <th>Atalho</th>
              <th
                afSortableHeader
                label="Nome"
                field="name"
                [currentField]="sortBy()"
                [currentDir]="sortDir()"
                (sortChange)="onSort($event)"
              ></th>
              <th>Conteúdo</th>
              <th>Status</th>
              <th class="text-right">Ações</th>
            </tr>
          </thead>
          <tbody>
            @for (item of quickAnswers(); track item.id) {
              <tr>
                <td>
                  @if (item.shortcut) {
                    <span
                      class="inline-flex items-center rounded bg-accent-500/10 px-2 py-0.5 text-xs font-semibold text-accent-600 dark:text-accent-400"
                    >
                      /{{ item.shortcut }}
                    </span>
                  } @else {
                    <span class="text-neutral-400">-</span>
                  }
                </td>
                <td>{{ item.name }}</td>
                <td>
                  <div class="max-w-xs truncate" [title]="item.content">{{ item.content }}</div>
                </td>
                <td>
                  <af-status-badge [status]="item.is_active ? 'online' : 'offline'">
                    {{ item.is_active ? 'Ativo' : 'Inativo' }}
                  </af-status-badge>
                </td>
                <td>
                  <div class="flex justify-end">
                    <af-table-actions (edit)="openEdit(item)" (delete)="openDelete(item)" />
                  </div>
                </td>
              </tr>
            }
          </tbody>
        </af-data-table>
      }
    </af-crud-page>

    <!-- Create / Edit modal -->
    <af-modal
      [open]="showFormModal()"
      [title]="formModalTitle()"
      size="lg"
      (closed)="handleFormCancelled()"
    >
      <app-quick-answer-form
        #quickAnswerForm
        [quickAnswer]="selectedItem()"
        (saved)="handleFormSaved($event)"
        (cancelled)="handleFormCancelled()"
      />

      <div footer class="flex justify-end gap-2">
        <af-button
          variant="ghost"
          size="sm"
          dataTest="quick-answer-form-cancel-btn"
          (click)="quickAnswerFormRef()?.cancel()"
        >
          Cancelar
        </af-button>
        <af-loading-button
          variant="primary"
          size="sm"
          [loading]="isFormSaving()"
          dataTest="quick-answer-form-save-btn"
          (click)="quickAnswerFormRef()?.submit()"
        >
          Salvar
        </af-loading-button>
      </div>
    </af-modal>

    <!-- Delete confirmation -->
    <af-confirm-modal
      [open]="showDeleteModal()"
      title="Excluir resposta rápida"
      [message]="deleteMessage()"
      confirmLabel="Excluir"
      cancelLabel="Cancelar"
      variant="danger"
      iconName="trash-2"
      (confirmed)="handleDeleteConfirmed()"
      (cancelled)="showDeleteModal.set(false)"
    />
