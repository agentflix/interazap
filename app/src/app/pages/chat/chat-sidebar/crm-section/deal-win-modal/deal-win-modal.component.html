<app-modal [isOpen]="isOpen()" title="Confirmar Venda Ganha 🎉" (closed)="onClose()">
  <div modal-body class="space-y-4">
    <p class="text-sm text-neutral-600 dark:text-neutral-300">
      Você está prestes a marcar esta negociação como ganha:
    </p>

    @if (deal(); as negotiation) {
      <div class="card bg-green-50 dark:bg-green-900/20 border-l-4 border-l-green-500">
        <div class="card-body space-y-2">
          <p class="text-sm font-semibold text-neutral-800 dark:text-neutral-100">
            {{ negotiation.title }}
          </p>
          <p class="text-xs text-neutral-600 dark:text-neutral-400">{{ negotiation.contact?.name }}</p>
          <p class="text-lg font-bold text-green-600">{{ negotiation.value | currency: 'BRL' }}</p>
        </div>
      </div>
    }

    <div class="flex items-start gap-3 p-3 bg-blue-50 dark:bg-blue-900/20 rounded-lg">
      <div class="size-5 text-blue-600 dark:text-blue-400 shrink-0">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        </svg>
      </div>
      <p class="text-xs text-blue-800 dark:text-blue-300">
        Ao confirmar, esta negociação será marcada como fechada e ganha.
      </p>
    </div>
  </div>

  <div modal-footer>
    <div class="flex w-full justify-end gap-2">
      <app-button variant="ghost" size="sm" (clicked)="onClose()" [disabled]="isConfirming()">
        Cancelar
      </app-button>
      <app-loading-button
        variant="success"
        size="sm"
        [loading]="isConfirming()"
        loadingText="Confirmando..."
        (clicked)="onConfirm()"
      >
        Confirmar Vitória
      </app-loading-button>
    </div>
  </div>
</app-modal>
