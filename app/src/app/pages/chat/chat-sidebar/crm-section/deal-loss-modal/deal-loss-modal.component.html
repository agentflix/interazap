<af-modal [isOpen]="isOpen()" title="Marcar como Perdida" (closed)="onClose()">
  <form modal-body class="space-y-4" [formGroup]="form" (ngSubmit)="onConfirm()">
    <p class="text-sm text-neutral-600 dark:text-neutral-300">
      Informe o motivo da perda da negociação:
    </p>

    @if (deal(); as negotiation) {
      <div class="card bg-red-50 dark:bg-red-900/20 border-l-4 border-l-red-500">
        <div class="card-body">
          <p class="text-sm font-medium text-neutral-800 dark:text-neutral-100">
            {{ negotiation.title }}
          </p>
          <p class="text-xs text-neutral-600 dark:text-neutral-400">
            {{ negotiation.contact?.name ?? '-' }}
          </p>
        </div>
      </div>
    }

    <!-- Motivo -->
    <div>
      <app-select-input
        label="Motivo"
        [control]="form.controls.reason_id"
        [options]="reasonOptions()"
        placeholder="Selecione um motivo"
        [required]="true"
        errorMessage="Campo obrigatório"
        [spacing]="false"
        [classSelect]="'form-input-sm'"
      />
    </div>

    <!-- Observações -->
    <div>
      <app-textarea-input
        label="Observações (opcional)"
        [control]="form.controls.notes"
        placeholder="Detalhes adicionais..."
        [rows]="3"
        [spacing]="false"
        [classTextarea]="'form-input-sm'"
      />
    </div>
  </form>

  <div modal-footer>
    <div class="flex w-full justify-end gap-2">
      <app-button variant="ghost" size="sm" (clicked)="onClose()" [disabled]="isConfirming()">
        Cancelar
      </app-button>
      <app-loading-button
        variant="danger"
        size="sm"
        [loading]="isConfirming()"
        loadingText="Confirmando..."
        [disabled]="form.invalid"
        (clicked)="onConfirm()"
      >
        Confirmar Perda
      </app-loading-button>
    </div>
  </div>
</af-modal>
