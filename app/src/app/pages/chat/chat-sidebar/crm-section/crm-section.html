<div class="flex h-full flex-col">
  <!-- Header -->
  <div
    class="flex min-h-14 items-center gap-2 border-b border-neutral-200 dark:border-white/[0.07] px-4 py-3"
  >
    <div class="size-5 text-primary">
      <ng-icon name="lucideHandshake" class="size-5"></ng-icon>
    </div>
    <h6 class="text-sm font-semibold text-neutral-800 dark:text-neutral-100">Negociações</h6>
    <div class="ml-auto">
      <app-icon-button
        icon="lucidePlus"
        variant="ghost"
        size="sm"
        ariaLabel="Nova negociação"
        (clicked)="openNewDealModal()"
      />
    </div>
  </div>

  @if (isLoading()) {
    <af-scroll-area class="flex-1 min-h-0" maxHeight="100%">
      <div class="p-4">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
          @for (_ of [1, 2, 3, 4, 5]; track $index) {
            <div class="card animate-pulse">
              <div class="card-body space-y-2">
                <div class="h-4 bg-neutral-200 dark:bg-[#232823] rounded w-3/4"></div>
                <div class="h-3 bg-neutral-200 dark:bg-[#232823] rounded w-1/2"></div>
                <div class="h-3 bg-neutral-200 dark:bg-[#232823] rounded w-2/3"></div>
              </div>
            </div>
          }
        </div>
      </div>
    </af-scroll-area>
  } @else if (showEmpty()) {
    <div class="flex-1 flex items-center justify-center">
      <af-empty-state
        title="Nenhuma negociação"
        description="Crie a primeira negociação para este contato."
        iconName="lucideHandshake"
      />
    </div>
  } @else {
    <af-scroll-area class="flex-1 min-h-0" maxHeight="100%">
      <div class="p-4">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
          @for (deal of sortedNegotiations(); track deal.id) {
            <app-deal-card
              [deal]="deal"
              [stageUpdating]="isStageUpdating(deal.id)"
              (edit)="openEditModal(deal)"
              (markLost)="openLossModal(deal)"
              (markWon)="openWinModal(deal)"
              (stageChanged)="onStageChanged(deal.id, $event)"
            />
          }
        </div>
      </div>
    </af-scroll-area>
  }
</div>

<!-- Modals -->
<app-deal-edit-modal
  [isOpen]="showEditModal()"
  [deal]="selectedDeal()"
  [contactId]="contactId()"
  (closeModal)="showEditModal.set(false)"
  (dealSaved)="onDealSaved($event)"
/>

<app-deal-loss-modal
  [isOpen]="showLossModal()"
  [deal]="selectedDeal()"
  (closeModal)="showLossModal.set(false)"
  (confirmed)="onDealLost()"
/>

<app-deal-win-modal
  [isOpen]="showWinModal()"
  [deal]="selectedDeal()"
  (closeModal)="showWinModal.set(false)"
  (confirmed)="onDealWon()"
/>
