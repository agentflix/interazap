<main class="h-full w-full relative min-h-0 overflow-hidden">
  <section class="h-full w-full min-h-0 grid grid-cols-1 lg:grid-cols-[320px_minmax(0,1fr)_56px] grid-rows-1 overflow-hidden">
    <app-chat-page-list
      class="min-h-0 overflow-hidden lg:block"
      [class.hidden]="selectedTicketId()"
      [isSoundMuted]="isSoundMuted()"
      [isRefreshing]="isRefreshing()"
      [searchTerm]="searchTerm()"
      [isEmergencyMenuOpen]="isEmergencyMenuOpen()"
      [emergencyFilter]="emergencyFilter()"
      [ticketTabs]="ticketTabs()"
      [ticketFilter]="ticketFilter()"
      [loadingTickets]="loadingTickets()"
      [visibleTickets]="visibleTickets()"
      [selectedTicketId]="selectedTicketId()"
      (toggleSound)="toggleSound()"
      (refreshList)="refreshList()"
      (clearSearch)="clearSearch()"
      (openSearchModal)="openSearchModal()"
      (toggleEmergencyMenu)="isEmergencyMenuOpen.set(!isEmergencyMenuOpen())"
      (closeEmergencyMenu)="isEmergencyMenuOpen.set(false)"
      (setEmergencyFilter)="setEmergencyFilter($event)"
      (openNewConversationModal)="openNewConversationModal()"
      (setTicketFilter)="setTicketFilter($event)"
      (selectTicket)="selectTicket($event)"
    ></app-chat-page-list>

    <app-chat-conversation
      class="min-h-0 overflow-hidden lg:block"
      [class.hidden]="!selectedTicketId()"
      [activeTab]="activeTab()"
      [selectedTicketId]="selectedTicketId()"
      [selectedTicket]="selectedTicket()"
      [selectedContactId]="selectedContactId()"
      [selectedTicketInitials]="getSelectedTicketInitials()"
      [selectedTicketProfilePicture]="getSelectedTicketProfilePicture()"
      [isSelectedTicketStarted]="isSelectedTicketStarted()"
      [isStartingTicket]="isStartingTicket()"
      [isTransferLoading]="isTransferLoading()"
      [isClosingTicket]="isClosingTicket()"
      [isRecording]="recordingState() === 'recording'"
      [isRecordingPaused]="recordingState() === 'paused'"
      [recordingDuration]="recordingDurationSeconds()"
      [isSendingAudio]="isSendingAudio()"
      [isMobile]="isMobile"
      [isAttachmentMenuOpen]="isAttachmentMenuOpen()"
      [attachmentErrorMessage]="attachmentErrorMessage()"
      [pendingQueueCount]="pendingQueueCount()"
      [isQueueFlushing]="isQueueFlushing()"
      [messageControl]="messageControl"
      [isSendingMessage]="isSendingMessage()"
      [composerMode]="composerMode()"
      [windowBadge]="windowBadge()"
      [chatInstanceId]="selectedChatInstanceId()"
      [selectedTemplate]="selectedTemplate()"
      (openNewConversationModal)="openNewConversationModal()"
      (closeSelectedTicket)="closeSelectedTicket()"
      (openTransferModal)="openTransferModal()"
      (openCloseTicketConfirm)="openCloseTicketConfirm()"
      (startSelectedTicket)="startSelectedTicket()"
      (cancelRecording)="cancelRecording()"
      (pauseRecording)="pauseRecording()"
      (resumeRecording)="resumeRecording()"
      (sendRecording)="sendRecording()"
      (toggleAttachmentMenu)="toggleAttachmentMenu()"
      (closeAttachmentMenu)="closeAttachmentMenu()"
      (clearAttachmentError)="clearAttachmentError()"
      (selectAttachmentType)="selectAttachmentType($event)"
      (messageKeydown)="onMessageKeydown($event)"
      (messageInput)="autoResizeTextarea($event)"
      (startRecording)="startRecording()"
      (sendMessage)="sendMessage()"
      (profilePictureError)="handleProfilePictureError($event)"
      (contactUpdated)="onContactUpdated($event)"
      (templateSelected)="onTemplateSelected($event)"
      (clearTemplateSelected)="clearTemplateSelected()"
    ></app-chat-conversation>

    <app-chat-page-sidebar
      class="hidden min-h-0 overflow-hidden lg:block"
      [activeTab]="activeTab()"
      (setTab)="setTab($event)"
    ></app-chat-page-sidebar>
  </section>

  <!-- Drag & Drop Overlay -->
  @if (isDragOver()) {
    <div
      class="absolute inset-0 z-50 bg-primary-500/10 border-2 border-dashed border-primary-500 rounded-lg flex items-center justify-center pointer-events-none"
    >
      <div class="flex flex-col items-center gap-3 text-primary-500 dark:text-primary-400">
        <div class="size-16 rounded-full bg-primary-500/20 flex items-center justify-center">
          <ng-icon name="lucideUploadCloud" size="32"></ng-icon>
        </div>
        <span class="text-lg font-semibold">Solte os arquivos aqui</span>
        <span class="text-sm text-neutral-500 dark:text-neutral-400">para enviar no chat</span>
      </div>
    </div>
  }

  <!-- Hidden file input -->
  <input #fileInput type="file" multiple class="hidden" (change)="onFileInputChange($event)" />
</main>

<!-- Media Preview Modal -->
<app-media-preview
  [open]="isMediaPreviewOpen()"
  [items]="mediaPreviewItems()"
  [selectedId]="mediaPreviewSelectedId()"
  [progress]="mediaUploadProgress()"
  [isSending]="isMediaSending()"
  (closed)="closeMediaPreview()"
  (itemSelected)="onMediaPreviewSelect($event)"
  (remove)="onMediaPreviewRemove($event)"
  (addFiles)="onMediaPreviewAddFiles($event)"
  (updateCaption)="onMediaPreviewUpdateCaption($event)"
  (send)="sendMediaFiles()"
/>

<af-modal
  title="Pesquisar chamados"
  [isOpen]="isSearchModalOpen()"
  (closed)="closeSearchModal()"
  size="sm"
>
  <div modal-body class="space-y-3">
    <app-text-input
      label="Pesquisa"
      [control]="searchQueryControl"
      placeholder="Digite para pesquisar..."
      helpText="A lista é atualizada automaticamente enquanto você digita."
      [spacing]="false"
      [classInput]="'w-full'"
    />
  </div>

  <div modal-footer class="flex w-full items-center justify-end gap-2">
    <app-button variant="outline" size="sm" (clicked)="closeSearchModal()">Fechar</app-button>
  </div>
</af-modal>

<app-new-conversation-modal />

<app-chat-transfer-modal
  [ticket]="selectedTicket()"
  [isOpen]="isTransferModalOpen()"
  [isSubmitting]="isTransferLoading()"
  [submitError]="transferError()"
  (closed)="closeTransferModal()"
  (confirmed)="onTransferConfirmed($event)"
/>

<af-confirm-modal
  [isOpen]="isCloseTicketConfirmOpen()"
  title="Encerrar atendimento"
  message="Tem certeza que deseja encerrar este atendimento? Esta ação não pode ser desfeita."
  confirmLabel="Encerrar"
  cancelLabel="Cancelar"
  variant="danger"
  iconName="x"
  [isLoading]="isClosingTicket()"
  (confirmed)="confirmCloseSelectedTicket()"
  (cancelled)="closeCloseTicketConfirm()"
/>
