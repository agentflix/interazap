
    <form [formGroup]="form" (ngSubmit)="submit()">
      @if (errorMessage()) {
        <div class="mb-4">
          <af-alert variant="danger" [message]="errorMessage() ?? ''" />
        </div>
      }

      <af-text-input
        label="Nome"
        [control]="form.controls.name"
        placeholder="Ex: Consultoria Empresarial"
        [required]="true"
        dataTest="product-form-name"
      />

      <div class="grid grid-cols-2 gap-4">
        <af-text-input
          label="Código"
          [control]="form.controls.code"
          placeholder="Ex: PROD001"
          dataTest="product-form-code"
        />
        <af-select-input
          label="Tipo"
          [control]="form.controls.type"
          [options]="typeOptions"
          [required]="true"
          dataTest="product-form-type"
        />
      </div>

      <af-textarea-input
        label="Descrição"
        [control]="form.controls.description"
        placeholder="Descrição do produto ou serviço..."
        [rows]="2"
        dataTest="product-form-description"
      />

      <div class="grid grid-cols-2 gap-4">
        <af-currency-input label="Preço" [control]="form.controls.price" placeholder="0,00" />
        <af-currency-input label="Custo" [control]="form.controls.cost" placeholder="0,00" />
      </div>

      <!-- ════════════════════════════════════════════════════════════════════
           SEÇÃO DE ESTOQUE — apenas para produtos
           ════════════════════════════════════════════════════════════════════ -->
      @if (isProduct()) {
        <!-- Toggle principal -->
        <div class="mt-4 mb-2">
          <af-switch-input
            label="Controlar estoque"
            [control]="form.controls.track_stock"
            helpText="Quando ativo, o sistema debita do estoque ao vincular este produto a uma negociação."
            dataTest="product-form-track-stock"
          />
        </div>

        <!-- Campos condicionais — indentados com borda lateral -->
        @if (form.controls.track_stock.value) {
          <div class="flex flex-col gap-4 pl-6 border-l-2 border-accent-500/30">
            <div class="grid grid-cols-3 gap-4">
              <af-select-input
                label="Unidade"
                [control]="form.controls.unit"
                [options]="unitOptions"
                placeholder="Selecione..."
                dataTest="product-form-unit"
              />
              <af-number-input
                label="Quantidade em estoque"
                [control]="form.controls.stock_quantity"
                [min]="0"
                [step]="1"
                helpText="Quantidade disponível no momento."
                dataTest="product-form-stock"
              />
              <af-number-input
                label="Estoque mínimo"
                [control]="form.controls.min_stock"
                [min]="0"
                [step]="1"
                helpText="Alerta quando o estoque estiver abaixo deste valor."
                dataTest="product-form-min-stock"
              />
            </div>
          </div>
        }

        <!-- Feedback quando inativo — produto ilimitado -->
        @if (!form.controls.track_stock.value) {
          <div class="pl-6 border-l-2 border-neutral-200 dark:border-neutral-700">
            <div class="rounded-md bg-neutral-50 dark:bg-neutral-800 px-3 py-2">
              <p class="text-xs text-neutral-500 dark:text-neutral-400">
                Este produto está configurado como <strong>ilimitado</strong>.
                Não há controle de estoque — pode ser adicionado a qualquer negociação sem restrição de quantidade.
              </p>
            </div>
          </div>
        }
      }

      <div class="flex items-center gap-4 mt-6 mb-2">
        <af-switch-input
          label="Ativo"
          [control]="form.controls.is_active"
          dataTest="product-form-active"
        />
        <af-checkbox-input
          [control]="form.controls.is_featured"
          label="Destaque"
          dataTest="product-form-featured"
        />
      </div>
    </form>
