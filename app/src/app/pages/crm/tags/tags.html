
    <!-- CRUD Page wrapper: title + search + filter slot + content + pagination -->
    <af-crud-page
      title="Etiquetas"
      subtitle="Configurações"
      createLabel="Nova Etiqueta"
      searchPlaceholder="Buscar etiquetas..."
      [loading]="isLoading()"
      [empty]="isEmpty()"
      emptyTitle="Nenhuma etiqueta encontrada"
      emptyDescription="Comece adicionando sua primeira etiqueta ao sistema."
      [skeletonColumns]="5"
      [skeletonRows]="6"
      [currentPage]="meta().current_page"
      [lastPage]="meta().last_page"
      [perPage]="meta().per_page"
      [total]="meta().total"
      (create)="openCreate()"
      (search)="onSearch($event)"
      (pageChange)="loadPage($event)"
    >
      <!-- Filter slot -->
      <div filters class="flex items-center gap-2">
        <div class="min-w-40">
          <af-select-input
            [control]="filterStatusControl"
            [options]="filterStatusOptions"
            size="sm"
            classContainer=""
            dataTest="tag-filter-status"
          />
        </div>
        @if (hasSelection()) {
          <af-button variant="danger" size="sm" (click)="openBulkDelete()">
            Excluir selecionadas ({{ selectedCount() }})
          </af-button>
        }
      </div>

      <!-- Table (shown when not loading / not empty / no error) -->
      @if (hasError()) {
        <div class="p-6 space-y-3">
          <af-alert
            variant="danger"
            title="Erro ao carregar etiquetas"
            message="Não foi possível carregar as etiquetas. Verifique sua conexão e tente novamente."
          />
          <af-button variant="outline" size="sm" (click)="retry()">
            <lucide-icon name="refresh-cw" [size]="14" class="block" />
            Tentar novamente
          </af-button>
        </div>
      } @else {
        <af-data-table [hoverable]="true">
          <thead>
            <tr>
              <th class="w-10">
                <af-checkbox-input
                  [control]="selectAllControl"
                  ariaLabel="Selecionar todas as etiquetas"
                  dataTest="tags-select-all"
                />
              </th>
              <th class="w-12">Cor</th>
              <th
                afSortableHeader
                label="Nome"
                field="name"
                [currentField]="sortBy()"
                [currentDir]="sortDir()"
                (sortChange)="onSort($event)"
              ></th>
              <th>Categoria</th>
              <th>Status</th>
              <th class="text-right">Ações</th>
            </tr>
          </thead>
          <tbody>
            @for (tag of tags(); track tag.id) {
              <tr>
                <td>
                  <af-checkbox-input
                    [control]="getRowSelectionControl(tag.id)"
                    [ariaLabel]="'Selecionar etiqueta ' + tag.name"
                    [dataTest]="'tag-select-' + tag.id"
                  />
                </td>
                <td>
                  <span
                    class="inline-block size-6 rounded border"
                    [style.background-color]="tag.color"
                  ></span>
                </td>
                <td class="font-medium">
                  {{ tag.name }}
                </td>
                <td>
                  {{ tag.category || '—' }}
                </td>
                <td>
                  <af-status-badge [status]="tag.is_active ? 'online' : 'offline'">
                    {{ tag.is_active ? 'Ativo' : 'Inativo' }}
                  </af-status-badge>
                </td>
                <td>
                  <div class="flex justify-end">
                    <af-table-actions (edit)="openEdit(tag)" (delete)="openDelete(tag)" />
                  </div>
                </td>
              </tr>
            }
          </tbody>
        </af-data-table>
      }
    </af-crud-page>

    <!-- Create / Edit modal -->
    <af-modal
      [open]="showFormModal()"
      [title]="formModalTitle()"
      size="md"
      (closed)="handleFormCancelled()"
    >
      <app-tag-form
        #tagForm
        [tag]="selectedTag()"
        (saved)="handleFormSaved($event)"
        (cancelled)="handleFormCancelled()"
      />

      <div footer class="flex justify-end gap-2">
        <af-button
          variant="ghost"
          size="sm"
          dataTest="tag-form-cancel-btn"
          (click)="tagFormRef()?.cancel()"
        >
          Cancelar
        </af-button>
        <af-loading-button
          variant="primary"
          size="sm"
          [loading]="isFormSaving()"
          dataTest="tag-form-save-btn"
          (click)="tagFormRef()?.submit()"
        >
          Salvar
        </af-loading-button>
      </div>
    </af-modal>

    <!-- Delete confirmation modal -->
    <af-confirm-modal
      [open]="showDeleteModal()"
      [title]="deleteModalTitle()"
      [message]="deleteMessage()"
      [confirmLabel]="deleteConfirmLabel()"
      cancelLabel="Cancelar"
      iconName="trash-2"
      (confirmed)="handleDeleteConfirmed()"
      (cancelled)="showDeleteModal.set(false)"
    />
