<section
  class="flex flex-1 flex-col rounded-xl border border-neutral-200 dark:border-neutral-700 bg-white dark:bg-neutral-900 overflow-hidden"
>
  <div
    class="flex items-center justify-between px-5 py-3 border-b border-neutral-100 dark:border-neutral-800"
  >
    <div class="flex items-center gap-2">
      <lucide-icon name="list-checks" [size]="16" class="text-neutral-500 dark:text-neutral-400" />
      <h3 class="text-sm font-semibold text-neutral-900 dark:text-neutral-50">Próximas tarefas</h3>
    </div>
    <div class="flex items-center gap-2">
      <app-button variant="primary" size="sm" (clicked)="createTaskRequested.emit()"
        ><lucide-icon name="plus" [size]="16" class="block" /> Criar Tarefa</app-button
      >
    </div>
  </div>
  <div class="p-5">
    @if (pendingCount() > 0) {
      <p class="text-sm text-neutral-500 dark:text-neutral-400 mb-4">
        {{ pendingCount() }} pendente(s) para esta negociação.
      </p>
    }
    <div
      class="rounded-lg border border-dashed border-neutral-200 dark:border-neutral-700 bg-neutral-50 dark:bg-neutral-800 p-6 text-center text-sm text-neutral-500 dark:text-neutral-400"
    >
      @if (pendingCount() > 0) {
        Existem tarefas pendentes. Acesse a aba Tarefas para detalhes.
      } @else {
        Nenhuma tarefa pendente para esta negociação.
      }
    </div>
  </div>
</section>
