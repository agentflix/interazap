<section
  class="flex flex-1 flex-col rounded-xl border border-neutral-200 dark:border-white/10 bg-white dark:bg-neutral-900 overflow-hidden"
>
  <div
    class="flex items-center gap-2 px-5 py-3 border-b border-neutral-100 dark:border-white/[0.07]"
  >
    <lucide-icon name="user" [size]="16" class="text-neutral-500 dark:text-neutral-400" />
    <h3 class="text-sm font-semibold text-neutral-900 dark:text-neutral-50">Contato principal</h3>
  </div>
  <div class="flex flex-1 flex-col p-5">
    <div class="flex items-center gap-3">
      <div class="flex size-12 items-center justify-center rounded-full bg-neutral-100 dark:bg-[#191d1a] text-neutral-500 dark:text-neutral-400">
        <lucide-icon name="user" [size]="20" class="block" />
      </div>
      <div>
        <p class="text-sm font-semibold text-neutral-900 dark:text-neutral-50">
          {{ contact()?.name || 'Contato não informado' }}
        </p>
        <p class="text-xs text-neutral-500 dark:text-neutral-400">
          Contato principal da negociação
        </p>
      </div>
    </div>
    <div class="mt-auto pt-5">
      <app-button
        variant="outline"
        size="sm"
        [block]="true"
        [disabled]="!contactId()"
        [routerLink]="['/crm/contacts']"
        [queryParams]="{ contact_id: contactId() || null }"
      >
        Ver ficha do contato
      </app-button>
    </div>
  </div>
</section>
