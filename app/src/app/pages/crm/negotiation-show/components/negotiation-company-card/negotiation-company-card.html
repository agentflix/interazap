<section
  class="flex flex-1 flex-col rounded-xl border border-neutral-200 dark:border-neutral-700 bg-white dark:bg-neutral-900 overflow-hidden"
>
  <div
    class="flex items-center gap-2 px-5 py-3 border-b border-neutral-100 dark:border-neutral-800"
  >
    <lucide-icon name="building-2" [size]="16" class="text-neutral-500 dark:text-neutral-400" />
    <h3 class="text-sm font-semibold text-neutral-900 dark:text-neutral-50">Empresa</h3>
  </div>
  <div class="flex flex-1 flex-col p-5">
    <div class="space-y-3 text-sm text-neutral-600 dark:text-neutral-300">
      <div class="flex items-center gap-2">
        <lucide-icon
          name="building-2"
          [size]="16"
          class="block text-neutral-400 dark:text-neutral-500"
        />
        {{ company()?.name || 'Empresa não informada' }}
      </div>
      <div class="flex items-center gap-2">
        <lucide-icon
          name="map-pin"
          [size]="16"
          class="block text-neutral-400 dark:text-neutral-500"
        />
        {{ getCompanyAddress(company()) }}
      </div>
      <div class="flex items-center gap-2">
        <lucide-icon
          name="phone"
          [size]="16"
          class="block text-neutral-400 dark:text-neutral-500"
        />
        {{ getCompanyPhone(company()) }}
      </div>
    </div>
    <div class="mt-auto pt-5">
      <app-button
        variant="outline"
        size="sm"
        [block]="true"
        [disabled]="!companyId()"
        [routerLink]="['/crm/companies']"
        [queryParams]="{ company_id: companyId() || null }"
      >
        Ver empresa
      </app-button>
    </div>
  </div>
</section>
