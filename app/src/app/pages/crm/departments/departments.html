
    <!-- CRUD Page wrapper: title + search + filter slot + content + pagination -->
    <af-crud-page
      title="Departamentos"
      subtitle="Configurações"
      createLabel="Novo Departamento"
      searchPlaceholder="Buscar departamentos..."
      [loading]="isLoading()"
      [empty]="isEmpty()"
      emptyTitle="Nenhum departamento encontrado"
      emptyDescription="Comece adicionando seu primeiro departamento ao sistema."
      [skeletonColumns]="4"
      [skeletonRows]="6"
      [currentPage]="meta().current_page"
      [lastPage]="meta().last_page"
      [perPage]="meta().per_page"
      [total]="meta().total"
      (create)="openCreate()"
      (search)="onSearch($event)"
      (pageChange)="loadPage($event)"
    >
      <!-- Filter slot -->
      <div filters class="flex items-center gap-2">
        <div class="min-w-40">
          <af-select-input
            [control]="filterStatusControl"
            [options]="filterStatusOptions"
            size="sm"
            classContainer=""
            dataTest="department-filter-status"
          />
        </div>
        @if (hasSelection()) {
          <af-button variant="danger" size="sm" (click)="openBulkDelete()">
            Excluir selecionados ({{ selectedCount() }})
          </af-button>
        }
      </div>

      <!-- Table (shown when not loading / not empty / no error) -->
      @if (hasError()) {
        <div class="p-6 space-y-3">
          <af-alert
            variant="danger"
            title="Erro ao carregar departamentos"
            message="Não foi possível carregar os departamentos. Verifique sua conexão e tente novamente."
          />
          <af-button variant="outline" size="sm" (click)="retry()">
            <lucide-icon name="refresh-cw" [size]="14" class="block" />
            Tentar novamente
          </af-button>
        </div>
      } @else {
        <af-data-table [hoverable]="true">
          <thead>
            <tr>
              <th class="w-10">
                <af-checkbox-input
                  [control]="selectAllControl"
                  ariaLabel="Selecionar todos os departamentos"
                  dataTest="departments-select-all"
                />
              </th>
              <th
                afSortableHeader
                label="Nome"
                field="name"
                [currentField]="sortBy()"
                [currentDir]="sortDir()"
                (sortChange)="onSort($event)"
              ></th>
              <th>Descrição</th>
              <th>Status</th>
              <th class="text-right">Ações</th>
            </tr>
          </thead>
          <tbody>
            @for (dept of departments(); track dept.id) {
              <tr>
                <td>
                  <af-checkbox-input
                    [control]="getRowSelectionControl(dept.id)"
                    [ariaLabel]="'Selecionar departamento ' + dept.name"
                    [dataTest]="'department-select-' + dept.id"
                  />
                </td>
                <td class="font-medium">
                  {{ dept.name }}
                </td>
                <td class="max-w-xs truncate">
                  {{ dept.description || '—' }}
                </td>
                <td>
                  <af-status-badge [status]="dept.is_active ? 'online' : 'offline'">
                    {{ dept.is_active ? 'Ativo' : 'Inativo' }}
                  </af-status-badge>
                </td>
                <td>
                  <div class="flex justify-end">
                    <af-table-actions (edit)="openEdit(dept)" (delete)="openDelete(dept)" />
                  </div>
                </td>
              </tr>
            }
          </tbody>
        </af-data-table>
      }
    </af-crud-page>

    <!-- Create / Edit modal -->
    <af-modal
      [open]="showFormModal()"
      [title]="formModalTitle()"
      size="md"
      (closed)="handleFormCancelled()"
    >
      <app-department-form
        #departmentForm
        [department]="selectedDepartment()"
        (saved)="handleFormSaved($event)"
        (cancelled)="handleFormCancelled()"
      />

      <div footer class="flex justify-end gap-2">
        <af-button
          variant="ghost"
          size="sm"
          dataTest="department-form-cancel-btn"
          (click)="departmentFormRef()?.cancel()"
        >
          Cancelar
        </af-button>
        <af-loading-button
          variant="primary"
          size="sm"
          [loading]="isFormSaving()"
          dataTest="department-form-save-btn"
          (click)="departmentFormRef()?.submit()"
        >
          Salvar
        </af-loading-button>
      </div>
    </af-modal>

    <!-- Delete confirmation modal -->
    <af-confirm-modal
      [open]="showDeleteModal()"
      [title]="deleteModalTitle()"
      [message]="deleteMessage()"
      [confirmLabel]="deleteConfirmLabel()"
      cancelLabel="Cancelar"
      variant="danger"
      iconName="trash-2"
      (confirmed)="handleDeleteConfirmed()"
      (cancelled)="showDeleteModal.set(false)"
    />
