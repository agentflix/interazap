name: Deploy Production

on:
    push:
        branches: [main]
    workflow_dispatch:

env:
    NODE_VERSION: '22'
    PHP_VERSION: '8.4'

jobs:
    # =====================================================
    # BUILD API
    # =====================================================
    build-api:
        name: Build API
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: pdo_pgsql, pgsql, mbstring, zip, exif, pcntl, bcmath, gd, redis, swoole
                  coverage: none

            - name: Install Composer dependencies
              run: |
                  cd api
                  composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader --no-scripts

            - name: Create artifacts
              run: |
                  mkdir -p artifacts
                  cd api
                  tar -czf ../artifacts/api.tar.gz \
                    --exclude='node_modules' \
                    --exclude='.git' \
                    --exclude='storage/app/public' \
                    --exclude='vendor/bin' \
                    .

            - name: Upload API artifacts
              uses: actions/upload-artifact@v5
              with:
                  name: api-production
                  path: artifacts/api.tar.gz
                  retention-days: 1

    # =====================================================
    # BUILD APP (Angular)
    # =====================================================
    build-app:
        name: Build App
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 8

            - name: Install dependencies
              run: |
                  cd app
                  pnpm install --no-frozen-lockfile

            - name: Build Angular
              run: |
                  cd app
                  pnpm exec ng build --configuration production

            - name: Create artifacts
              run: |
                  mkdir -p artifacts
                  cd app
                  tar -czf ../artifacts/app.tar.gz dist/

            - name: Upload App artifacts
              uses: actions/upload-artifact@v5
              with:
                  name: app-production
                  path: artifacts/app.tar.gz
                  retention-days: 1

    # =====================================================
    # BUILD GATEWAY (NestJS)
    # =====================================================
    build-gateway:
        name: Build Gateway
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 8

            - name: Install dependencies
              run: |
                  cd gateway
                  pnpm install --no-frozen-lockfile

            - name: Build NestJS
              run: |
                  cd gateway
                  pnpm run build

            - name: Create artifacts
              run: |
                  mkdir -p artifacts
                  cd gateway
                  tar -czf ../artifacts/gateway.tar.gz \
                    --exclude='node_modules' \
                    --exclude='.git' \
                    .

            - name: Upload Gateway artifacts
              uses: actions/upload-artifact@v5
              with:
                  name: gateway-production
                  path: artifacts/gateway.tar.gz
                  retention-days: 1

    # =====================================================
    # BUILD LANDING
    # =====================================================
    build-landing:
        name: Build Landing
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Create artifacts
              run: |
                  mkdir -p artifacts
                  tar -czf artifacts/landing.tar.gz -C landing .

            - name: Upload Landing artifacts
              uses: actions/upload-artifact@v5
              with:
                  name: landing-production
                  path: artifacts/landing.tar.gz
                  retention-days: 1

    # =====================================================
    # DEPLOY VIA ANSIBLE (atômico, com rollback)
    # =====================================================
    deploy:
        name: Deploy to Production
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs: [build-api, build-app, build-gateway, build-landing]
        steps:
            - name: Checkout infra
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.12'

            - name: Install Ansible
              run: pip install ansible passlib

            - name: Write Ansible vault password
              run: echo "${{ secrets.ANSIBLE_VAULT_PASS }}" > /tmp/.vault_pass
              shell: bash

            - name: Write SSH private key
              run: |
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "${{ secrets.VPS_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
                  sed -i 's/\r$//' ~/.ssh/deploy
                  chmod 600 ~/.ssh/deploy
              shell: bash

            - name: Add VPS host to known_hosts
              run: ssh-keyscan -p ${{ secrets.VPS_SSH_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
              shell: bash

            - name: Run Ansible deploy (production)
              working-directory: infra/ansible
              run: |
                  ansible-playbook playbook.yml \
                    -i inventory/hosts.ini \
                    --limit production \
                    --tags deploy \
                    --vault-password-file /tmp/.vault_pass \
                    --private-key ~/.ssh/deploy \
                    -e "ansible_port=${{ secrets.VPS_SSH_PORT }}" \
                    -e "ansible_remote_tmp=/tmp/ansible" \
                    -v
              shell: bash

            - name: Cleanup vault password file
              if: always()
              run: rm -f /tmp/.vault_pass

    # =====================================================
    # NOTIFY
    # =====================================================
    notify:
        name: Notify Deploy Result
        runs-on: ubuntu-latest
        needs: [deploy]
        if: always()
        steps:
            - name: Deploy result
              run: |
                  if [ "${{ needs.deploy.result }}" = "success" ]; then
                    echo "Deploy production concluído com sucesso"
                  else
                    echo "Deploy production falhou"
                    exit 1
                  fi
              shell: bash
