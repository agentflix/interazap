name: Mobile Android (.aab)

on:
    push:
        tags:
            - 'v*.*.*-android'
    workflow_dispatch:

env:
    NODE_VERSION: '20'
    JAVA_VERSION: '17'

jobs:
    build-android:
        name: Build Android (.aab)
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: ${{ env.JAVA_VERSION }}

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v3

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 8

            - name: Install dependencies
              run: |
                  cd app
                  pnpm install --no-frozen-lockfile

            - name: Build Angular (mobile)
              run: |
                  cd app
                  pnpm exec ng build --configuration mobile

            - name: Sync Capacitor (Android)
              run: |
                  cd app
                  pnpm exec cap sync android

            - name: Decode keystore
              env:
                  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
              run: |
                  KEYSTORE_PATH="${RUNNER_TEMP}/release.keystore"
                  echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
                  echo "ANDROID_KEYSTORE_PATH=${KEYSTORE_PATH}" >> $GITHUB_ENV

            - name: Build release bundle (.aab)
              env:
                  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              run: |
                  cd app/android
                  chmod +x gradlew
                  ./gradlew bundleRelease --no-daemon

            - name: Upload .aab artifact
              uses: actions/upload-artifact@v4
              with:
                  name: interazap-android-${{ github.ref_name }}
                  path: app/android/app/build/outputs/bundle/release/app-release.aab
                  retention-days: 30

            - name: Upload Sentry sourcemaps (Android)
              if: ${{ vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != '' }}
              env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  SENTRY_ORG: ${{ vars.SENTRY_ORG }}
                  SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
              run: |
                  cd app
                  VERSION=$(node -p "require('./package.json').version")
                  npx @sentry/cli releases new "${VERSION}+android"
                  npx @sentry/cli releases files "${VERSION}+android" upload-sourcemaps \
                    ./dist/app-new/browser \
                    --rewrite \
                    --ext map \
                    --ext js
                  npx @sentry/cli releases finalize "${VERSION}+android"
