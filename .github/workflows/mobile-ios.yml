name: Mobile iOS (.ipa)

on:
    push:
        tags:
            - 'v*.*.*-ios'
    workflow_dispatch:

env:
    NODE_VERSION: '20'

jobs:
    build-ios:
        name: Build iOS (.ipa)
        runs-on: macos-15
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Select Xcode
              run: sudo xcode-select -s /Applications/Xcode.app

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 8

            - name: Install dependencies
              run: |
                  cd app
                  pnpm install --no-frozen-lockfile

            - name: Build Angular (mobile)
              run: |
                  cd app
                  pnpm exec ng build --configuration mobile

            - name: Sync Capacitor (iOS)
              run: |
                  cd app
                  pnpm exec cap sync ios

            - name: Install CocoaPods dependencies
              run: |
                  cd app/ios/App
                  pod install

            - name: Import signing certificate
              env:
                  APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
                  APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
              run: |
                  CERT_PATH="${RUNNER_TEMP}/distribution.p12"
                  KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"
                  KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

                  echo "${APPLE_CERT_P12_BASE64}" | base64 --decode > "${CERT_PATH}"

                  security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
                  security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
                  security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
                  security import "${CERT_PATH}" \
                    -P "${APPLE_CERT_PASSWORD}" \
                    -A -t cert -f pkcs12 \
                    -k "${KEYCHAIN_PATH}"
                  security list-keychain -d user -s "${KEYCHAIN_PATH}"

                  echo "KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> $GITHUB_ENV
                  echo "KEYCHAIN_PASSWORD=${KEYCHAIN_PASSWORD}" >> $GITHUB_ENV

            - name: Install provisioning profile
              env:
                  APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
              run: |
                  PP_PATH="${RUNNER_TEMP}/profile.mobileprovision"
                  echo "${APPLE_PROVISIONING_PROFILE}" | base64 --decode > "${PP_PATH}"
                  mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
                  PP_UUID=$(security cms -D -i "${PP_PATH}" | \
                    plutil -extract UUID xml1 -o - - | \
                    sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
                  cp "${PP_PATH}" ~/Library/MobileDevice/Provisioning\ Profiles/"${PP_UUID}".mobileprovision

            - name: Build archive
              env:
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
              run: |
                  xcodebuild archive \
                    -workspace app/ios/App/App.xcworkspace \
                    -scheme App \
                    -configuration Release \
                    -archivePath "${RUNNER_TEMP}/App.xcarchive" \
                    -destination "generic/platform=iOS" \
                    DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
                    CODE_SIGN_STYLE=Manual \
                    PROVISIONING_PROFILE_SPECIFIER="InteraZap App Store" \
                    | xcpretty

            - name: Export .ipa
              run: |
                  xcodebuild -exportArchive \
                    -archivePath "${RUNNER_TEMP}/App.xcarchive" \
                    -exportPath "${RUNNER_TEMP}/ipa" \
                    -exportOptionsPlist app/ios/App/exportOptions.plist \
                    | xcpretty

            - name: Upload .ipa artifact
              uses: actions/upload-artifact@v4
              with:
                  name: interazap-ios-${{ github.ref_name }}
                  path: ${{ runner.temp }}/ipa/*.ipa
                  retention-days: 30

            - name: Upload Sentry sourcemaps (iOS)
              if: ${{ vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != '' }}
              env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  SENTRY_ORG: ${{ vars.SENTRY_ORG }}
                  SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
              run: |
                  cd app
                  VERSION=$(node -p "require('./package.json').version")
                  npx @sentry/cli releases new "${VERSION}+ios"
                  npx @sentry/cli releases files "${VERSION}+ios" upload-sourcemaps \
                    ./dist/app-new/browser \
                    --rewrite \
                    --ext map \
                    --ext js
                  npx @sentry/cli releases finalize "${VERSION}+ios"

            - name: Cleanup keychain
              if: always()
              run: |
                  security delete-keychain "${KEYCHAIN_PATH}" || true
