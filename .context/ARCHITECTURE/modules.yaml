version: "1.0"
project: "InteraZap"
architecture: "DDD (Controller -> DTO -> Action -> Resource) com Bounded Contexts"
generated_at: "2026-05-04"

modules:
  - name: "Ai"
    description: "Integracao com IA: OpenAI, classificacao de mensagens, embeddings com pgvector"
    type: "bounded-context"
    status: "active"
    path: "api/src/Domain/Ai"
    dependencies:
      - "Shared"
      - "Chat"
    exposes:
      - "AiClassifierAction"
      - "AiEmbeddingAction"
    database_tables:
      - "ai_completions"
      - "ai_embeddings"

  - name: "Auth"
    description: "Autenticacao Sanctum, RBAC com Spatie Permissions, gestao de sessao"
    type: "bounded-context"
    status: "active"
    path: "api/src/Domain/Auth"
    dependencies:
      - "Shared"
      - "Platform"
    exposes:
      - "AuthLoginAction"
      - "AuthRegisterAction"
    database_tables:
      - "users"
      - "personal_access_tokens"
      - "roles"
      - "permissions"
      - "model_has_roles"
      - "model_has_permissions"

  - name: "Billing"
    description: "Pagamentos via Asaas, assinaturas, webhooks de cobranca"
    type: "bounded-context"
    status: "active"
    path: "api/src/Domain/Billing"
    dependencies:
      - "Shared"
      - "Platform"
    exposes:
      - "BillingSubscriptionAction"
      - "BillingWebhookAction"
    database_tables:
      - "subscriptions"
      - "invoices"
      - "payment_methods"

  - name: "Chat"
    description: "Mensageria WhatsApp multi-provedor, conversas, contatos, normalizacao de payloads"
    type: "bounded-context"
    status: "active"
    path: "api/src/Domain/Chat"
    dependencies:
      - "Shared"
      - "Platform"
      - "CRM"
    exposes:
      - "ChatMessageAction"
      - "ChatInboundAction"
      - "ChatOutboundAction"
    database_tables:
      - "conversations"
      - "messages"
      - "contacts"
      - "instances"

  - name: "Configuration"
    description: "Configuracoes por tenant, feature flags, integracoes"
    type: "bounded-context"
    status: "active"
    path: "api/src/Domain/Configuration"
    dependencies:
      - "Shared"
      - "Platform"
    exposes:
      - "ConfigurationAction"
    database_tables:
      - "tenant_configurations"
      - "integrations"

  - name: "CRM"
    description: "Pipeline, deals, leads, atendentes, tags"
    type: "bounded-context"
    status: "active"
    path: "api/src/Domain/CRM"
    dependencies:
      - "Shared"
      - "Platform"
      - "Chat"
    exposes:
      - "CrmDealAction"
      - "CrmLeadAction"
    database_tables:
      - "deals"
      - "leads"
      - "pipelines"
      - "stages"
      - "tags"

  - name: "Dashboard"
    description: "Visao consolidada para o tenant (metricas em tempo real)"
    type: "bounded-context"
    status: "active"
    path: "api/src/Domain/Dashboard"
    dependencies:
      - "Shared"
      - "Chat"
      - "CRM"
      - "Reports"
    exposes:
      - "DashboardSummaryAction"
    database_tables: []

  - name: "Gateway"
    description: "Ponte de integracao com o Gateway NestJS via Redis Streams"
    type: "bounded-context"
    status: "active"
    path: "api/src/Domain/Gateway"
    dependencies:
      - "Shared"
      - "Chat"
    exposes:
      - "GatewayPublisherAction"
      - "GatewayConsumerAction"
    database_tables:
      - "gateway_events"

  - name: "Platform"
    description: "Multi-tenancy, isolamento por tenant, gestao de tenants e workspaces"
    type: "bounded-context"
    status: "active"
    path: "api/src/Domain/Platform"
    dependencies:
      - "Shared"
    exposes:
      - "PlatformTenantActions"
      - "PlatformTenantHardDeleteAction"
      - "BelongsToTenant trait"
    database_tables:
      - "platform_tenants"
      - "tenant_users"

  - name: "Reports"
    description: "Relatorios de atendimento, conversao, performance"
    type: "bounded-context"
    status: "active"
    path: "api/src/Domain/Reports"
    dependencies:
      - "Shared"
      - "Chat"
      - "CRM"
    exposes:
      - "ReportGeneratorAction"
    database_tables:
      - "reports"

  - name: "Shared"
    description: "Building blocks compartilhados (traits, base classes, value objects)"
    type: "shared-kernel"
    status: "active"
    path: "api/src/Domain/Shared"
    dependencies: []
    exposes:
      - "BelongsToTenant"
      - "HasUuid"
      - "BaseDTO"
    database_tables: []

  - name: "Gateway-NestJS"
    description: "Servico standalone NestJS: AI, Billing, WebSocket, Redis Streams, providers WhatsApp"
    type: "service"
    status: "active"
    path: "gateway/src"
    dependencies: []
    exposes:
      - "AI module"
      - "Billing module"
      - "WebSocket module"
    database_tables: []

  - name: "App"
    description: "Frontend web/mobile Angular 19 + Ionic + Capacitor"
    type: "frontend"
    status: "active"
    path: "app/src"
    dependencies: []
    exposes: []
    database_tables: []

  - name: "Electron"
    description: "Desktop app Electron 33 + Angular 20, modo offline"
    type: "frontend"
    status: "active"
    path: "electron"
    dependencies: []
    exposes: []
    database_tables: []
