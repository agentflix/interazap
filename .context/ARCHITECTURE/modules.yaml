modules:
  api:
    description: API REST principal — domain, business logic, migrations, autenticação
    tech: PHP 8.3 + Laravel 12
    path: api/
    exposes:
      - REST endpoints (JSON)
      - Artisan commands (migrations, jobs)
    consumes:
      - PostgreSQL 17
      - Redis 7
    owned_by: backend

  gateway:
    description: Gateway de realtime, filas e AI — WebSocket, BullMQ, integrações externas
    tech: Node.js + NestJS 11
    path: gateway/
    exposes:
      - WebSocket (Socket.io)
      - REST endpoints internos
      - BullMQ producers/consumers
    consumes:
      - api (HTTP interno)
      - Redis 7 (BullMQ)
      - Google Generative AI
      - AWS Secrets Manager
      - WhatsApp API
    owned_by: backend

  app:
    description: Frontend web — interface do operador/admin
    tech: TypeScript + Angular 20
    path: app/
    exposes: []
    consumes:
      - gateway (WebSocket + REST)
      - api (REST direto para alguns endpoints)
    owned_by: frontend

  landing:
    description: Landing page institucional
    tech: HTML/CSS/JS estático
    path: landing/
    exposes: []
    consumes: []
    owned_by: frontend

  landing-clinicas:
    description: Landing page vertical clínicas
    tech: HTML/CSS/JS estático
    path: landing-clinicas/
    exposes: []
    consumes: []
    owned_by: frontend
