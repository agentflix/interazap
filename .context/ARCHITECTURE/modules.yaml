modules:
  api:
    description: Núcleo de domínio — business logic, persistência, migrations, autenticação, filas Horizon
    tech: PHP 8.2+ + Laravel 12
    path: api/
    exposes:
      - REST /api (Sanctum)
      - REST /internal (consumido pelo gateway com INTERNAL_API_KEY)
      - Webhooks uazapi e Telegram
      - Artisan commands e jobs Horizon
    consumes:
      - PostgreSQL 17
      - Redis 7 (cache, filas Horizon, Streams para o gateway)
    bounded_contexts:
      - Ai            # agentes, autopilot, runs, tools, skills, knowledge
      - Auth          # usuários, sessões, permissões
      - Billing       # planos, cotas, cobrança, trial
      - Chat          # tickets, mensagens, instâncias, webhooks de canal
      - Configuration # preferências e configurações do tenant
      - CRM           # contatos, negociações, funil
      - Dashboard     # agregações da home
      - Gateway       # client de saída para o gateway (Redis Streams)
      - Platform      # super admin, tenants, planos da plataforma
      - Reports       # relatórios e exports
      - Shared        # base comum (concerns, scopes, filtros, jobs base)
    owned_by: backend

  gateway:
    description: Execução e realtime — WebSocket, BullMQ, inferência de IA, envio outbound, métricas
    tech: Node.js + NestJS 11
    path: gateway/
    exposes:
      - WebSocket /ws (Socket.io)
      - REST interno para o app e para a api
      - Webhook da Meta (WABA)
      - /metrics (Prometheus)
    consumes:
      - api (HTTP interno)
      - Redis 7 (BullMQ + Streams)
      - Google Gemini, OpenAI, MiniMax
      - AWS Secrets Manager
      - Meta Graph API
    bounded_contexts:
      - ai        # providers, consumers, classifier, batch
      - billing   # integração de cobrança
      - chat      # outbound, canais, webhooks Meta, uazapi
      - internal  # endpoints internos
      - realtime  # Socket.io, webchat público, broadcast
      - webhooks  # entrega de webhooks para terceiros
    owned_by: backend

  app:
    description: Frontend web — painel do operador, admin e webchat
    tech: TypeScript + Angular 20 (standalone, signals)
    path: app/
    exposes: []
    consumes:
      - api (REST /api)
      - gateway (WebSocket /ws)
    areas:
      - admin · ai · auth · billing · chat · configuration · crm
      - dashboard · platform · public · reports · settings · ui-kit · webchat
    owned_by: frontend

  landing:
    description: Landing institucional estática
    tech: HTML/CSS/JS
    path: landing/
    exposes: []
    consumes: []
    owned_by: frontend

  landing-clinicas:
    description: Landing vertical clínicas
    tech: HTML/CSS/JS
    path: landing-clinicas/
    exposes: []
    consumes: []
    owned_by: frontend

  landing-new:
    description: Nova landing em construção
    tech: HTML/CSS/JS
    path: landing-new/
    exposes: []
    consumes: []
    owned_by: frontend

  infra:
    description: Provisionamento e deploy (Ansible, Nginx, Docker)
    path: infra/
    owned_by: infra
