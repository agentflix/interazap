stack:
  backend:
    language: "PHP 8.3"
    framework: "Laravel 12"
    extras:
      - "Sanctum 4.2 (auth)"
      - "Spatie Permissions 6.24 (RBAC)"
      - "Horizon 5.43 (queues)"
