  gateway:
    language: "TypeScript 5.7"
    framework: "NestJS 11"
    extras:
      - "BullMQ"
      - "Redis Streams"
      - "Socket.io"
      - "OpenAI SDK"
      - "Asaas (billing)"
  frontend_app:
    language: "TypeScript"
    framework: "Angular 19"
    extras:
      - "Ionic"
      - "Capacitor (Android/iOS)"
      - "Vitest (tests)"
  frontend_desktop:
    language: "TypeScript"
    framework: "Electron 33 + Angular 20"
    extras:
      - "electron-builder"
      - "Auto-update via GitHub Releases"
  database:
    type: "PostgreSQL 17"
    extras:
      - "pgvector (embeddings IA)"
  cache_queue:
    type: "Redis 7"
    extras:
      - "Streams (Gateway <-> API)"
      - "Sessions, cache, queues"
  testing:
    backend: "Pest 4 + PHPUnit 12"
    frontend_app: "Vitest"
    e2e: "Playwright (planejado)"
  infra:
    iac: "Ansible"
    proxy: "nginx"
    ci_cd: "GitHub Actions"
    observability: "Prometheus client (PHP)"

