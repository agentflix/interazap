project:
  name: InteraZap
  version: "1.0.0"
  updated: "2026-05-19"

stack:
  backend_api: "PHP 8.3 + Laravel 12"
  backend_gateway: "Node.js + NestJS 11"
  frontend: "TypeScript + Angular 20"
  database: "PostgreSQL 17"
  cache_queue: "Redis 7 + BullMQ"
  ai: "Google Generative AI"
  infra: "Ansible + Nginx + AWS Secrets Manager"
  package_manager: "pnpm (gateway + app)"

modules:
  active:
    - api
    - gateway
    - app
  static:
    - landing
    - landing-clinicas

metrics:
  tasks_completed: 0
  tasks_in_progress: 0
  features_completed: 0
  last_validation: "2026-05-19"

ci:
  api_tests: "php artisan test"
  gateway_tests: "pnpm --filter gateway test"
  app_tests: "pnpm --filter app test"
  gateway_build: "pnpm --filter gateway build"
  app_build: "pnpm --filter app build"
