project:
  name: "AgentFlix"
  version: "1.0.0"
  description: "Plataforma SaaS multi-tenant para comunicação inteligente com clientes via WhatsApp, CRM, billing e AI autopilot"
  status: "active"
  primary_language: "PHP"
  bootstrap_mode: "existing_code"

stack:
  - name: "Laravel"
    version: "12"
    role: "backend_api"
  - name: "Angular"
    version: "20"
    role: "frontend"
  - name: "NestJS"
    version: "11"
    role: "gateway"
  - name: "PostgreSQL"
    version: "17"
    role: "database"
  - name: "Redis"
    version: "7"
    role: "cache"
  - name: "Prometheus + Grafana"
    version: "latest"
    role: "monitoring"

modules:
  - id: "MOD-001"
    name: "Ai"
    description: "Integração AI/ML, autopilot, knowledge base, embeddings com pgvector e OpenAI"
    status: "in_progress"
  - id: "MOD-002"
    name: "Auth"
    description: "Autenticação via Sanctum, autorização via Spatie Permissions, gerenciamento de tenant"
    status: "in_progress"
  - id: "MOD-003"
    name: "Billing"
    description: "Processamento de pagamentos via Asaas, assinaturas, faturamento e invoices"
    status: "in_progress"
  - id: "MOD-004"
    name: "Chat"
    description: "Mensagens WhatsApp via Z-API/UazAPI, conversas em tempo real com WebSocket"
    status: "in_progress"
  - id: "MOD-005"
    name: "CRM"
    description: "Gestão de contatos, empresas, deals, pipelines e campos customizados"
    status: "in_progress"
  - id: "MOD-006"
    name: "Configuration"
    description: "Configurações do sistema, configurações por empresa, integrações"
    status: "in_progress"
  - id: "MOD-007"
    name: "Dashboard"
    description: "Analytics, métricas, widgets de relatórios e visão geral do tenant"
    status: "in_progress"
  - id: "MOD-008"
    name: "Gateway"
    description: "Relay de APIs externas, tratamento de webhooks, circuit breaker, BullMQ jobs"
    status: "in_progress"
  - id: "MOD-009"
    name: "Platform"
    description: "Funcionalidades multi-tenant da plataforma, onboarding, gestão de planos"
    status: "in_progress"
  - id: "MOD-010"
    name: "Reports"
    description: "Geração de relatórios, exportação CSV/PDF, relatórios agendados"
    status: "in_progress"
  - id: "MOD-011"
    name: "Shared"
    description: "Utilitários cross-domain, busca global, traits compartilhados, base classes"
    status: "in_progress"

decisions:
  - id: "DEC-001"
    title: "DDD com Domain Folders"
    reason: "Separação clara de responsabilidades por domínio seguindo Controller → DTO → Action → Resource para manter alta coesão e baixo acoplamento"
    date: "2026-03-25T00:00:00Z"
  - id: "DEC-002"
    title: "Arquitetura Multi-Tenant com Tenant Isolation"
    reason: "Isolamento de dados por tenant usando trait BelongsToTenant e filtros globais para garantir segurança e compliance entre clientes"
    date: "2026-03-25T00:00:00Z"
  - id: "DEC-003"
    title: "UUID como Primary Keys"
    reason: "Evitar exposição de volume de dados, facilitar merge de bases e eliminar colisões em ambientes distribuídos"
    date: "2026-03-25T00:00:00Z"
  - id: "DEC-004"
    title: "WebSocket via Laravel Reverb + Socket.io"
    reason: "Laravel Reverb no backend para broadcasting nativo com Socket.io no frontend/gateway para comunicação real-time bidirecional"
    date: "2026-03-25T00:00:00Z"
  - id: "DEC-005"
    title: "pgvector para AI Embeddings/RAG"
    reason: "Armazenamento e busca vetorial diretamente no PostgreSQL sem necessidade de banco vetorial separado, simplificando infraestrutura"
    date: "2026-03-25T00:00:00Z"
  - id: "DEC-006"
    title: "NestJS Gateway com BullMQ"
    reason: "Camada intermediária para desacoplar frontend do backend, processar webhooks assíncronos e aplicar circuit breaker em chamadas externas"
    date: "2026-03-25T00:00:00Z"
  - id: "DEC-007"
    title: "Três camadas: Frontend → Gateway → Backend"
    reason: "Separação de concerns entre apresentação, orquestração e lógica de negócio, permitindo escalabilidade independente de cada camada"
    date: "2026-03-25T00:00:00Z"
