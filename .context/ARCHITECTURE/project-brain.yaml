identity:
  name: InteraZap
  description: >
    Plataforma de atendimento conversacional via WhatsApp e webchat,
    com AI generativa para automação de respostas, agendamento e suporte a clínicas.
  domain: Conversational AI + CRM para pequenas e médias empresas

architecture:
  pattern: Microservices
  layers:
    - Presentation (Angular 20 — app/)
    - Gateway (NestJS 11 — realtime, filas, AI)
    - Domain/Application (Laravel 12 — business logic, REST)
    - Infrastructure (PostgreSQL 17, Redis 7)

decisions:
  - id: D01
    title: Gateway separado da API principal
    decision: NestJS 11 como gateway de realtime — Laravel fica exclusivo para domain/business
    rationale: Separação de responsabilidades; NestJS nativo para WebSocket e BullMQ

  - id: D02
    title: BullMQ para processamento assíncrono
    decision: Todas as filas em Redis via BullMQ no gateway
    rationale: Suporte a retry, dead-letter, concorrência configurável por queue

  - id: D03
    title: AI centralizada no gateway
    decision: Google Generative AI integrado apenas no gateway
    rationale: Isolamento de custo e rate-limiting; api fica agnóstica de AI

inviolable_rules:
  - Gateway nunca acessa PostgreSQL diretamente — sempre via api REST
  - Migrations somente em api/ via Laravel Artisan
  - BullMQ queues definidas e processadas somente em gateway/
  - AI (Google Generative AI) integrada somente em gateway/
  - Secrets (AWS Secrets Manager) consumidos somente em gateway/
  - Frontend (app/) nunca acessa banco ou Redis diretamente
  - PSR-12 obrigatório para todo PHP em api/
  - Angular Style Guide obrigatório para todo TypeScript em app/
  - Conventional Commits obrigatório em todos os commits

business_rules:
  - Tenant isolation: toda query deve filtrar por tenant_id
  - Sessões de chat têm TTL; sessão expirada não pode ser reaberta
  - Webhook de WhatsApp processado via BullMQ para garantir idempotência
  - Rate limiting no gateway por tenant para chamadas de AI

testing:
  api: PHPUnit (php artisan test)
  gateway: Jest (pnpm --filter gateway test)
  app: Jest + Angular Testing Library (pnpm --filter app test)
