version: "1.0"
project: "InteraZap"
last_updated: "2026-05-17"

identity:
  name: "InteraZap"
  description: "Plataforma SaaS multi-tenant de automação de WhatsApp com CRM, AI autopilot, billing e atendimento em tempo real"
  type: "SaaS multi-tenant"
  domain: "WhatsApp automation, atendimento ao cliente, CRM, AI"

architecture:
  pattern: "DDD + Clean Architecture"
  layers:
    - "HTTP (Controllers, Requests, Resources)"
    - "Application (Actions, Services, Jobs)"
    - "Domain (Entities, Events, Contracts, Enums)"
    - "Infrastructure (Repositories, Providers, Queue)"
  workspaces:
    - "api/ — Laravel 12 (backend principal)"
    - "gateway/ — NestJS 11 (WebSocket, WhatsApp providers)"
    - "app/ — Angular 20 + Capacitor (frontend mobile/web)"
    - "electron/ — Electron (desktop)"
    - "landing/ — Landing page estática"
  core_principles:
    - "SOLID"
    - "DDD (Domain-Driven Design)"
    - "Clean Architecture (dependências apontam para Domain)"
    - "Multi-tenancy por row (BelongsToTenant em toda entidade)"
    - "Event-driven async (Redis Streams + Queue)"
    - "Circuit Breaker para provedores externos"

key_decisions:
  - decision: "Multi-tenancy por row-level isolation com trait BelongsToTenant"
    rationale: "Simplicidade vs isolamento por schema — decisão inicial do projeto"
    date: "2026-05-17"
    alternatives_rejected: "Schema por tenant (complexidade operacional alta)"

  - decision: "Gateway NestJS separado do api Laravel"
    rationale: "WebSocket real-time e adaptadores de provedor WhatsApp exigem arquitetura diferente do request/response do Laravel"
    date: "2026-05-17"
    alternatives_rejected: "Laravel WebSocket (Reverb) — latência e complexidade de providers"

  - decision: "Dois provedores WhatsApp (UazAPI + Z-API) via Circuit Breaker"
    rationale: "Redundância e disponibilidade — falha em um provider faz failover automático"
    date: "2026-05-17"
    alternatives_rejected: "Provider único — risco de indisponibilidade"

  - decision: "ASAAS como gateway de billing"
    rationale: "Melhor suporte a Pix e boleto no mercado brasileiro"
    date: "2026-05-17"
    alternatives_rejected: "Stripe (sem suporte nativo a Pix)"

business_rules:
  - "Multi-tenancy obrigatório: todo dado por tenant usa BelongsToTenant + tenant_id"
  - "Chat auto-close: tickets fecham após 20 minutos de inatividade (CHAT_AUTO_CLOSE_MINUTES=20)"
  - "AI Autopilot: máximo 800 tokens por resposta, máximo 10 iterações de tools"
  - "WhatsApp: sempre verificar compatibilidade UazAPI + Z-API ao tocar Chat/Gateway"
  - "Billing: ASAAS via webhook — validar HMAC + idempotência via Redis"
  - "Auth: Sanctum tokens com 24h de expiração; JWT para webchat público"
  - "Queue: filas por prioridade (critical, high, default, low, ai, media)"
  - "RAG: vector search (peso 0.6) + keyword search (peso 0.4)"

conventions:
  file_naming: "PascalCase para classes PHP; kebab-case para arquivos TS"
  class_naming: "PascalCase"
  function_naming: "camelCase (TS/PHP)"
  constant_naming: "UPPER_SNAKE_CASE"
  commit_format: "Conventional Commits em pt-BR"
  branch_format: "feature/FEAT-NNN-descricao | fix/FIX-NNN-descricao"

sensitive_areas:
  - path: "api/src/Domain/Platform/"
    reason: "Multi-tenancy — bug aqui vaza dados entre tenants"
    extra_care: "Sempre testar isolamento com 2 tenants distintos"

  - path: "api/src/Domain/Billing/"
    reason: "Cobrança financeira — bug pode gerar cobranças duplicadas ou perdidas"
    extra_care: "Idempotência obrigatória em webhooks, revisar com @ARCHITECT"

  - path: "api/src/Domain/Auth/"
    reason: "Autenticação — bug expõe dados de tenants"
    extra_care: "Code review obrigatório por @REVIEWER + @ARCHITECT"

  - path: "gateway/src/domains/chat/"
    reason: "Envio de mensagens WhatsApp — bug dispara mensagens indevidas para clientes"
    extra_care: "Testar com conta sandbox, verificar rate limits dos providers"
