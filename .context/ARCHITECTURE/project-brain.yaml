version: "1.0"
project: "InteraZap"
last_updated: "2026-05-04"

identity:
  name: "InteraZap"
  description: "Plataforma SaaS multi-tenant de automacao de WhatsApp com CRM integrado, gateway de integracoes e IA para classificacao e streaming de mensagens"
  type: "SaaS multi-tenant - Monorepo (API + Gateway + App + Electron + Landing)"
  domain: "WhatsApp Business automation, CRM, atendimento omnichannel"

architecture:
  pattern: "DDD (Controller -> DTO -> Action -> Resource) por bounded context"
  layers:
    - "Presentation (Http/Controllers, Requests, Resources, Policies)"
    - "Application (Actions, DTOs)"
    - "Domain (Models, Value Objects, Events) - PHP puro"
    - "Infrastructure (Eloquent, Redis, Filesystem, Horizon)"
  core_principles:
    - "Multi-tenancy com isolamento via trait BelongsToTenant"
    - "UUID primary keys (nunca auto-increment)"
    - "Strict types em todos arquivos PHP (declare(strict_types=1))"
    - "phpDoc obrigatorio em classes e metodos publicos"
    - "final class em Controllers, Actions, DTOs"
    - "Eager loading sempre - proibido N+1"
    - "fillable explicito - nunca guarded = []"
    - "Idempotencia em webhooks (Redis-based)"
    - "Comunicacao API <-> Gateway via Redis Streams (com ack)"
    - "RBAC obrigatorio em todo Action"

key_decisions:
  - decision: "Adocao de DDD com bounded contexts em src/Domain/{Context}"
    rationale: "Clareza de responsabilidades, isolamento de regras de negocio por contexto"
    date: "Setup inicial do projeto"
    alternatives_rejected: "MVC tradicional, separacao por tipo de arquivo"

  - decision: "Multi-tenant via trait BelongsToTenant + scope global"
    rationale: "Isolamento automatico em queries, dificil de esquecer; row-level seguranca"
    date: "Setup inicial"
    alternatives_rejected: "Schema-per-tenant (custo de migracoes), DB-per-tenant (custo operacional)"

  - decision: "Gateway separado em NestJS (TypeScript) ao inves de jobs Laravel"
    rationale: "Isolar integracoes externas (OpenAI, Asaas, providers WhatsApp); permitir reboot independente; usar BullMQ + Redis Streams"
    date: "Setup inicial"
    alternatives_rejected: "Tudo dentro do Laravel (acoplamento), microservico em Go (curva de aprendizado)"

  - decision: "Frontends multiplos com mesma codebase Angular (App + Electron)"
    rationale: "Reuso de componentes; experiencia consistente web/mobile/desktop"
    date: "Setup inicial"
    alternatives_rejected: "App nativo separado por plataforma"

  - decision: "pgvector no PostgreSQL para embeddings IA"
    rationale: "Evita Pinecone/Weaviate adicional; mantem tudo em um DB"
    date: "Setup inicial"
    alternatives_rejected: "Pinecone, Weaviate, Qdrant"

business_rules:
  - "Todo dado (mensagem, contato, deal) PERTENCE a um tenant - isolamento absoluto"
  - "Webhooks WhatsApp (UazAPI/Z-API) sao autenticados via HMAC e idempotentes"
  - "Mensagens recebidas sao classificadas por IA (intent + sentiment) antes de notificar atendentes"
  - "Atendentes so veem leads/conversas atribuidos (RBAC com Spatie)"
  - "Pagamentos via Asaas - webhook obrigatorio para confirmacao"
  - "Auditoria com owen-it/laravel-auditing em modelos sensiveis (users, billing)"
  - "Tenant em hard-delete (purge) requer confirmacao dupla e remove tudo cascading"

conventions:
  file_naming: "Domain/{Context}/{Tipo}/{Context}{Entity}{Tipo}.php"
  class_naming: "PascalCase com sufixo do tipo (ex: ChatMessageAction, ChatMessageDTO)"
  function_naming: "camelCase (PHP) / camelCase (TS)"
  constant_naming: "UPPER_SNAKE_CASE"
  commit_format: "Conventional Commits (pt-BR aceito): feat: / fix: / refactor: / chore: / docs: / test:"
  branch_format: "feature/FEAT-NNN-descricao | fix/BUG-NNN-descricao"
  test_naming: "tests/Feature/{Context}/{Entity}Test.php (Pest) / *.spec.ts (Vitest)"

sensitive_areas:
  - path: "api/src/Domain/Auth"
    reason: "Autenticacao e gestao de tokens - exposicao critica"
    extra_care: "Nunca logar tokens; rate limiting; testes de seguranca"

  - path: "api/src/Domain/Billing"
    reason: "Cobranca financeira via Asaas - erros = perda de receita"
    extra_care: "Webhooks idempotentes; auditoria; nao apagar registros"

  - path: "api/src/Domain/Platform"
    reason: "Multi-tenancy - vazamento entre tenants seria catastrofico"
    extra_care: "Toda query DEVE passar por BelongsToTenant; testes de isolamento obrigatorios"

  - path: "gateway/src/domains/whatsapp"
    reason: "Integracao com providers externos - falhas afetam comunicacao"
    extra_care: "Circuit breaker + retry exponencial; logs estruturados; idempotencia"

  - path: "gateway/src/domains/ai"
    reason: "Custo OpenAI - chamadas indevidas geram conta alta"
    extra_care: "Rate limiting; cache de embeddings; budget alerts"

  - path: "api/src/Domain/Chat"
    reason: "Volume alto de mensagens - performance critica"
    extra_care: "Eager loading; indices; particionamento futuro; queue jobs para tarefas pesadas"
