# Cérebro do Projeto — Metadados para IA
# Este arquivo ajuda a IA a entender o projeto rapidamente

version: "1.0"
project: "InteraZap"
last_updated: "2026-04-11"

identity:
  name: "InteraZap"
  description: "Plataforma de comunicação multicanal com IA integrada"
  type: "SaaS Multi-tenant"
  domain: "Comunicação empresarial, CRM, Chatbots com IA"

architecture:
  pattern: "DDD (Domain-Driven Design)"
  layers:
    - "Domain (Entities, Value Objects, Services, Events, Policies)"
    - "Application (Actions, DTOs)"
    - "Presentation (Controllers, Middleware, Requests)"
    - "Infrastructure (Jobs, Mail, Notifications, External Services)"
  core_principles:
    - "DDD - Domain é o centro"
    - "Laravel 12 com autoload PSR-4"
    - "Angular 20 com standalone components"
    - "Multi-tenant com row-level isolation"

key_decisions:
  - decision: "Arquitetura DDD com Laravel 12"
    rationale: "Separação clara de responsabilidades, testabilidade, manutenibilidade"
    date: "2026-01-01"
    alternatives_rejected: "MVC tradicional, Transaction Script"
  - decision: "Angular standalone components"
    rationale: "Melhor tree-shaking, lazy loading nativo, redução de boilerplate"
    date: "2026-01-01"
    alternatives_rejected: "Modules tradicionais com NgModule"
  - decision: "PostgreSQL como banco principal"
    rationale: "Suporte a JSONB, full-text search, row-level security"
    date: "2026-01-01"
    alternatives_rejected: "MySQL, MongoDB"

business_rules:
  - "Multi-tenant: cada tenant tem isolation via tenant_id"
  - "Chat: mensagens podem ser reescritas por IA antes do envio"
  - "Billing: Planos com features gated por permissions"
  - "Auth: Roles e Permissions via Spatie Laravel Permission"

conventions:
  file_naming: "kebab-case para arquivos (e.g., chat-message.ts)"
  class_naming: "PascalCase (e.g., ChatMessage, AiService)"
  function_naming: "camelCase (e.g., getById, sendMessage)"
  constant_naming: "UPPER_SNAKE_CASE (e.g., MAX_RETRY_COUNT)"
  commit_format: "Conventional Commits (pt-BR ou en)"
  branch_format: "feature/FEAT-NNN-descricao | fix/FIX-NNN-descricao"

sensitive_areas:
  - path: "api/src/Domain/Billing"
    reason: "Lógica de pagamento e subscription - risco financeiro"
    extra_care: "Testes obrigatórios, validação dupla"
  - path: "api/src/Domain/Auth"
    reason: "Autenticação e autorização - segurança crítica"
    extra_care: "Audit logging, validação estrita"
  - path: "api/src/Domain/Platform"
    reason: "Gestão de tenants - isolamento multi-tenant"
    extra_care: "Verificar tenant_id em todas as queries"
  - path: "app/src/app/pages/chat"
    reason: "Fluxo de mensagens em tempo real"
    extra_care: "Testes E2E para edge cases"
