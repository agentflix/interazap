rules:
  - id: R01
    from: gateway
    to: postgresql
    allowed: false
    reason: gateway não acessa PostgreSQL diretamente — usa api via HTTP

  - id: R02
    from: app
    to: postgresql
    allowed: false
    reason: frontend nunca acessa banco diretamente

  - id: R03
    from: app
    to: redis
    allowed: false
    reason: frontend nunca acessa Redis diretamente

  - id: R04
    from: landing
    to: api
    allowed: false
    reason: landing pages são estáticas — sem chamadas server-side

  - id: R05
    from: landing-clinicas
    to: api
    allowed: false
    reason: landing pages são estáticas — sem chamadas server-side

  - id: R06
    from: api
    to: google_ai
    allowed: false
    reason: integração AI centralizada apenas no gateway

  - id: R07
    from: api
    to: whatsapp_api
    allowed: false
    reason: integrações externas centralizadas no gateway

layer_rules:
  - rule: migrations só em api/ via Laravel Artisan
  - rule: BullMQ producers e consumers só em gateway/
  - rule: secrets AWS consumidos só em gateway/ via @aws-sdk/client-secrets-manager
