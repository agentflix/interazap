# Dependências entre módulos
# Regra: dependências devem ser unidirecionais. Ciclos são proibidos.

version: "1.0"
project: "InteraZap"

dependency_rules:
  - "Domain Layer NÃO pode importar Infrastructure ou Presentation"
  - "Application Layer (Actions) depende apenas de Domain"
  - "Infrastructure Layer implementa interfaces definidas no Domain"
  - "Presentation Layer (Controllers) depende de Application"
  - "Shared Kernel é compartilhado entre todos os módulos (acoplamento controlado)"

module_dependencies:
  "AI":
    depends_on: []
    communication: "sync"

  "Auth":
    depends_on: []
    communication: "standalone"

  "Billing":
    depends_on: ["Auth"]
    communication: "sync"

  "Chat":
    depends_on: ["Auth"]
    communication: "sync/events"

  "Configuration":
    depends_on: ["Auth"]
    communication: "sync"

  "CRM":
    depends_on: ["Auth"]
    communication: "sync"

  "Dashboard":
    depends_on: ["Chat", "Billing"]
    communication: "sync"

  "Gateway":
    depends_on: ["Chat"]
    communication: "async/events"

  "Platform":
    depends_on: []
    communication: "standalone"

  "Reports":
    depends_on: ["Chat", "Billing", "CRM"]
    communication: "sync"

  "Shared":
    depends_on: []
    communication: "shared-kernel"

forbidden_dependencies:
  - from: "Domain"
    to: "Infrastructure"
    reason: "Viola DDD — Domain não conhece implementação"
  - from: "Domain"
    to: "Presentation"
    reason: "Viola DDD — Domain não conhece controllers"
  - from: "Application"
    to: "Infrastructure"
    reason: "Application conhece apenas interfaces do Domain"
  - from: "Shared"
    to: "any"
    reason: "Shared Kernel não deve ter dependências direcionais"
