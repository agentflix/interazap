rules:
  - id: R01
    from: gateway
    to: postgresql
    allowed: false
    reason: gateway não tem driver de banco — todo dado passa pela api

  - id: R02
    from: app
    to: postgresql
    allowed: false

  - id: R03
    from: app
    to: redis
    allowed: false

  - id: R04
    from: app
    to: provedores_llm
    allowed: false
    reason: chave de LLM nunca chega ao browser

  - id: R05
    from: landing
    to: api
    allowed: false

  - id: R06
    from: landing-clinicas
    to: api
    allowed: false

  - id: R07
    from: landing-new
    to: api
    allowed: false

  - id: R08
    from: api
    to: provedores_llm
    allowed: exceptions_only
    reason: inferência conversacional vai pelo gateway
    exceptions:
      - api/src/Domain/Ai/Services/AiMediaTranscriptionService.php
      - api/src/Domain/Ai/Services/AiGuardianService.php

  - id: R09
    from: api
    to: uazapi_meta_telegram
    allowed: exceptions_only
    reason: envio outbound é do gateway; a api só recebe webhooks de uazapi e Telegram

  - id: R10
    from: gateway
    to: api
    allowed: true
    channel: HTTP /internal com INTERNAL_API_KEY

  - id: R11
    from: api
    to: gateway
    allowed: true
    channel: Redis Streams via api/src/Domain/Gateway/Services/RedisGatewayClient.php

layer_rules:
  - migrations só em api/database/migrations via php artisan make:migration
  - BullMQ (producers e consumers) só em gateway/
  - jobs de domínio (Horizon) só em api/src/Domain/*/Jobs
  - AWS Secrets Manager só em gateway/
  - Controller não contém business logic — vai em Action
  - Action não valida payload — validação em FormRequest
  - toda query multi-tenant filtra por tenant
  - app não duplica interface — model centralizado em core/models ou models do domínio
