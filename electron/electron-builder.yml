appId: com.interazap.desktop
productName: InteraZap Desktop
copyright: Copyright © 2026 InteraZap
directories:
    output: release
    buildResources: build
files:
    - dist/**/*
    - app/**/*
    - build/icon.png
    - package.json
    - '!**/*.map'
asar: true
compression: maximum
win:
    target:
        - target: nsis
          arch:
              - x64
    icon: build/icon.ico
    artifactName: '${productName} Setup ${version}.${ext}'
nsis:
    oneClick: false
    perMachine: false
    allowToChangeInstallationDirectory: true
    createDesktopShortcut: true
    createStartMenuShortcut: true
    shortcutName: InteraZap
mac:
    target:
        - target: dmg
          arch:
              - arm64
              - x64
    icon: build/icon.icns
    category: public.app-category.business
    minimumSystemVersion: '10.15'
    identity: null
    artifactName: '${productName}-${version}-${arch}.${ext}'
dmg:
    title: '${productName} ${version}'
    icon: build/icon.icns
linux:
    target:
        - AppImage
        - deb
        - rpm
    icon: build/icons
    category: Office
    maintainer: InteraZap <suporte@interazap.com>
publish:
    provider: github
    owner: agentflix
    repo: interazap-desktop
