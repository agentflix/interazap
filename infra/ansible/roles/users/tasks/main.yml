# =====================================================
# Role: Users
# Propósito: Criar usuário deploy com acesso SUDO e SSH
# Autor: DevOps Agentflix
# =====================================================

- name: 'Criar grupo sudo deploy'
  group:
      name: deploysudo
      state: present
      system: yes

- name: 'Criar usuário deploy'
  user:
      name: deploy
      comment: 'Usuário para deploy InteraZap'
      groups: deploysudo, www-data
      append: yes
      shell: /bin/bash
      password: "{{ agentflix_password | password_hash('sha512') }}"
      create_home: yes
      home: /home/deploy
      skeleton: /etc/skel
      system: no
      state: present

- name: 'Criar diretório .ssh para deploy'
  file:
      path: /home/deploy/.ssh
      owner: deploy
      group: deploy
      mode: '0700'
      state: directory

- name: 'Gerar chave SSH para o usuário deploy (se não existir)'
  user:
      name: deploy
      generate_ssh_key: yes
      ssh_key_type: ed25519
      ssh_key_bits: 4096
      ssh_key_comment: 'deploy@interazap'
  register: deploy_ssh_key

- name: 'Ler chave SSH pública do deploy (remoto)'
  slurp:
      src: /home/deploy/.ssh/id_ed25519.pub
  register: deploy_ssh_pubkey
  when: deploy_ssh_key.changed
  ignore_errors: yes

- name: 'Copiar chave SSH pública para authorized_keys'
  copy:
      content: "{{ deploy_ssh_pubkey['content'] | b64decode }}"
      dest: /home/deploy/.ssh/authorized_keys
      owner: deploy
      group: deploy
      mode: '0600'
  when: deploy_ssh_key.changed and not (deploy_ssh_pubkey.failed | default(false))

- name: 'Adicionar chave SSH do admin (máquina local) ao authorized_keys do deploy'
  authorized_key:
      user: deploy
      state: present
      key: "{{ lookup('pipe', 'ssh-add -L 2>/dev/null || true') }}"
  when: lookup('pipe', 'ssh-add -L 2>/dev/null || true') != ''

- name: 'Exibir chave SSH pública do deploy (para adicionar ao GitHub)'
  debug:
      msg:
          - '=============================================='
          - 'CHAVE SSH PÚBLICA DO DEPLOY (adicionar ao GitHub Deploy Keys):'
          - '=============================================='
          - "{{ deploy_ssh_pubkey['content'] | b64decode }}"
          - '=============================================='
  when: deploy_ssh_key.changed and not (deploy_ssh_pubkey.failed | default(false))

- name: 'Salvar chave SSH pública em arquivo para backup'
  copy:
      content: "{{ deploy_ssh_pubkey['content'] | b64decode }}"
      dest: /root/deploy_ssh_public_key.txt
      mode: '0644'
  when: deploy_ssh_key.changed and not (deploy_ssh_pubkey.failed | default(false))

- name: 'Configurar sudo para grupo deploysudo'
  copy:
      dest: /etc/sudoers.d/deploysudo
      content: |
          %deploysudo ALL=(ALL) NOPASSWD: /usr/bin/apt-get *
          %deploysudo ALL=(ALL) NOPASSWD: /usr/bin/apt *
          %deploysudo ALL=(ALL) NOPASSWD: /usr/bin/systemctl reload nginx
          %deploysudo ALL=(ALL) NOPASSWD: /usr/bin/supervisorctl *
      owner: root
      group: root
      mode: '0440'
      validate: 'visudo -cf %s'

- name: 'Configurar sudo para deploy (sem senha — necessário para CI/CD)'
  copy:
      dest: /etc/sudoers.d/deploy
      content: |
          deploy ALL=(ALL) NOPASSWD: ALL
      owner: root
      group: root
      mode: '0440'
      validate: 'visudo -cf %s'

- name: 'Criar diretórios de aplicação - Production'
  file:
      path: '{{ item }}'
      owner: www-data
      group: www-data
      mode: '0755'
      state: directory
  loop:
      - /data/production/api/api
      - /data/production/api/api/storage/app/public
      - /data/production/api/api/storage/framework/cache
      - /data/production/api/api/storage/framework/sessions
      - /data/production/api/api/storage/framework/views
      - /data/production/api/api/storage/logs
      - /data/production/api/api/bootstrap/cache
      - /data/production/api/api/public
      - /data/production/app/dist/interazap/browser
      - /data/production/gateway/dist
      - /data/production/landing/public
      - /var/log/interazap

- name: 'Criar diretórios de aplicação - Staging'
  file:
      path: '{{ item }}'
      owner: www-data
      group: www-data
      mode: '0755'
      state: directory
  loop:
      - /data/stage/api/api
      - /data/stage/api/api/storage/app/public
      - /data/stage/api/api/storage/framework/cache
      - /data/stage/api/api/storage/framework/sessions
      - /data/stage/api/api/storage/framework/views
      - /data/stage/api/api/storage/logs
      - /data/stage/api/api/bootstrap/cache
      - /data/stage/api/api/public
      - /data/stage/app/dist/interazap/browser
      - /data/stage/gateway/dist
      - /data/stage/landing/public
      - /var/log/interazap
