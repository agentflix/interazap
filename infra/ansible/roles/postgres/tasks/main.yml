# =====================================================
# Role: PostgreSQL
# Propósito: PostgreSQL 18 com pgvector e configuração de segurança
# Autor: DevOps Agentflix
# =====================================================

- name: 'Criar /tmp/ansible para Ansible module executor'
  file:
      path: /tmp/ansible
      state: directory
      mode: '0777'

- name: 'Importar chave GPG do PostgreSQL (signed-by)'
  get_url:
      url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
      dest: /usr/share/keyrings/postgresql-archive-keyring.asc
      mode: '0644'
  become: yes

- name: 'Adicionar repositório PostgreSQL APT'
  apt_repository:
      repo: 'deb [arch=amd64 signed-by=/usr/share/keyrings/postgresql-archive-keyring.asc] https://apt.postgresql.org/pub/repos/apt {{ ansible_facts["distribution_release"] }}-pgdg main'
      state: present
      filename: pgdg
  become: yes

- name: 'Aguardar liberação do lock do apt'
  shell: |
      for i in $(seq 1 60); do
        if ! fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock >/dev/null 2>&1; then
          exit 0
        fi
        sleep 2
      done
      exit 1
  args:
      executable: /bin/bash
  changed_when: false
  become: yes

- name: 'Atualizar cache do apt'
  apt:
      update_cache: yes
      cache_valid_time: 3600
      lock_timeout: 300
  become: yes
  retries: 3
  delay: 10
  register: apt_update_result
  until: apt_update_result is succeeded

- name: 'Instalar PostgreSQL 17'
  apt:
      name:
          - postgresql-17
          - postgresql-client-17
          - postgresql-17-pgvector
          - postgresql-contrib-17
          - libpq-dev
      state: present
      install_recommends: no

- name: 'Instalar python3-psycopg2 (dependência dos módulos postgresql_*)'
  apt:
      name: python3-psycopg2
      state: present

- name: 'Instalar pacote locales'
  apt:
      name: locales
      state: present

- name: 'Adicionar pt_BR.UTF-8 ao locale.gen'
  lineinfile:
      path: /etc/locale.gen
      regexp: '^#?\s*pt_BR.UTF-8'
      line: 'pt_BR.UTF-8 UTF-8'
      create: yes
  become: yes

- name: 'Gerar locale pt_BR.UTF-8'
  command: locale-gen pt_BR.UTF-8
  args:
      creates: /usr/lib/locale/pt_BR.UTF-8
  become: yes
  notify: 'Reiniciar PostgreSQL'

- name: 'Criar diretório de configuração adicional'
  file:
      path: /etc/postgresql/17/main/conf.d
      owner: postgres
      group: postgres
      mode: '0755'
      state: directory

- name: 'Configurar PostgreSQL - Conexões e Performance'
  lineinfile:
      path: /etc/postgresql/17/main/postgresql.conf
      regexp: '{{ item.regexp }}'
      line: '{{ item.line }}'
      create: yes
  loop:
      - { regexp: '^listen_addresses', line: "listen_addresses = 'localhost'" }
      - { regexp: '^port', line: 'port = 5432' }
      - { regexp: '^max_connections', line: 'max_connections = 200' }
      - { regexp: '^shared_buffers', line: 'shared_buffers = 512MB' }
      - { regexp: '^effective_cache_size', line: 'effective_cache_size = 1GB' }
      - { regexp: '^maintenance_work_mem', line: 'maintenance_work_mem = 64MB' }
      - { regexp: '^checkpoint_completion_target', line: 'checkpoint_completion_target = 0.9' }
      - { regexp: '^wal_buffers', line: 'wal_buffers = 16MB' }
      - { regexp: '^default_statistics_target', line: 'default_statistics_target = 100' }
      - { regexp: '^random_page_cost', line: 'random_page_cost = 1.1' }
      - { regexp: '^effective_io_concurrency', line: 'effective_io_concurrency = 200' }
      - { regexp: '^work_mem', line: 'work_mem = 16MB' }
      - { regexp: '^min_wal_size', line: 'min_wal_size = 1GB' }
      - { regexp: '^max_wal_size', line: 'max_wal_size = 4GB' }
      - { regexp: '^max_worker_processes', line: 'max_worker_processes = 4' }
      - { regexp: '^max_parallel_workers_per_gather', line: 'max_parallel_workers_per_gather = 2' }
      - { regexp: '^max_parallel_workers\s', line: 'max_parallel_workers = 4' }
      - { regexp: '^wal_level', line: 'wal_level = replica' }
      - { regexp: '^logging_collector', line: 'logging_collector = on' }
      - { regexp: '^log_directory', line: "log_directory = 'log'" }
      - { regexp: '^log_filename', line: "log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'" }
      - { regexp: '^log_statement', line: "log_statement = 'ddl'" }
      - { regexp: '^log_line_prefix', line: "log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h'" }
      - { regexp: '^log_lock_waits', line: 'log_lock_waits = on' }
      - { regexp: '^log_min_duration_statement', line: 'log_min_duration_statement = 1000' }
      - { regexp: '^autovacuum\s', line: 'autovacuum = on' }
      - { regexp: '^autovacuum_max_workers', line: 'autovacuum_max_workers = 3' }
  notify: 'Reiniciar PostgreSQL'

- name: 'Configurar autenticação pg_hba.conf'
  template:
      src: pg_hba.conf.j2
      dest: /etc/postgresql/17/main/pg_hba.conf
      mode: '0600'
      owner: postgres
      group: postgres
  notify: 'Recarregar PostgreSQL'

- name: 'Habilitar e iniciar PostgreSQL'
  service:
      name: postgresql
      state: started
      enabled: yes

- name: 'Aplicar reinícios e recargas pendentes do PostgreSQL'
  meta: flush_handlers

- name: 'Aguardar PostgreSQL estar pronto para conexões'
  shell: |
      for i in $(seq 1 30); do
        pg_isready -q && exit 0
        sleep 1
      done
      exit 1
  args:
      executable: /bin/bash
  changed_when: false
  register: pg_ready
  retries: 3
  delay: 5
  until: pg_ready.rc == 0

- name: 'Criar superusuário postgres'
  become: yes
  become_user: postgres
  no_log: true
  postgresql_user:
      name: postgres
      password: '{{ postgres_root_password }}'
      role_attr_flags: SUPERUSER
      encrypted: yes

- name: 'Criar usuário agentflix_app'
  become: yes
  become_user: postgres
  no_log: true
  postgresql_user:
      name: agentflix_app
      password: '{{ postgres_app_password }}'
      role_attr_flags: CREATEDB,LOGIN
      encrypted: yes

- name: 'Criar banco de dados interazap (Production)'
  become: yes
  become_user: postgres
  shell: |
      psql -tc "SELECT 1 FROM pg_database WHERE datname = 'interazap'" | grep -q 1 || \
      psql -c "CREATE DATABASE interazap OWNER agentflix_app ENCODING 'UTF8' LOCALE_PROVIDER libc LC_COLLATE 'pt_BR.UTF-8' LC_CTYPE 'pt_BR.UTF-8' TEMPLATE template0"
  register: create_db_agentflix
  changed_when: "'CREATE DATABASE' in create_db_agentflix.stdout"

- name: 'Criar banco de dados agentflix_stage (Staging)'
  become: yes
  become_user: postgres
  shell: |
      psql -tc "SELECT 1 FROM pg_database WHERE datname = 'agentflix_stage'" | grep -q 1 || \
      psql -c "CREATE DATABASE agentflix_stage OWNER agentflix_app ENCODING 'UTF8' LOCALE_PROVIDER libc LC_COLLATE 'pt_BR.UTF-8' LC_CTYPE 'pt_BR.UTF-8' TEMPLATE template0"
  register: create_db_agentflix_stage
  changed_when: "'CREATE DATABASE' in create_db_agentflix_stage.stdout"

- name: 'Criar banco de dados gateway (Production)'
  become: yes
  become_user: postgres
  shell: |
      psql -tc "SELECT 1 FROM pg_database WHERE datname = 'gateway'" | grep -q 1 || \
      psql -c "CREATE DATABASE gateway OWNER agentflix_app ENCODING 'UTF8' LOCALE_PROVIDER libc LC_COLLATE 'pt_BR.UTF-8' LC_CTYPE 'pt_BR.UTF-8' TEMPLATE template0"
  register: create_db_gateway
  changed_when: "'CREATE DATABASE' in create_db_gateway.stdout"

- name: 'Criar banco de dados gateway_stage (Staging)'
  become: yes
  become_user: postgres
  shell: |
      psql -tc "SELECT 1 FROM pg_database WHERE datname = 'gateway_stage'" | grep -q 1 || \
      psql -c "CREATE DATABASE gateway_stage OWNER agentflix_app ENCODING 'UTF8' LOCALE_PROVIDER libc LC_COLLATE 'pt_BR.UTF-8' LC_CTYPE 'pt_BR.UTF-8' TEMPLATE template0"
  register: create_db_gateway_stage
  changed_when: "'CREATE DATABASE' in create_db_gateway_stage.stdout"

- name: 'Habilitar extensão pgvector'
  become: yes
  become_user: postgres
  postgresql_ext:
      name: vector
      db: '{{ item }}'
      cascade: yes
  loop:
      - interazap
      - agentflix_stage
      - gateway
      - gateway_stage

- name: 'Habilitar extensões adicionais'
  become: yes
  become_user: postgres
  postgresql_ext:
      name: '{{ item }}'
      db: interazap
  loop:
      - pg_trgm
      - unaccent
      - uuid-ossp

- name: 'Configurar logrotate para PostgreSQL'
  copy:
      dest: /etc/logrotate.d/postgresql-common
      content: |
          /var/log/postgresql/*.log {
              daily
              rotate 14
              compress
              delaycompress
              notifempty
              create 0640 postgres postgres
              sharedscripts
              postrotate
                  if [ -d /run/postgresql ]; then
                      pg_ctlcluster 17 main reload > /dev/null || true
                  fi
              endscript
          }
      mode: '0644'
  ignore_errors: yes
