# =====================================================
# Role: SSL
# Propósito: Instalar Certbot e gerar certificados SSL
# Autor: DevOps Agentflix
# =====================================================

- name: 'Instalar Certbot e plugin Nginx'
  apt:
      name:
          - openssl
          - certbot
          - python3-certbot-nginx
      state: present

- name: 'Definir domínios SSL'
  set_fact:
      ssl_domains:
          - interazap.com.br
          - www.interazap.com.br
          - app.interazap.com.br
          - api.interazap.com.br
          - gateway.interazap.com.br
          - stage.www.interazap.com.br
          - stage.app.interazap.com.br
          - stage.api.interazap.com.br
          - stage.gateway.interazap.com.br

- name: 'Criar diretório para certificados'
  file:
      path: /etc/letsencrypt/live
      owner: root
      group: root
      mode: '0755'
      state: directory

- name: 'Criar diretório base para fallback self-signed'
  file:
      path: /etc/interazap/selfsigned
      owner: root
      group: root
      mode: '0755'
      state: directory

- name: 'Criar diretórios fallback por domínio'
  file:
      path: '/etc/interazap/selfsigned/{{ item }}'
      owner: root
      group: root
      mode: '0755'
      state: directory
  loop: '{{ ssl_domains }}'

- name: 'Gerar certificado temporário self-signed quando ausente'
  command: >
      openssl req -x509 -nodes -newkey rsa:2048
      -keyout /etc/interazap/selfsigned/{{ item }}/privkey.pem
      -out /etc/interazap/selfsigned/{{ item }}/fullchain.pem
      -days 3
      -subj "/CN={{ item }}"
  args:
      creates: '/etc/interazap/selfsigned/{{ item }}/fullchain.pem'
  loop: '{{ ssl_domains }}'

- name: 'Ajustar permissões dos arquivos fallback'
  file:
      path: '/etc/interazap/selfsigned/{{ item.0 }}/{{ item.1 }}'
      owner: root
      group: root
      mode: "{{ '0600' if item.1 == 'privkey.pem' else '0644' }}"
      state: file
  loop: "{{ ssl_domains | product(['privkey.pem', 'fullchain.pem']) | list }}"

- name: 'Limpar certs self-signed injetados para certbot funcionar'
  shell: |
      if [ -d "/etc/letsencrypt/live/{{ item }}" ] && [ ! -f "/etc/letsencrypt/renewal/{{ item }}.conf" ]; then
        rm -rf "/etc/letsencrypt/live/{{ item }}"
        echo "removed"
      else
        echo "skipped"
      fi
  args:
      executable: /bin/bash
  loop: '{{ ssl_domains }}'
  register: ssl_cleanup
  changed_when: "'removed' in ssl_cleanup.stdout"

- name: 'Remover lock stale do certbot'
  file:
      path: /var/lib/letsencrypt/.certbot.lock
      state: absent

- name: 'Tentar emitir certificados reais via Certbot (por domínio)'
  shell: |
      if [ -f "/etc/letsencrypt/renewal/{{ item }}.conf" ]; then
        echo "SKIP: cert already managed by certbot"
        exit 0
      fi
      certbot certonly --nginx \
        -d {{ item }} \
        --cert-name {{ item }} \
        --non-interactive \
        --agree-tos \
        --email admin@interazap.com.br
  args:
      executable: /bin/bash
  loop: '{{ ssl_domains }}'
  loop_control:
      pause: 3
  register: certbot_results
  ignore_errors: yes

- name: 'Verificar se certificado real foi emitido'
  stat:
      path: '/etc/letsencrypt/live/{{ item }}/fullchain.pem'
  loop: '{{ ssl_domains }}'
  register: ssl_certbot_status

- name: 'Criar diretórios finais quando certbot falhar'
  file:
      path: '/etc/letsencrypt/live/{{ item.item }}'
      owner: root
      group: root
      mode: '0755'
      state: directory
  loop: '{{ ssl_certbot_status.results }}'
  when: not item.stat.exists

- name: 'Injetar fullchain fallback quando necessário'
  copy:
      src: '/etc/interazap/selfsigned/{{ item.item }}/fullchain.pem'
      dest: '/etc/letsencrypt/live/{{ item.item }}/fullchain.pem'
      remote_src: true
      owner: root
      group: root
      mode: '0644'
  loop: '{{ ssl_certbot_status.results }}'
  when: not item.stat.exists

- name: 'Injetar privkey fallback quando necessário'
  copy:
      src: '/etc/interazap/selfsigned/{{ item.item }}/privkey.pem'
      dest: '/etc/letsencrypt/live/{{ item.item }}/privkey.pem'
      remote_src: true
      owner: root
      group: root
      mode: '0600'
  loop: '{{ ssl_certbot_status.results }}'
  when: not item.stat.exists

- name: 'Renovar certificados automaticamente'
  cron:
      name: 'Certbot auto-renew'
      hour: '3'
      minute: '30'
      job: "certbot renew --quiet --deploy-hook 'systemctl reload nginx'"
