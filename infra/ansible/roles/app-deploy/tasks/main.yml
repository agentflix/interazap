# =====================================================
# Role: App Deploy
# Propósito: Deploy Atômico (Symlinks) - API, App, Gateway
# Autor: DevOps Agentflix
# =====================================================

- name: 'Criar /tmp/ansible para Ansible module executor'
  file:
      path: /tmp/ansible
      state: directory
      mode: '0777'

- name: 'Definir timestamp do deploy'
  set_fact:
      deploy_timestamp: "{{ lookup('pipe', 'date +%Y%m%d%H%M%S') }}"

- name: 'Instalar git e rsync'
  apt:
      name:
          - git
          - rsync
      state: present

- name: 'Garantir symlink /data/prod -> /data/production'
  file:
      src: /data/production
      dest: /data/prod
      state: link
      force: yes

# =====================================================
# ESTRUTURA DE DIRETÓRIOS
# =====================================================

- name: 'Criar estrutura de pastas (Production)'
  file:
      path: '{{ item }}'
      owner: www-data
      group: www-data
      mode: '0755'
      state: directory
  loop:
      - '{{ deploy_path }}/api/releases'
      - '{{ deploy_path }}/api/shared'
      - '{{ deploy_path }}/app/releases'
      - '{{ deploy_path }}/gateway/releases'
      - '{{ deploy_path }}/gateway/shared'

- name: 'Criar pasta da release atual (API)'
  file:
      path: '{{ deploy_path }}/api/releases/{{ deploy_timestamp }}'
      owner: deploy
      group: deploy
      mode: '0755'
      state: directory

- name: 'Resolver segredos efetivos por ambiente'
  set_fact:
      effective_gateway_internal_api_key: "{{ gateway_internal_api_key_production if app_environment == 'production' else gateway_internal_api_key_staging }}"
      effective_gateway_jwt_secret: "{{ gateway_jwt_secret_production if app_environment == 'production' else gateway_jwt_secret_staging }}"
      effective_webchat_jwt_secret: "{{ (webchat_jwt_secret_production if app_environment == 'production' else webchat_jwt_secret_staging) | default((gateway_jwt_secret_production if app_environment == 'production' else gateway_jwt_secret_staging), true) }}"
      effective_app_key: "{{ interazap_secret_key_staging if app_environment == 'staging' else interazap_secret_key_production }}"
      effective_uazapi_webhook_url: "{{ uazapi_webhook_url | default(('https://stage.gateway.interazap.com.br/webhook/uazapi' if app_environment == 'staging' else 'https://gateway.interazap.com.br/webhook/uazapi'), true) }}"

- name: 'Validar segredos críticos antes de gerar .env'
  assert:
      that:
          - effective_app_key | default('') | length > 0
          - effective_gateway_internal_api_key | default('') | length > 0
          - effective_gateway_jwt_secret | default('') | length > 0
          - effective_webchat_jwt_secret | default('') | length > 0
      fail_msg: 'Segredo crítico ausente no vault para {{ app_environment }} (APP_KEY, GATEWAY_INTERNAL_API_KEY, GATEWAY_JWT_SECRET ou WEBCHAT_JWT_SECRET).'

# =====================================================
# API DEPLOY (ATÔMICO)
# =====================================================

- name: 'Clonar API para a nova release'
  git:
      repo: '{{ interazap_git_url }}'
      dest: '{{ deploy_path }}/api/releases/{{ deploy_timestamp }}'
      version: "{{ 'develop' if app_environment == 'staging' else 'main' }}"
      force: yes
      accept_hostkey: yes
  become: yes
  become_user: deploy

- name: 'Ajustar ownership da release API para www-data'
  file:
      path: '{{ deploy_path }}/api/releases/{{ deploy_timestamp }}'
      owner: www-data
      group: www-data
      recurse: yes
      state: directory

- name: 'Remover diretórios conflitantes antes do symlink'
  file:
      path: '{{ deploy_path }}/api/releases/{{ deploy_timestamp }}/api/{{ item }}'
      state: absent
  loop:
      - storage
      - .env

- name: 'Criar estrutura de diretórios compartilhados (storage)'
  file:
      path: '{{ deploy_path }}/api/shared/{{ item }}'
      owner: www-data
      group: www-data
      mode: '0755'
      state: directory
  loop:
      - storage/logs
      - storage/framework/sessions
      - storage/framework/views
      - storage/framework/cache/data
      - storage/app/public

- name: 'Criar/atualizar .env compartilhado (API)'
  template:
      src: "api{{ '-staging' if app_environment == 'staging' else '' }}.env.j2"
      dest: '{{ deploy_path }}/api/shared/.env'
      owner: www-data
      group: www-data
      mode: '0640'

- name: 'Validar .env API crítico'
  shell: |
      grep -qE '^APP_KEY=.+$' {{ deploy_path }}/api/shared/.env
      grep -qE '^GATEWAY_INTERNAL_API_KEY=.+$' {{ deploy_path }}/api/shared/.env
      grep -qE '^WEBCHAT_JWT_SECRET=.+$' {{ deploy_path }}/api/shared/.env

- name: 'Linkar pastas compartilhadas (Storage/Logs)'
  file:
      src: '{{ deploy_path }}/api/shared/{{ item }}'
      dest: '{{ deploy_path }}/api/releases/{{ deploy_timestamp }}/api/{{ item }}'
      state: link
      force: yes
  loop:
      - storage
      - .env

- name: 'Instalar dependências Composer'
  shell: |
      /usr/bin/php8.4 /usr/local/bin/composer install --no-dev --optimize-autoloader --no-scripts
  args:
      chdir: '{{ deploy_path }}/api/releases/{{ deploy_timestamp }}/api'
  become: yes
  become_user: www-data

- name: 'Executar post-install scripts (package:discover)'
  command: '/usr/bin/php8.4 artisan package:discover --ansi'
  args:
      chdir: '{{ deploy_path }}/api/releases/{{ deploy_timestamp }}/api'
  become: yes
  become_user: www-data

- name: 'Otimizar configurações Laravel'
  shell: |
      /usr/bin/php8.4 artisan config:cache
      /usr/bin/php8.4 artisan route:cache
      /usr/bin/php8.4 artisan view:cache
  args:
      chdir: '{{ deploy_path }}/api/releases/{{ deploy_timestamp }}/api'
  become: yes
  become_user: www-data

- name: 'Executar migrations e seeds'
  command: '/usr/bin/php8.4 artisan migrate --force --seed'
  args:
      chdir: '{{ deploy_path }}/api/releases/{{ deploy_timestamp }}/api'
  become: yes
  become_user: www-data

- name: 'Executar seeders de configuração críticos'
  shell: |
      /usr/bin/php8.4 artisan db:seed --class=AiPromptSegmentSeeder --force
      /usr/bin/php8.4 artisan db:seed --class=AiCatalogSeeder --force
  args:
      chdir: '{{ deploy_path }}/api/releases/{{ deploy_timestamp }}/api'
  become: yes
  become_user: www-data

- name: "Mudar link simbólico 'current'"
  file:
      src: '{{ deploy_path }}/api/releases/{{ deploy_timestamp }}'
      dest: '{{ deploy_path }}/api/current'
      state: link
      force: yes
  notify: 'Reiniciar PHP-FPM'

- meta: flush_handlers

- name: 'Reiniciar Octane via Supervisor'
  shell: |
      /usr/bin/supervisorctl reread
      /usr/bin/supervisorctl update
      if /usr/bin/supervisorctl status {{ octane_supervisor_program }} | grep -qE 'RUNNING|STOPPED|FATAL|EXITED'; then
        /usr/bin/supervisorctl restart {{ octane_supervisor_program }}
      else
        /usr/bin/supervisorctl start {{ octane_supervisor_program }}
      fi
  become: yes

# =====================================================
# HEALTH CHECK E ROLLBACK
# =====================================================

- name: 'Aguardar Octane inicializar'
  wait_for:
      host: 127.0.0.1
      port: '{{ octane_port | default(9501) }}'
      delay: 5
      timeout: 60
  ignore_errors: yes

- name: 'Verificar liveness da API (/up)'
  uri:
      url: 'http://127.0.0.1:{{ octane_port | default(9501) }}/up'
      status_code: 200
      timeout: 10
  retries: 5
  delay: 5
  register: api_liveness_check
  ignore_errors: yes

- name: 'Verificar readiness da API (/api/health)'
  uri:
      url: 'http://127.0.0.1:{{ octane_port | default(9501) }}/api/health'
      status_code: [200, 503]
      timeout: 10
  retries: 5
  delay: 5
  register: api_health_check
  ignore_errors: yes

- name: 'Rollback API se health check falhar'
  shell: |
      PREV=$(ls -1dt {{ deploy_path }}/api/releases/* 2>/dev/null | sed -n 2p)
      if [ -n "$PREV" ]; then
        ln -sfn "$PREV" {{ deploy_path }}/api/current
        echo "Rollback executado para: $PREV"
      else
        echo "Nenhuma release anterior encontrada para rollback"
      fi
  when: (api_liveness_check.failed | default(false)) or (api_health_check.failed | default(false))
  notify: 'Reiniciar PHP-FPM'

- name: 'Reiniciar Octane após rollback'
  shell: |
      /usr/bin/supervisorctl reread
      /usr/bin/supervisorctl update
      if /usr/bin/supervisorctl status {{ octane_supervisor_program }} | grep -qE 'RUNNING|STOPPED|FATAL|EXITED'; then
        /usr/bin/supervisorctl restart {{ octane_supervisor_program }}
      else
        /usr/bin/supervisorctl start {{ octane_supervisor_program }}
      fi
  become: yes
  when: (api_liveness_check.failed | default(false)) or (api_health_check.failed | default(false))

- meta: flush_handlers
  when: (api_liveness_check.failed | default(false)) or (api_health_check.failed | default(false))

- name: 'Falhar o deploy se health check não passou'
  fail:
      msg: 'Health check falhou após deploy. Rollback executado para release anterior.'
  when: (api_liveness_check.failed | default(false)) or (api_health_check.failed | default(false))

# =====================================================
# APP ANGULAR DEPLOY (ATÔMICO)
# =====================================================

- name: 'Criar pasta da release atual (App)'
  file:
      path: '{{ deploy_path }}/app/releases/{{ deploy_timestamp }}'
      owner: deploy
      group: deploy
      mode: '0755'
      state: directory

- name: 'Clonar App para a nova release'
  git:
      repo: '{{ interazap_git_url }}'
      dest: '{{ deploy_path }}/app/releases/{{ deploy_timestamp }}'
      version: "{{ 'develop' if app_environment == 'staging' else 'main' }}"
      force: yes
      accept_hostkey: yes
  become: yes
  become_user: deploy

- name: 'Instalar dependências do App Angular'
  shell: |
      pnpm install --frozen-lockfile --filter app-new
  args:
      chdir: '{{ deploy_path }}/app/releases/{{ deploy_timestamp }}'
  environment:
      PATH: '/home/deploy/.nvm/versions/node/v22/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
  become: yes
  become_user: deploy

- name: 'Build App Angular ({{ app_environment }})'
  shell: |
      pnpm --filter app-new exec ng build --configuration {{ app_environment }}
  args:
      chdir: '{{ deploy_path }}/app/releases/{{ deploy_timestamp }}'
  environment:
      PATH: '/home/deploy/.nvm/versions/node/v22/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
      NODE_OPTIONS: '--max-old-space-size=4096'
  become: yes
  become_user: deploy

- name: 'Verificar build do App Angular'
  stat:
      path: '{{ deploy_path }}/app/releases/{{ deploy_timestamp }}/app/dist/app-new/browser/index.html'
  register: app_build_check

- name: 'Falhar se build do App não gerou index.html'
  fail:
      msg: 'Build do App Angular falhou — index.html não encontrado em app/dist/app-new/browser/'
  when: not app_build_check.stat.exists

- name: 'Ajustar ownership do build (App → www-data)'
  file:
      path: '{{ deploy_path }}/app/releases/{{ deploy_timestamp }}/app/dist'
      owner: www-data
      group: www-data
      recurse: yes
      state: directory

- name: "Mudar link simbólico 'current' App"
  file:
      src: '{{ deploy_path }}/app/releases/{{ deploy_timestamp }}'
      dest: '{{ deploy_path }}/app/current'
      state: link
      force: yes

# =====================================================
# GATEWAY DEPLOY (ATÔMICO)
# =====================================================

- name: 'Criar pasta da release atual (Gateway)'
  file:
      path: '{{ deploy_path }}/gateway/releases/{{ deploy_timestamp }}'
      owner: deploy
      group: deploy
      mode: '0755'
      state: directory

- name: 'Clonar Gateway para a nova release'
  git:
      repo: '{{ interazap_git_url }}'
      dest: '{{ deploy_path }}/gateway/releases/{{ deploy_timestamp }}'
      version: "{{ 'develop' if app_environment == 'staging' else 'main' }}"
      force: yes
      accept_hostkey: yes
  become: yes
  become_user: deploy

- name: 'Configurar node-linker hoisted para compatibilidade com PM2'
  copy:
      dest: '{{ deploy_path }}/gateway/releases/{{ deploy_timestamp }}/.npmrc'
      content: |
          node-linker=hoisted
      owner: deploy
      group: deploy
      mode: '0644'

- name: 'Instalar pnpm e dependências'
  shell: |
      npm install -g pnpm@10.24.0
      pnpm install --frozen-lockfile --filter gateway
  args:
      chdir: '{{ deploy_path }}/gateway/releases/{{ deploy_timestamp }}'
  environment:
      PATH: '/home/deploy/.nvm/versions/node/v22/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
  become: yes
  become_user: deploy

- name: 'Build Gateway'
  shell: pnpm --filter gateway run build
  args:
      chdir: '{{ deploy_path }}/gateway/releases/{{ deploy_timestamp }}'
  environment:
      PATH: '/home/deploy/.nvm/versions/node/v22/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
  become: yes
  become_user: deploy

- name: 'Criar/atualizar .env compartilhado (Gateway)'
  template:
      src: "gateway{{ '-staging' if app_environment == 'staging' else '' }}.env.j2"
      dest: '{{ deploy_path }}/gateway/shared/.env'
      owner: deploy
      group: deploy
      mode: '0640'

- name: 'Validar .env Gateway crítico'
  shell: |
      grep -qE '^JWT_SECRET=.+$' {{ deploy_path }}/gateway/shared/.env
      grep -qE '^WEBCHAT_JWT_SECRET=.+$' {{ deploy_path }}/gateway/shared/.env
      grep -qE '^INTERNAL_API_KEY=.+$' {{ deploy_path }}/gateway/shared/.env
      grep -qE '^UAZAPI_WEBHOOK_URL=.+$' {{ deploy_path }}/gateway/shared/.env

- name: 'Validar .env Gateway crítico'
  shell: |
      grep -qE '^JWT_SECRET=.+$' {{ deploy_path }}/gateway/shared/.env
      grep -qE '^WEBCHAT_JWT_SECRET=.+$' {{ deploy_path }}/gateway/shared/.env
      grep -qE '^INTERNAL_API_KEY=.+$' {{ deploy_path }}/gateway/shared/.env

- name: 'Linkar .env Gateway'
  file:
      src: '{{ deploy_path }}/gateway/shared/.env'
      dest: '{{ deploy_path }}/gateway/releases/{{ deploy_timestamp }}/.env'
      state: link
      force: yes

- name: "Mudar link simbólico 'current' Gateway"
  file:
      src: '{{ deploy_path }}/gateway/releases/{{ deploy_timestamp }}'
      dest: '{{ deploy_path }}/gateway/current'
      state: link
      force: yes

- name: 'Definir processo PM2 e porta do Gateway'
  set_fact:
      gateway_pm2_process: "{{ 'interazap-gateway-stage' if app_environment == 'staging' else 'interazap-gateway-prod' }}"
      gateway_port: "{{ 6001 if app_environment == 'staging' else 6002 }}"

- name: 'Aplicar processo Gateway via PM2 (startOrRestart)'
  command: >
      /home/deploy/.nvm/versions/node/v22/bin/pm2 startOrRestart
      /home/deploy/ecosystem.config.js
      --only {{ gateway_pm2_process }}
      --update-env
  become: yes
  become_user: deploy
  environment:
      PATH: '/home/deploy/.nvm/versions/node/v22/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'

- name: 'Salvar estado do PM2 Gateway'
  command: '/home/deploy/.nvm/versions/node/v22/bin/pm2 save'
  become: yes
  become_user: deploy
  environment:
      PATH: '/home/deploy/.nvm/versions/node/v22/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'

- name: 'Capturar logs iniciais do Gateway (5s após start)'
  shell: |
      sleep 5
      /home/deploy/.nvm/versions/node/v22/bin/pm2 logs {{ gateway_pm2_process }} --nostream --lines 30 2>&1 || true
  become: yes
  become_user: deploy
  register: gateway_early_logs
  ignore_errors: yes

- name: 'Exibir logs iniciais do Gateway'
  debug:
      msg: '{{ gateway_early_logs.stdout_lines | default([]) }}'

- name: 'Aguardar Gateway inicializar'
  wait_for:
      host: 127.0.0.1
      port: '{{ gateway_port }}'
      delay: 3
      timeout: 60
  ignore_errors: yes

- name: 'Verificar health check do Gateway'
  uri:
      url: 'http://127.0.0.1:{{ gateway_port }}/health'
      status_code: 200
      timeout: 10
  retries: 5
  delay: 5
  register: gateway_health_check
  ignore_errors: yes

- name: 'Capturar logs de erro do PM2 se health check falhar'
  shell: |
      echo "=== PM2 STATUS ==="
      /home/deploy/.nvm/versions/node/v22/bin/pm2 show {{ gateway_pm2_process }} 2>&1 || true
      echo "=== PM2 ERROR LOG (últimas 80 linhas) ==="
      tail -n 80 /home/deploy/.pm2/logs/{{ gateway_pm2_process }}-error.log 2>/dev/null || echo "(sem log de erro)"
      echo "=== PM2 OUT LOG (últimas 40 linhas) ==="
      tail -n 40 /home/deploy/.pm2/logs/{{ gateway_pm2_process }}-out.log 2>/dev/null || echo "(sem log de saída)"
      echo "=== .env Gateway ==="
      cat {{ deploy_path }}/gateway/shared/.env 2>/dev/null || echo "(sem .env)"
  become: yes
  become_user: deploy
  register: gateway_pm2_error_logs
  when: gateway_health_check.failed | default(false)
  ignore_errors: yes

- name: 'Exibir logs de diagnóstico do Gateway'
  debug:
      msg: '{{ gateway_pm2_error_logs.stdout_lines | default([]) }}'
  when: gateway_health_check.failed | default(false)

- name: 'Rollback Gateway se health check falhar'
  shell: |
      PREV=$(ls -1dt {{ deploy_path }}/gateway/releases/* 2>/dev/null | sed -n 2p)
      if [ -n "$PREV" ]; then
        ln -sfn "$PREV" {{ deploy_path }}/gateway/current
        echo "Rollback Gateway executado para: $PREV"
      else
        echo "Nenhuma release Gateway anterior encontrada para rollback"
      fi
  when: gateway_health_check.failed | default(false)

- name: 'Reiniciar Gateway após rollback'
  command: '/home/deploy/.nvm/versions/node/v22/bin/pm2 restart {{ gateway_pm2_process }} --update-env'
  become: yes
  become_user: deploy
  when: gateway_health_check.failed | default(false)

- name: 'Falhar o deploy se health check do Gateway não passou'
  fail:
      msg: 'Health check do Gateway falhou após deploy. Rollback executado para release anterior.'
  when: gateway_health_check.failed | default(false)

# =====================================================
# LIMPEZA DE RELEASES ANTIGAS
# =====================================================

- name: 'Manter apenas as últimas 5 releases'
  shell: |
      ls -1dt {{ deploy_path }}/api/releases/* | tail -n +6 | xargs rm -rf
      ls -1dt {{ deploy_path }}/app/releases/* | tail -n +6 | xargs rm -rf
      ls -1dt {{ deploy_path }}/gateway/releases/* | tail -n +6 | xargs rm -rf
  ignore_errors: yes
