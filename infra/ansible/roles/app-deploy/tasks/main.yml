# =====================================================
# Role: App Deploy
# Propósito: Deploy Atômico (Symlinks) - API, App, Gateway
# Autor: DevOps Agentflix
# =====================================================

- name: 'Criar /tmp/ansible para Ansible module executor'
  file:
      path: /tmp/ansible
      state: directory
      mode: '0777'

- name: 'Definir timestamp do deploy'
  set_fact:
      deploy_timestamp: "{{ lookup('pipe', 'date +%Y%m%d%H%M%S') }}"

- name: 'Instalar git e rsync'
  apt:
      name:
          - git
          - rsync
      state: present

- name: 'Garantir symlink /data/prod -> /data/production'
  file:
      src: /data/production
      dest: /data/prod
      state: link
      force: yes

# =====================================================
# ESTRUTURA DE DIRETÓRIOS
# =====================================================

- name: 'Criar estrutura de pastas (Production)'
  file:
      path: '{{ item }}'
      owner: www-data
      group: www-data
      mode: '0755'
      state: directory
  loop:
      - '{{ deploy_path }}/api/releases'
      - '{{ deploy_path }}/api/shared'
      - '{{ deploy_path }}/app/releases'
      - '{{ deploy_path }}/gateway/releases'
      - '{{ deploy_path }}/gateway/shared'

- name: 'Criar pasta da release atual (API)'
  file:
      path: '{{ deploy_path }}/api/releases/{{ deploy_timestamp }}'
      owner: deploy
      group: deploy
      mode: '0755'
      state: directory

- name: 'Resolver segredos efetivos por ambiente'
  set_fact:
      effective_gateway_internal_api_key: "{{ gateway_internal_api_key_production if app_environment == 'production' else gateway_internal_api_key_staging }}"
      effective_gateway_jwt_secret: "{{ gateway_jwt_secret_production if app_environment == 'production' else gateway_jwt_secret_staging }}"
      effective_webchat_jwt_secret: "{{ (webchat_jwt_secret_production if app_environment == 'production' else webchat_jwt_secret_staging) | default((gateway_jwt_secret_production if app_environment == 'production' else gateway_jwt_secret_staging), true) }}"
      effective_app_key: "{{ agentflix_secret_key_staging if app_environment == 'staging' else agentflix_secret_key_production }}"
      effective_uazapi_webhook_url: "{{ uazapi_webhook_url | default(('https://stage.gateway.interazap.com.br/webhook/uazapi' if app_environment == 'staging' else 'https://gateway.interazap.com.br/webhook/uazapi'), true) }}"

- name: 'Validar segredos críticos antes de gerar .env'
  assert:
      that:
          - effective_app_key | default('') | length > 0
          - effective_gateway_internal_api_key | default('') | length > 0
          - effective_gateway_jwt_secret | default('') | length > 0
          - effective_webchat_jwt_secret | default('') | length > 0
      fail_msg: 'Segredo crítico ausente no vault para {{ app_environment }} (APP_KEY, GATEWAY_INTERNAL_API_KEY, GATEWAY_JWT_SECRET ou WEBCHAT_JWT_SECRET).'

# =====================================================
# API DEPLOY (ATÔMICO)
# =====================================================

- name: 'Clonar API para a nova release'
  git:
      repo: '{{ agentflix_git_url }}'
      dest: '{{ deploy_path }}/api/releases/{{ deploy_timestamp }}'
      version: "{{ 'develop' if app_environment == 'staging' else 'main' }}"
      force: yes
      accept_hostkey: yes
  become: yes
  become_user: deploy

- name: 'Ajustar ownership da release API para www-data'
  file:
      path: '{{ deploy_path }}/api/releases/{{ deploy_timestamp }}'
      owner: www-data
      group: www-data
      recurse: yes
      state: directory

- name: 'Remover diretórios conflitantes antes do symlink'
  file:
      path: '{{ deploy_path }}/api/releases/{{ deploy_timestamp }}/api/{{ item }}'
      state: absent
  loop:
      - storage
      - .env

- name: 'Criar estrutura de diretórios compartilhados (storage)'
  file:
      path: '{{ deploy_path }}/api/shared/{{ item }}'
      owner: www-data
      group: www-data
      mode: '0755'
      state: directory
  loop:
      - storage/logs
      - storage/framework/sessions
      - storage/framework/views
      - storage/framework/cache/data
      - storage/app/public

- name: 'Criar/atualizar .env compartilhado'
  shell: |
      cat > {{ deploy_path }}/api/shared/.env << ENVEOF
      APP_NAME=InteraZap
      APP_ENV={{ app_environment }}
      APP_KEY=${VAULT_APP_KEY}
      APP_DEBUG=false
      APP_URL=https://{{ domain_api }}
      APP_LOCALE=pt_BR
      APP_FALLBACK_LOCALE=pt_BR
      APP_FAKER_LOCALE=en_US
      APP_MAINTENANCE_DRIVER=file
      BCRYPT_ROUNDS=12
      FILESYSTEM_DISK=local

      DB_CONNECTION=pgsql
      DB_HOST=127.0.0.1
      DB_PORT=5432
      DB_DATABASE={{ 'agentflix_stage' if app_environment == 'staging' else 'interazap' }}
      DB_USERNAME=agentflix_app
      DB_PASSWORD=${VAULT_DB_PASSWORD}

      REDIS_CLIENT=predis
      REDIS_HOST=127.0.0.1
      REDIS_PASSWORD=${VAULT_REDIS_PASSWORD}
      REDIS_PORT=6379
      REDIS_DB={{ '1' if app_environment == 'staging' else '0' }}
      REDIS_PREFIX={{ 'agentflix_stage_' if app_environment == 'staging' else 'agentflix_prod_' }}
      REDIS_QUEUE=default
      REDIS_QUEUE_RETRY_AFTER=90
      REDIS_BACKOFF_ALGORITHM=decorrelated_jitter
      REDIS_BACKOFF_BASE=100
      REDIS_BACKOFF_CAP=1000

      CACHE_STORE=redis
      QUEUE_CONNECTION=redis
      SESSION_DRIVER=redis
      SESSION_LIFETIME=120
      SESSION_ENCRYPT=true
      SESSION_PATH=/
      SESSION_DOMAIN=null

      BROADCAST_DRIVER=reverb
      BROADCAST_CONNECTION=reverb
      REVERB_APP_ID=${VAULT_REVERB_APP_ID}
      REVERB_APP_KEY=${VAULT_REVERB_APP_KEY}
      REVERB_APP_SECRET=${VAULT_REVERB_APP_SECRET}
      REVERB_HOST=127.0.0.1
      REVERB_PORT=8080
      REVERB_SCHEME=http
      REVERB_APP_MAX_MESSAGE_SIZE=20000

      LOG_CHANNEL=stack
      LOG_STACK=single
      LOG_LEVEL={{ 'debug' if app_environment == 'staging' else 'info' }}

      CORS_ALLOWED_ORIGINS=https://{{ domain_app }}

      GATEWAY_URL=http://127.0.0.1:{{ 6001 if app_environment == 'staging' else 6002 }}
      GATEWAY_INTERNAL_API_KEY=${VAULT_INTERNAL_API_KEY}
      GATEWAY_E2E=0
      GATEWAY_TIMEOUT=3
      GATEWAY_RETRY_ATTEMPTS=3
      GATEWAY_RETRY_DELAY_MS=150
      REALTIME_PUBSUB_ENABLED=true
      REALTIME_HTTP_FALLBACK_ENABLED=true

      CHAT_AUTO_CLOSE_MINUTES=20
      CHAT_EVALUATION_PUBLIC_URL=https://{{ domain_app }}

      AI_AUTOPILOT_MAX_TOKENS=800
      AI_MAX_TOOL_ITERATIONS=10
      AI_AUTOPILOT_QUEUE_CONNECTION=redis
      AI_AUTOPILOT_QUEUE_NAME=ai
      AI_EMBEDDING_DIMENSIONS=512
      AI_EMBEDDING_BATCH_SIZE=100
      AI_CHUNKING_CHARS_PER_TOKEN=3.5

      ASAAS_API_KEY=${VAULT_ASAAS_API_KEY}
      DEFAULT_TENANT_ID=${VAULT_DEFAULT_TENANT_ID}
      SANCTUM_EXPIRATION=1440
      WEBCHAT_JWT_SECRET=${VAULT_WEBCHAT_JWT_SECRET}

      HORIZON_NAME={{ 'interazap-staging' if app_environment == 'staging' else 'interazap-prod' }}
      HORIZON_MAX_PROCESSES=10
      HORIZON_MIN_PROCESSES=1
      HORIZON_NOTIFICATION_EMAIL=${VAULT_HORIZON_NOTIFICATION_EMAIL}
      HORIZON_ADMIN_EMAIL=${VAULT_HORIZON_NOTIFICATION_EMAIL}
      HORIZON_SLACK_WEBHOOK=
      HORIZON_SLACK_CHANNEL=#alerts

      SENTRY_LARAVEL_DSN=${VAULT_SENTRY_DSN}
      SENTRY_TRACES_SAMPLE_RATE=0.1

      QUEUE_CRITICAL_TIMEOUT=30
      QUEUE_CRITICAL_TRIES=5
      QUEUE_HIGH_TIMEOUT=60
      QUEUE_HIGH_TRIES=3
      QUEUE_DEFAULT_TIMEOUT=120
      QUEUE_DEFAULT_TRIES=3
      QUEUE_LOW_TIMEOUT=300
      QUEUE_LOW_TRIES=2
      QUEUE_AI_TIMEOUT=180
      QUEUE_AI_TRIES=3
      QUEUE_MEDIA_TIMEOUT=300
      QUEUE_MEDIA_TRIES=3
      QUEUE_HEALTH_MAX_SIZE=1000
      QUEUE_HEALTH_MAX_STUCK=10
      QUEUE_HEALTH_STUCK_THRESHOLD=600

      WHATSAPP_USE_REAL_PROVIDER=true
      WHATSAPP_CB_FAILURE_THRESHOLD=5
      WHATSAPP_CB_SUCCESS_THRESHOLD=2
      WHATSAPP_CB_OPEN_TIMEOUT=60
      HTTP_RETRY_DELAY_MS=1000

      MAIL_MAILER=smtp
      MAIL_HOST=${VAULT_MAIL_HOST}
      MAIL_PORT=${VAULT_MAIL_PORT}
      MAIL_USERNAME=${VAULT_MAIL_USERNAME}
      MAIL_PASSWORD=${VAULT_MAIL_PASSWORD}
      MAIL_SCHEME=null
      MAIL_FROM_ADDRESS=${VAULT_MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME=InteraZap
      ENVEOF
      chown www-data:www-data {{ deploy_path }}/api/shared/.env
      chmod 640 {{ deploy_path }}/api/shared/.env
  environment:
      VAULT_APP_KEY: "{{ effective_app_key }}"
      VAULT_DB_PASSWORD: "{{ postgres_app_password | default('') }}"
      VAULT_REDIS_PASSWORD: "{{ redis_password | default('') }}"
      VAULT_INTERNAL_API_KEY: "{{ effective_gateway_internal_api_key }}"
      VAULT_REVERB_APP_ID: "{{ reverb_app_id_staging | default('interazap-stage') if app_environment == 'staging' else reverb_app_id_production | default('interazap-prod') }}"
      VAULT_REVERB_APP_KEY: "{{ reverb_app_key_staging | default('interazap-stage-key') if app_environment == 'staging' else reverb_app_key_production | default('interazap-prod-key') }}"
      VAULT_REVERB_APP_SECRET: "{{ reverb_app_secret_staging | default('interazap-stage-secret') if app_environment == 'staging' else reverb_app_secret_production | default('interazap-prod-secret') }}"
      VAULT_WEBCHAT_JWT_SECRET: "{{ effective_webchat_jwt_secret }}"
      VAULT_ASAAS_API_KEY: "{{ asaas_api_key | default('') }}"
      VAULT_DEFAULT_TENANT_ID: "{{ default_tenant_id | default('') }}"
      VAULT_SENTRY_DSN: "{{ sentry_dsn | default('') }}"
      VAULT_HORIZON_NOTIFICATION_EMAIL: "{{ horizon_notification_email | default('') }}"
      VAULT_MAIL_HOST: "{{ mail_host | default('sandbox.smtp.mailtrap.io') }}"
      VAULT_MAIL_PORT: "{{ mail_port | default('2525') }}"
      VAULT_MAIL_USERNAME: "{{ mail_username | default('') }}"
      VAULT_MAIL_PASSWORD: "{{ mail_password | default('') }}"
      VAULT_MAIL_FROM_ADDRESS: "{{ mail_from_address | default('noreply@interazap.com.br') }}"

- name: 'Validar .env API crítico'
  shell: |
      grep -qE '^APP_KEY=.+$' {{ deploy_path }}/api/shared/.env
      grep -qE '^GATEWAY_INTERNAL_API_KEY=.+$' {{ deploy_path }}/api/shared/.env
      grep -qE '^WEBCHAT_JWT_SECRET=.+$' {{ deploy_path }}/api/shared/.env

- name: 'Linkar pastas compartilhadas (Storage/Logs)'
  file:
      src: '{{ deploy_path }}/api/shared/{{ item }}'
      dest: '{{ deploy_path }}/api/releases/{{ deploy_timestamp }}/api/{{ item }}'
      state: link
      force: yes
  loop:
      - storage
      - .env

- name: 'Instalar dependências Composer'
  shell: |
      /usr/bin/php8.4 /usr/local/bin/composer install --no-dev --optimize-autoloader --no-scripts
  args:
      chdir: '{{ deploy_path }}/api/releases/{{ deploy_timestamp }}/api'
  become: yes
  become_user: www-data

- name: 'Executar post-install scripts (package:discover)'
  command: '/usr/bin/php8.4 artisan package:discover --ansi'
  args:
      chdir: '{{ deploy_path }}/api/releases/{{ deploy_timestamp }}/api'
  become: yes
  become_user: www-data

- name: 'Otimizar configurações Laravel'
  shell: |
      /usr/bin/php8.4 artisan config:cache
      /usr/bin/php8.4 artisan route:cache
      /usr/bin/php8.4 artisan view:cache
  args:
      chdir: '{{ deploy_path }}/api/releases/{{ deploy_timestamp }}/api'
  become: yes
  become_user: www-data

- name: 'Executar migrations e seeds'
  command: '/usr/bin/php8.4 artisan migrate --force --seed'
  args:
      chdir: '{{ deploy_path }}/api/releases/{{ deploy_timestamp }}/api'
  become: yes
  become_user: www-data

- name: 'Executar seeders de configuração críticos'
  shell: |
      /usr/bin/php8.4 artisan db:seed --class=AiPromptSegmentSeeder --force
      /usr/bin/php8.4 artisan db:seed --class=AiCatalogSeeder --force
  args:
      chdir: '{{ deploy_path }}/api/releases/{{ deploy_timestamp }}/api'
  become: yes
  become_user: www-data

- name: "Mudar link simbólico 'current'"
  file:
      src: '{{ deploy_path }}/api/releases/{{ deploy_timestamp }}'
      dest: '{{ deploy_path }}/api/current'
      state: link
      force: yes
  notify: 'Reiniciar PHP-FPM'

- meta: flush_handlers

- name: 'Reiniciar Octane via Supervisor'
  shell: |
      /usr/bin/supervisorctl reread
      /usr/bin/supervisorctl update
      if /usr/bin/supervisorctl status {{ octane_supervisor_program }} | grep -qE 'RUNNING|STOPPED|FATAL|EXITED'; then
        /usr/bin/supervisorctl restart {{ octane_supervisor_program }}
      else
        /usr/bin/supervisorctl start {{ octane_supervisor_program }}
      fi
  become: yes

# =====================================================
# HEALTH CHECK E ROLLBACK
# =====================================================

- name: 'Aguardar Octane inicializar'
  wait_for:
      host: 127.0.0.1
      port: '{{ octane_port | default(9501) }}'
      delay: 5
      timeout: 60
  ignore_errors: yes

- name: 'Verificar liveness da API (/up)'
  uri:
      url: 'http://127.0.0.1:{{ octane_port | default(9501) }}/up'
      status_code: 200
      timeout: 10
  retries: 5
  delay: 5
  register: api_liveness_check
  ignore_errors: yes

- name: 'Verificar readiness da API (/api/health)'
  uri:
      url: 'http://127.0.0.1:{{ octane_port | default(9501) }}/api/health'
      status_code: [200, 503]
      timeout: 10
  retries: 5
  delay: 5
  register: api_health_check
  ignore_errors: yes

- name: 'Rollback API se health check falhar'
  shell: |
      PREV=$(ls -1dt {{ deploy_path }}/api/releases/* 2>/dev/null | sed -n 2p)
      if [ -n "$PREV" ]; then
        ln -sfn "$PREV" {{ deploy_path }}/api/current
        echo "Rollback executado para: $PREV"
      else
        echo "Nenhuma release anterior encontrada para rollback"
      fi
  when: (api_liveness_check.failed | default(false)) or (api_health_check.failed | default(false))
  notify: 'Reiniciar PHP-FPM'

- name: 'Reiniciar Octane após rollback'
  shell: |
      /usr/bin/supervisorctl reread
      /usr/bin/supervisorctl update
      if /usr/bin/supervisorctl status {{ octane_supervisor_program }} | grep -qE 'RUNNING|STOPPED|FATAL|EXITED'; then
        /usr/bin/supervisorctl restart {{ octane_supervisor_program }}
      else
        /usr/bin/supervisorctl start {{ octane_supervisor_program }}
      fi
  become: yes
  when: (api_liveness_check.failed | default(false)) or (api_health_check.failed | default(false))

- meta: flush_handlers
  when: (api_liveness_check.failed | default(false)) or (api_health_check.failed | default(false))

- name: 'Falhar o deploy se health check não passou'
  fail:
      msg: 'Health check falhou após deploy. Rollback executado para release anterior.'
  when: (api_liveness_check.failed | default(false)) or (api_health_check.failed | default(false))

# =====================================================
# APP ANGULAR DEPLOY (ATÔMICO)
# =====================================================

- name: 'Criar pasta da release atual (App)'
  file:
      path: '{{ deploy_path }}/app/releases/{{ deploy_timestamp }}'
      owner: deploy
      group: deploy
      mode: '0755'
      state: directory

- name: 'Clonar App para a nova release'
  git:
      repo: '{{ agentflix_git_url }}'
      dest: '{{ deploy_path }}/app/releases/{{ deploy_timestamp }}'
      version: "{{ 'develop' if app_environment == 'staging' else 'main' }}"
      force: yes
      accept_hostkey: yes
  become: yes
  become_user: deploy

- name: 'Instalar dependências do App Angular'
  shell: |
      pnpm install --frozen-lockfile --filter app-new
  args:
      chdir: '{{ deploy_path }}/app/releases/{{ deploy_timestamp }}'
  environment:
      PATH: '/home/deploy/.nvm/versions/node/v22/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
  become: yes
  become_user: deploy

- name: 'Build App Angular ({{ app_environment }})'
  shell: |
      pnpm --filter app-new exec ng build --configuration {{ app_environment }}
  args:
      chdir: '{{ deploy_path }}/app/releases/{{ deploy_timestamp }}'
  environment:
      PATH: '/home/deploy/.nvm/versions/node/v22/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
      NODE_OPTIONS: '--max-old-space-size=4096'
  become: yes
  become_user: deploy

- name: 'Verificar build do App Angular'
  stat:
      path: '{{ deploy_path }}/app/releases/{{ deploy_timestamp }}/app/dist/app-new/browser/index.html'
  register: app_build_check

- name: 'Falhar se build do App não gerou index.html'
  fail:
      msg: 'Build do App Angular falhou — index.html não encontrado em app/dist/app-new/browser/'
  when: not app_build_check.stat.exists

- name: 'Ajustar ownership do build (App → www-data)'
  file:
      path: '{{ deploy_path }}/app/releases/{{ deploy_timestamp }}/app/dist'
      owner: www-data
      group: www-data
      recurse: yes
      state: directory

- name: "Mudar link simbólico 'current' App"
  file:
      src: '{{ deploy_path }}/app/releases/{{ deploy_timestamp }}'
      dest: '{{ deploy_path }}/app/current'
      state: link
      force: yes

# =====================================================
# GATEWAY DEPLOY (ATÔMICO)
# =====================================================

- name: 'Criar pasta da release atual (Gateway)'
  file:
      path: '{{ deploy_path }}/gateway/releases/{{ deploy_timestamp }}'
      owner: deploy
      group: deploy
      mode: '0755'
      state: directory

- name: 'Clonar Gateway para a nova release'
  git:
      repo: '{{ agentflix_git_url }}'
      dest: '{{ deploy_path }}/gateway/releases/{{ deploy_timestamp }}'
      version: "{{ 'develop' if app_environment == 'staging' else 'main' }}"
      force: yes
      accept_hostkey: yes
  become: yes
  become_user: deploy

- name: 'Configurar node-linker hoisted para compatibilidade com PM2'
  copy:
      dest: '{{ deploy_path }}/gateway/releases/{{ deploy_timestamp }}/.npmrc'
      content: |
          node-linker=hoisted
      owner: deploy
      group: deploy
      mode: '0644'

- name: 'Instalar pnpm e dependências'
  shell: |
      npm install -g pnpm
      pnpm install --frozen-lockfile --filter gateway
  args:
      chdir: '{{ deploy_path }}/gateway/releases/{{ deploy_timestamp }}'
  environment:
      PATH: '/home/deploy/.nvm/versions/node/v22/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
  become: yes
  become_user: deploy

- name: 'Build Gateway'
  shell: pnpm --filter gateway run build
  args:
      chdir: '{{ deploy_path }}/gateway/releases/{{ deploy_timestamp }}'
  environment:
      PATH: '/home/deploy/.nvm/versions/node/v22/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
  become: yes
  become_user: deploy

- name: 'Criar/atualizar .env compartilhado do Gateway'
  shell: |
      REDIS_AUTH_SEGMENT=""
      REDIS_ENC_PASSWORD=$(echo "${VAULT_REDIS_PASSWORD}" | python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.stdin.read().strip(), safe=":"))')
      if [ -n "${VAULT_REDIS_PASSWORD}" ]; then REDIS_AUTH_SEGMENT=":${REDIS_ENC_PASSWORD}@"; fi
      cat > {{ deploy_path }}/gateway/shared/.env << ENVEOF
      NODE_ENV={{ app_environment }}
      PORT={{ 6001 if app_environment == 'staging' else 6002 }}
      DATABASE_URL=postgres://agentflix_app:${VAULT_DB_PASSWORD}@127.0.0.1:5432/{{ 'agentflix_stage' if app_environment == 'staging' else 'interazap' }}
      REDIS_URL=redis://${REDIS_AUTH_SEGMENT}127.0.0.1:6379/{{ '1' if app_environment == 'staging' else '0' }}
      API_URL=http://127.0.0.1:{{ octane_port | default(9501) }}
      JWT_SECRET=${VAULT_JWT_SECRET}
      JWT_ALGORITHM=HS256
      WEBCHAT_JWT_SECRET=${VAULT_WEBCHAT_JWT_SECRET}
      INTERNAL_API_KEY=${VAULT_INTERNAL_API_KEY}
      CORS_ORIGINS=https://{{ domain_app }}
      LOG_LEVEL={{ 'debug' if app_environment == 'staging' else 'info' }}
      LOG_STRUCTURED={{ 'false' if app_environment == 'staging' else 'true' }}
      OPENAI_API_KEY=${VAULT_OPENAI_API_KEY}
      OPENAI_DEFAULT_MODEL=gpt-4o
      OPENAI_TIMEOUT_MS=180000
      OPENAI_MAX_RETRIES=3
      OPENAI_EMBEDDING_MODEL=text-embedding-3-small
      GOOGLE_AI_API_KEY=${VAULT_GOOGLE_AI_API_KEY}
      GOOGLE_DEFAULT_MODEL=gemini-2.5-flash
      MINIMAX_API_KEY=${VAULT_MINIMAX_API_KEY}
      ASAAS_API_KEY=${VAULT_ASAAS_API_KEY}
      UAZAPI_BASE_URL=${VAULT_UAZAPI_BASE_URL}
      UAZAPI_ADMIN_TOKEN=${VAULT_UAZAPI_ADMIN_TOKEN}
      UAZAPI_WEBHOOK_URL=${VAULT_UAZAPI_WEBHOOK_URL}
      UAZAPI_WEBHOOK_EVENTS=connection,messages,messages_update
      UAZAPI_WEBHOOK_EXCLUDE_MESSAGES=wasSentByApi,isGroupYes
      UAZAPI_WEBHOOK_RETRIES=3
      DEFAULT_TENANT_ID=${VAULT_DEFAULT_TENANT_ID}
      AI_CONSUMER_GROUP=gateway-ai
      AI_CONSUMER_NAME=consumer-1
      BULLMQ_DEFAULT_ATTEMPTS=5
      BULLMQ_DEFAULT_BACKOFF_DELAY=1000
      BULLMQ_COMPLETED_JOB_AGE=3600
      BULLMQ_COMPLETED_JOB_COUNT=1000
      DLQ_MAX_RETRIES=3
      DLQ_REPROCESSING_DELAY=300000
      DLQ_ALERT_THRESHOLD=100
      AI_RATE_LIMIT_MAX=10
      AI_RATE_LIMIT_DURATION=60000
      WEBHOOK_RATE_LIMIT_MAX=50
      WEBHOOK_RATE_LIMIT_DURATION=60000
      NOTIFICATION_RATE_LIMIT_MAX=100
      NOTIFICATION_RATE_LIMIT_DURATION=60000
      ENVEOF
      chown deploy:deploy {{ deploy_path }}/gateway/shared/.env
      chmod 640 {{ deploy_path }}/gateway/shared/.env
  environment:
      VAULT_DB_PASSWORD: "{{ postgres_app_password | default('') }}"
      VAULT_REDIS_PASSWORD: "{{ redis_password | default('') }}"
      VAULT_JWT_SECRET: "{{ effective_gateway_jwt_secret }}"
      VAULT_WEBCHAT_JWT_SECRET: "{{ effective_webchat_jwt_secret }}"
      VAULT_INTERNAL_API_KEY: "{{ effective_gateway_internal_api_key }}"
      VAULT_OPENAI_API_KEY: "{{ openai_api_key | default('') }}"
      VAULT_GOOGLE_AI_API_KEY: "{{ google_ai_api_key | default('') }}"
      VAULT_MINIMAX_API_KEY: "{{ minimax_api_key | default('') }}"
      VAULT_ASAAS_API_KEY: "{{ asaas_api_key | default('') }}"
      VAULT_UAZAPI_BASE_URL: "{{ uazapi_base_url | default('') }}"
      VAULT_UAZAPI_ADMIN_TOKEN: "{{ uazapi_admin_token | default('') }}"
      VAULT_DEFAULT_TENANT_ID: "{{ default_tenant_id | default('') }}"
      VAULT_UAZAPI_WEBHOOK_URL: "{{ effective_uazapi_webhook_url }}"

- name: 'Validar .env Gateway crítico'
  shell: |
      grep -qE '^JWT_SECRET=.+$' {{ deploy_path }}/gateway/shared/.env
      grep -qE '^WEBCHAT_JWT_SECRET=.+$' {{ deploy_path }}/gateway/shared/.env
      grep -qE '^INTERNAL_API_KEY=.+$' {{ deploy_path }}/gateway/shared/.env
      grep -qE '^UAZAPI_WEBHOOK_URL=.+$' {{ deploy_path }}/gateway/shared/.env

- name: 'Validar .env Gateway crítico'
  shell: |
      grep -qE '^JWT_SECRET=.+$' {{ deploy_path }}/gateway/shared/.env
      grep -qE '^WEBCHAT_JWT_SECRET=.+$' {{ deploy_path }}/gateway/shared/.env
      grep -qE '^INTERNAL_API_KEY=.+$' {{ deploy_path }}/gateway/shared/.env

- name: 'Linkar .env Gateway'
  file:
      src: '{{ deploy_path }}/gateway/shared/.env'
      dest: '{{ deploy_path }}/gateway/releases/{{ deploy_timestamp }}/.env'
      state: link
      force: yes

- name: "Mudar link simbólico 'current' Gateway"
  file:
      src: '{{ deploy_path }}/gateway/releases/{{ deploy_timestamp }}'
      dest: '{{ deploy_path }}/gateway/current'
      state: link
      force: yes

- name: 'Definir processo PM2 e porta do Gateway'
  set_fact:
      gateway_pm2_process: "{{ 'interazap-gateway-stage' if app_environment == 'staging' else 'interazap-gateway-prod' }}"
      gateway_port: "{{ 6001 if app_environment == 'staging' else 6002 }}"

- name: 'Aplicar processo Gateway via PM2 (startOrRestart)'
  command: >
      /home/deploy/.nvm/versions/node/v22/bin/pm2 startOrRestart
      /home/deploy/ecosystem.config.js
      --only {{ gateway_pm2_process }}
      --update-env
  become: yes
  become_user: deploy
  environment:
      PATH: '/home/deploy/.nvm/versions/node/v22/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'

- name: 'Salvar estado do PM2 Gateway'
  command: '/home/deploy/.nvm/versions/node/v22/bin/pm2 save'
  become: yes
  become_user: deploy
  environment:
      PATH: '/home/deploy/.nvm/versions/node/v22/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'

- name: 'Capturar logs iniciais do Gateway (5s após start)'
  shell: |
      sleep 5
      /home/deploy/.nvm/versions/node/v22/bin/pm2 logs {{ gateway_pm2_process }} --nostream --lines 30 2>&1 || true
  become: yes
  become_user: deploy
  register: gateway_early_logs
  ignore_errors: yes

- name: 'Exibir logs iniciais do Gateway'
  debug:
      msg: '{{ gateway_early_logs.stdout_lines | default([]) }}'

- name: 'Aguardar Gateway inicializar'
  wait_for:
      host: 127.0.0.1
      port: '{{ gateway_port }}'
      delay: 3
      timeout: 60
  ignore_errors: yes

- name: 'Verificar health check do Gateway'
  uri:
      url: 'http://127.0.0.1:{{ gateway_port }}/health'
      status_code: 200
      timeout: 10
  retries: 5
  delay: 5
  register: gateway_health_check
  ignore_errors: yes

- name: 'Capturar logs de erro do PM2 se health check falhar'
  shell: |
      echo "=== PM2 STATUS ==="
      /home/deploy/.nvm/versions/node/v22/bin/pm2 show {{ gateway_pm2_process }} 2>&1 || true
      echo "=== PM2 ERROR LOG (últimas 80 linhas) ==="
      tail -n 80 /home/deploy/.pm2/logs/{{ gateway_pm2_process }}-error.log 2>/dev/null || echo "(sem log de erro)"
      echo "=== PM2 OUT LOG (últimas 40 linhas) ==="
      tail -n 40 /home/deploy/.pm2/logs/{{ gateway_pm2_process }}-out.log 2>/dev/null || echo "(sem log de saída)"
      echo "=== .env Gateway ==="
      cat {{ deploy_path }}/gateway/shared/.env 2>/dev/null || echo "(sem .env)"
  become: yes
  become_user: deploy
  register: gateway_pm2_error_logs
  when: gateway_health_check.failed | default(false)
  ignore_errors: yes

- name: 'Exibir logs de diagnóstico do Gateway'
  debug:
      msg: '{{ gateway_pm2_error_logs.stdout_lines | default([]) }}'
  when: gateway_health_check.failed | default(false)

- name: 'Rollback Gateway se health check falhar'
  shell: |
      PREV=$(ls -1dt {{ deploy_path }}/gateway/releases/* 2>/dev/null | sed -n 2p)
      if [ -n "$PREV" ]; then
        ln -sfn "$PREV" {{ deploy_path }}/gateway/current
        echo "Rollback Gateway executado para: $PREV"
      else
        echo "Nenhuma release Gateway anterior encontrada para rollback"
      fi
  when: gateway_health_check.failed | default(false)

- name: 'Reiniciar Gateway após rollback'
  command: '/home/deploy/.nvm/versions/node/v22/bin/pm2 restart {{ gateway_pm2_process }} --update-env'
  become: yes
  become_user: deploy
  when: gateway_health_check.failed | default(false)

- name: 'Falhar o deploy se health check do Gateway não passou'
  fail:
      msg: 'Health check do Gateway falhou após deploy. Rollback executado para release anterior.'
  when: gateway_health_check.failed | default(false)

# =====================================================
# LIMPEZA DE RELEASES ANTIGAS
# =====================================================

- name: 'Manter apenas as últimas 5 releases'
  shell: |
      ls -1dt {{ deploy_path }}/api/releases/* | tail -n +6 | xargs rm -rf
      ls -1dt {{ deploy_path }}/app/releases/* | tail -n +6 | xargs rm -rf
      ls -1dt {{ deploy_path }}/gateway/releases/* | tail -n +6 | xargs rm -rf
  ignore_errors: yes
