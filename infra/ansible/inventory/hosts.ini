# =====================================================
# AgentFlix - Inventário de Hosts
# =====================================================
# Autor: DevOps Agentflix
#
# IMPORTANTE: Production e staging usam aliases diferentes
# para o mesmo IP, evitando conflito de variáveis.
# =====================================================

[production]
prod-server ansible_host=186.202.209.180 ansible_user=deploy

[production:vars]
app_environment=production
ansible_python_interpreter=/usr/bin/python3
octane_port=9501
octane_supervisor_program=agentflix-octane

# Domínios Production
domain_www=www.agentflix.com.br
domain_app=app.agentflix.com.br
domain_api=api.agentflix.com.br
domain_gateway=gateway.agentflix.com.br

# Pastas
deploy_path=/data/production

[staging]
stage-server ansible_host=186.202.209.180 ansible_user=deploy

[staging:vars]
app_environment=staging
ansible_python_interpreter=/usr/bin/python3
octane_port=9502
octane_supervisor_program=agentflix-staging-octane

# Domínios Staging (prefixo stage.)
domain_www=stage.www.agentflix.com.br
domain_app=stage.app.agentflix.com.br
domain_api=stage.api.agentflix.com.br
domain_gateway=stage.gateway.agentflix.com.br

# Pastas
deploy_path=/data/stage

[all:vars]
ansible_port=22
agentflix_git_url=git@github.com:agentflix/codex.git
ansible_remote_tmp=/tmp/ansible
