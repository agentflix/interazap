# =====================================================
# InteraZap - Playbook Ansible
# =====================================================
# Deploy completo (production e/ou staging)
#
# Uso:
#   Todos os ambientes:   ansible-playbook playbook.yml
#   Apenas producao:      ansible-playbook playbook.yml --limit production
#   Apenas staging:       ansible-playbook playbook.yml --limit staging
#   Apenas deploy:        ansible-playbook playbook.yml --limit production --tags deploy
#
# Primeiro provisionamento (VPS nova, como root):
#   ansible-playbook playbook.yml -e ansible_user=root --limit production --tags provision
#
# Deploy após provisionamento (como deploy):
#   ansible-playbook playbook.yml --limit production --tags deploy
#
# Autor: DevOps Agentflix
# =====================================================

# ─────────────────────────────────────────────────────
# PLAY 1: Provisionamento inicial — conecta como root
# Roda: common, users, security
# Objetivo: criar o usuário deploy com SSH e sudo,
#           instalar pacotes base, hardening SSH.
# ─────────────────────────────────────────────────────
- name: 'Provisionamento — InteraZap (root)'
  hosts: all
  remote_user: "{{ provision_user | default('root') }}"
  become: yes
  gather_facts: yes
  vars_files:
      - vars/vault.yml
  tags: ['provision']

  pre_tasks:
      - name: 'Criar /tmp/ansible com permissao 0777'
        file:
            path: /tmp/ansible
            state: directory
            mode: '0777'

      - name: 'Validar variaveis obrigatorias'
        assert:
            that:
                - interazap_password is defined
                - postgres_root_password is defined
                - postgres_app_password is defined
                - redis_password is defined
                - agentflix_secret_key_production is defined
                - agentflix_secret_key_staging is defined
                - gateway_internal_api_key_production is defined
                - gateway_internal_api_key_staging is defined
                - gateway_jwt_secret_production is defined
                - gateway_jwt_secret_staging is defined
                - webchat_jwt_secret_production is defined
                - webchat_jwt_secret_staging is defined
            fail_msg: 'Variaveis do vault nao configuradas! Execute: ansible-vault create vars/vault.yml'

      - name: 'Exibir informacoes do ambiente'
        debug:
            msg:
                - 'Hostname: {{ inventory_hostname }}'
                - 'IP: {{ ansible_default_ipv4.address }}'
                - 'OS: {{ ansible_distribution }} {{ ansible_distribution_version }}'
                - 'Ambiente: {{ app_environment }}'
                - 'Pasta: {{ deploy_path }}'

  roles:
      - role: common
        tags: ['common', 'base', 'provision']

      - role: users
        tags: ['users', 'provision']

      - role: security
        tags: ['security', 'firewall', 'fail2ban', 'provision']

  handlers:
      - name: 'Atualizar servicos do sistema'
        systemd:
            daemon_reload: yes

      - name: 'Reiniciar SSH'
        service:
            name: ssh
            state: restarted
        when: ansible_os_family == "Debian"

      - name: 'Reiniciar UFW'
        service:
            name: ufw
            state: restarted

      - name: 'Reiniciar Fail2Ban'
        service:
            name: fail2ban
            state: restarted

# ─────────────────────────────────────────────────────
# PLAY 2: Setup e deploy — conecta como deploy
# Roda: ssl, nginx, php, redis, postgres, supervisor,
#       nodejs, app-deploy, landing-deploy
# Pré-requisito: PLAY 1 já executado (deploy user existe)
# ─────────────────────────────────────────────────────
- name: 'Setup e Deploy — InteraZap (deploy)'
  hosts: all
  become: yes
  gather_facts: yes
  vars_files:
      - vars/vault.yml
  tags: ['setup', 'deploy']

  pre_tasks:
      # NOTE: become: no — roda como deploy direto, cria o tmp dir necessário
      # para o module executor do Ansible quando HOME=/home/deploy via sudo env_keep.
      - name: 'Criar /home/deploy/.ansible/tmp para Ansible module executor'
        become: no
        file:
            path: /home/deploy/.ansible/tmp
            state: directory
            mode: '0777'
            recurse: yes
        ignore_errors: yes

      - name: 'Criar /tmp/ansible com permissao 0777'
        file:
            path: /tmp/ansible
            state: directory
            mode: '0777'

  roles:
      - role: ssl
        tags: ['ssl', 'certbot', 'setup', 'deploy']

      - role: nginx
        tags: ['nginx', 'web', 'setup', 'deploy']

      - role: php
        tags: ['php', 'runtime', 'setup']

      - role: redis
        tags: ['redis', 'cache', 'setup', 'deploy']

      - role: postgres
        tags: ['postgres', 'database', 'setup', 'deploy']

      - role: supervisor
        tags: ['supervisor', 'workers', 'setup', 'deploy']

      - role: nodejs
        tags: ['nodejs', 'pm2', 'setup']

      - role: app-deploy
        tags: ['deploy', 'app']

      - role: landing-deploy
        tags: ['landing', 'deploy']

  handlers:
      - name: 'Atualizar servicos do sistema'
        systemd:
            daemon_reload: yes

      - name: 'Reiniciar SSH'
        service:
            name: ssh
            state: restarted
        when: ansible_os_family == "Debian"

      - name: 'Reiniciar UFW'
        service:
            name: ufw
            state: restarted

      - name: 'Reiniciar Nginx'
        service:
            name: nginx
            state: restarted

      - name: 'Recarregar Nginx'
        service:
            name: nginx
            state: reloaded

      - name: 'Reiniciar PHP-FPM'
        service:
            name: php8.4-fpm
            state: restarted
        ignore_errors: yes

      - name: 'Reiniciar Redis'
        service:
            name: redis-server
            state: restarted

      - name: 'Reiniciar PostgreSQL'
        service:
            name: postgresql
            state: restarted

      - name: 'Reiniciar Supervisor'
        service:
            name: supervisor
            state: restarted
