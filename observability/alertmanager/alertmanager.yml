global:
    resolve_timeout: 5m
    slack_api_url: '${SLACK_WEBHOOK_URL}'

route:
    group_by: ['alertname', 'severity']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    receiver: 'slack-notifications'
    routes:
        - match:
              severity: critical
          receiver: 'slack-critical'
          repeat_interval: 1h
        - match:
              severity: warning
          receiver: 'slack-notifications'
          repeat_interval: 4h

receivers:
    - name: 'slack-critical'
      slack_configs:
          - channel: '#alerts-critical'
            send_resolved: true
            title: '🚨 {{ .GroupLabels.alertname }}'
            text: |
                {{ range .Alerts }}
                *Alert:* {{ .Annotations.summary }}
                *Description:* {{ .Annotations.description }}
                *Severity:* {{ .Labels.severity }}
                {{ if .Annotations.runbook_url }}*Runbook:* {{ .Annotations.runbook_url }}{{ end }}
                {{ end }}

    - name: 'slack-notifications'
      slack_configs:
          - channel: '#alerts'
            send_resolved: true
            title: '⚠️ {{ .GroupLabels.alertname }}'
            text: |
                {{ range .Alerts }}
                *Alert:* {{ .Annotations.summary }}
                *Description:* {{ .Annotations.description }}
                *Severity:* {{ .Labels.severity }}
                {{ end }}

inhibit_rules:
    - source_match:
          severity: 'critical'
      target_match:
          severity: 'warning'
      equal: ['alertname']
